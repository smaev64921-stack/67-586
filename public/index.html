<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<meta name="google" content="notranslate">
<!-- Без этих строк браузер сам дёргает /favicon.ico и /apple-touch-icon.png,
     а раньше на них прилетал весь index.html — по 567 КБ на каждый. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/logo.png">
<meta http-equiv="Content-Language" content="ru">
<title>Каталог</title>

<!-- Знакомство с магазином — только при самом первом заходе.
     Стоит здесь, до стилей и разметки: иначе человек успел бы увидеть
     кусок каталога и его бы дёрнуло на другую страницу.
     Ссылки с якорем (#p=, #reset=, #google_token=) и возвраты с оплаты
     или из бота пропускаем — это уже осмысленный переход, а не первый визит. -->
<script>
(function(){
  try{
    if(localStorage.getItem('lc_onboarded')) return;
    if(location.hash) return;
    if(sessionStorage.getItem('shop_place_v1')) return;   // человек уже ходит по магазину
    var q = new URLSearchParams(location.search);
    if(q.get('tg_admin') || q.get('paid')) return;
    location.replace('/onboarding.html');
  }catch(e){}   /* приватный режим без localStorage — просто открываем магазин */
})();
</script>

<!-- Приход из знакомства — вторая половина перехода.
     На /onboarding.html из кнопки разливается чёрный круг со знаком; здесь мы
     поднимаем такую же черноту и уже из неё проявляем магазин. Без этого между
     страницами мигал бы белый фон и переход разваливался бы надвое.
     Занавес рисуем псевдоэлементами на самом html: скрипт работает до <body>,
     вешать что-то в разметку ещё некуда. -->
<style>
html.lc-enter::before,
html.lc-enter::after{
  content:'';position:fixed;inset:0;pointer-events:none;
  opacity:1;transition:opacity .55s ease
}
html.lc-enter::before{z-index:99998;background:#0b0b0b}
html.lc-enter::after{
  z-index:99999;
  background:url('/logo-white.png') center center / auto clamp(74px,15vh,110px) no-repeat
}
html.lc-leaving::before{opacity:0}
html.lc-leaving::after{opacity:0;transition-duration:.4s}
@media (prefers-reduced-motion:reduce){
  html.lc-enter::before,html.lc-enter::after{transition-duration:.001s}
}
</style>
<script>
(function(){
  try{
    if(!sessionStorage.getItem('lc_enter')) return;
    /* Снимаем сразу: обновление страницы не должно поднимать занавес заново. */
    sessionStorage.removeItem('lc_enter');
    var root = document.documentElement;
    root.classList.add('lc-enter');
    var opened = false;
    function open(){
      if(opened) return;
      opened = true;
      root.classList.add('lc-leaving');
      setTimeout(function(){ root.classList.remove('lc-enter','lc-leaving'); }, 650);
    }
    /* Открываем, когда магазин отрисовался. Но обязательно и по таймауту, и по
       любой ошибке: занавес, который не убрался, — это чёрный экран вместо сайта. */
    window.addEventListener('load', function(){ setTimeout(open, 200); });
    window.addEventListener('error', open);
    setTimeout(open, 2500);
  }catch(e){}   /* приватный режим без sessionStorage — просто без перехода */
})();
</script>

<!-- ==================================================================
     МАГАЗИН ОДЕЖДЫ — мобильное приложение (все экраны в одном файле)

     Экраны: каталог · карточка товара · корзина · оформление ·
             регистрация/вход · мои заказы (+ детали доставки) ·
             профиль · избранное · боковое меню категорий

     АДМИН-ПАНЕЛЬ: войдите под ADMIN_EMAIL из .env (или кнопка «Админка» в боте
     у владельца TELEGRAM_CHAT_ID — авто-вход в админ-аккаунт).
     Telegram chat владельца ≠ админ сайта: владелец получает только «Новый заказ».
     Каталог, заказы и оплата идут через сервер /api.
     Название бренда и логотип — BRAND / CMS.brand (админка → Лого).
     ================================================================== -->

<style>
/* ===================== ТОКЕНЫ ===================== */
:root{
  --bg:#f4f4f4;
  --card:#fff;
  --ink:#0b0b0b;
  --ink-soft:#333;
  --muted:#8a8a8a;
  --muted2:#a8a8a8;
  --line:#ececec;
  --line2:#e0e0e0;
  --photo:#fff;
  --chip:#f5f5f5;
  --ok:#1f9d55;
  --danger:#d64545;
  --star:#e8a33d;

  /* Тона статусов заказа — единственный источник правды.
     Ими красятся и плашка у клиента (.ord__st, .sbadge), и бейдж
     в админке (.ad__badge). Раньше цвета были заданы дважды
     и разъезжались: «Доставлен» у клиента оставался серым. */
  --tone-warn-bg:rgba(0,0,0,.07);      --tone-warn-fg:var(--ink);
  --tone-ship-bg:rgba(234,140,40,.16); --tone-ship-fg:#c26a0a;
  --tone-ok-bg:rgba(31,157,85,.13);    --tone-ok-fg:#177a42;
  --tone-danger-bg:rgba(214,69,69,.12);--tone-danger-fg:var(--danger);

  /* Строгая геометрия: углы почти прямые. --r-pill остаётся только
     для круглых элементов (счётчики, аватарки, кружки-переключатели). */
  --r-lg:8px;
  --r-xl:10px;
  --r-md:6px;
  --r-sm:4px;
  --r-pill:999px;

  --pad:16px;
  /* нижней панели больше нет: навигация вся в шапке и в шторке */
  --tab-h:0px;
  --hd-h:58px;
  --hd-off:calc(var(--hd-h) + env(safe-area-inset-top));
  /* плашка связи висит поверх страницы — под шапкой, но ничего не сдвигает */
  --net-top:calc(var(--hd-off) + 10px);
  --dur:.2s;
  --ease:cubic-bezier(.4,0,.2,1);

  --sh-1:0 1px 3px rgba(0,0,0,.06);
  --sh-2:0 6px 24px rgba(0,0,0,.12);
  --sh-3:0 12px 40px rgba(0,0,0,.18);
}

*,*::before,*::after{box-sizing:border-box}
/* Chrome на Android подсвечивает тап синим прямоугольником — гасим везде.
   Обводка для клавиатуры (:focus-visible) ниже сохранена. */
*{-webkit-tap-highlight-color:transparent}
button,a,label,summary,[role="button"]{
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none
}
button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}
/* Масштаб экрана зафиксирован: приложение не «зумится» двумя пальцами и
   не прыгает от двойного тапа. Прокрутка (в том числе горизонтальная
   в слайдерах) остаётся обычной. */
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{touch-action:pan-x pan-y}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
s{color:var(--muted2)}

.ic{display:block;width:22px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic--sm{width:18px;height:18px}
.ic--lg{width:26px;height:26px}

/* ===================== КАРКАС ===================== */
.app{
  max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;position:relative;
}
.scr{flex:1;padding-bottom:calc(var(--tab-h) + 40px)}

/* ---- шапка ----
   Сплошная полоса во всю ширину, прижата к верху экрана. Раньше она
   «парила» карточкой с отступами — фото под ней обрезалось рамкой. */
.hd{
  position:fixed;top:0;left:0;right:0;z-index:40;background:var(--card);
  display:flex;align-items:center;gap:4px;
  padding:0 10px;padding-top:env(safe-area-inset-top);
  min-height:var(--hd-off);margin:0 auto;max-width:520px;
  border-bottom:1px solid var(--line)
}
/* шапка вынута из потока — возвращаем экрану её высоту */
.scr{padding-top:var(--hd-off)}
/* нижняя панель убрана */
.tabs{display:none !important}
/* бургер и логотип держатся вместе */
.hd__l{display:flex;align-items:center;gap:1px;flex:none}
.hd__logo{
  display:flex;padding:0;border-radius:var(--r-sm);
  transition:background var(--dur) var(--ease)
}
.hd__logo:hover{background:var(--chip)}
.lg{display:block;flex:none}
.lg img{width:100%;height:100%;object-fit:contain;display:block;background:transparent}
/* прозрачный логотип — без «квадратика» фона */
.lg--mark img{background:transparent}
/* Знак вытянут по вертикали (примерно 3:5). В квадратном слоте он
   ужимался бы до нечитаемой полоски, поэтому задаём высоту, а ширину
   отдаём пропорциям картинки. */
.hd__mark{width:auto;height:38px;max-width:46px}
/* главная шапка: бургер + лого с названием слева, действия справа */
.hd--main{gap:2px}
.hd--main .hd__l{min-width:0;flex:0 1 auto;gap:2px}
.hd--main .hd__mark{width:auto;height:32px;max-width:38px}
.hd--main .hd__sp{min-width:4px}
.hd__logo--name{align-items:center;gap:8px;padding:2px 2px;min-width:0}
.hd__brand{
  font-size:16px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0
}
@media (max-width:339px){.hd__brand{font-size:14px;letter-spacing:.1em}}
.hd__ttl{font-size:16px;font-weight:600;flex:1;text-align:center}
.hd__sp{flex:1}
/* «противовес» кнопкам слева — держит заголовок ровно по центру */
.hd__gap{width:79px;height:1px;flex:none}
.hd__acts{display:flex;align-items:center;gap:0;flex:none}
.hd__b{padding:8px;position:relative;display:flex;border-radius:var(--r-sm);transition:background var(--dur) var(--ease)}
.hd__acts .ic{width:23px;height:23px;stroke-width:1.6}
.hd__b:hover{background:var(--chip)}
.hd__n{
  position:absolute;right:2px;bottom:3px;min-width:16px;height:16px;padding:0 4px;
  background:var(--ink);color:#fff;border-radius:var(--r-pill);
  font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--card)
}


/* ---- нижний таб-бар ---- */
.tabs{
  position:fixed;left:12px;right:12px;z-index:40;
  bottom:calc(14px + env(safe-area-inset-bottom));
  background:var(--card);border-radius:var(--r-lg);
  display:flex;padding:6px;height:var(--tab-h);
  max-width:496px;margin:0 auto;
  box-shadow:0 6px 28px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.08);
  transition:transform .34s var(--ease), opacity .24s var(--ease)
}
/* скользящая подсветка активной вкладки */
.tabs__pill{
  position:absolute;top:6px;bottom:6px;left:6px;
  width:calc((100% - 12px) / 5);
  background:var(--ink);border-radius:calc(var(--r-lg) - 6px);
  transform:translateX(calc(var(--i, 0) * 100%));
  transition:transform .44s cubic-bezier(.34,1.28,.5,1);
  pointer-events:none
}
.tab{
  flex:1;position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10px;color:var(--muted);border-radius:calc(var(--r-lg) - 6px);
  transition:color .3s var(--ease)
}
.tab[aria-current="page"]{color:#fff}
.tab .ic{width:21px;height:21px}
.tab__n{
  position:absolute;top:5px;left:calc(50% + 2px);min-width:15px;height:15px;padding:0 4px;
  background:var(--ink);color:#fff;border-radius:var(--r-pill);font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--card);transition:all .3s var(--ease)
}
.tab[aria-current="page"] .tab__n{background:#fff;color:var(--ink);border-color:var(--ink)}

/* ===================== АНИМАЦИИ ===================== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes press{from{transform:scale(.97)}to{transform:none}}
@keyframes imgIn{from{opacity:0}to{opacity:1}}
@keyframes qtyPop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* смена экрана: только прозрачность — трансформация на .scr сломала бы
   position:fixed у плавающей кнопки внутри */
.scr.anim{animation:fadeIn .26s var(--ease)}

/* карточки выезжают по очереди — только при смене экрана, не при soft-refresh */
.card{animation:riseIn .44s var(--ease) both}
.plist,.sec,.ord,.pcard{animation:riseIn .38s var(--ease) both}
.pd__body{animation:riseIn .4s var(--ease) .05s both}
.pd__hero{animation:fadeIn .4s var(--ease) both}
.scr.quiet .card,
.scr.quiet .plist,
.scr.quiet .sec,
.scr.quiet .ord,
.scr.quiet .pcard,
.scr.quiet .pd__body,
.scr.quiet .pd__hero,
.scr.quiet .pm,
.scr.quiet .home__mark,
.scr.quiet .hs,
.scr.quiet .ft{animation:none !important}
.scr.quiet .ft__col[open] .ft__a,
.scr.quiet .ft__col[open] .ft__tg{animation:none !important}

.card__img,.pd__main,.ci__i,.ord__i,.thumb img{
  animation:imgIn .45s var(--ease) both
}
.scr.quiet .card__img,.scr.quiet .pd__main,.scr.quiet .ci__i,.scr.quiet .ord__i,.scr.quiet .thumb img,
.scr.quiet img{
  animation:none !important
}

/* отклик на нажатие */
.btn{transition:transform .16s var(--ease), opacity var(--dur) var(--ease), background .28s var(--ease)}
.btn:active,.ghb:active,.card__buy:active,.gen__b:active,.size:active{transform:scale(.97)}
.tab:active{transform:scale(.94)}
.qty button:active{transform:scale(.88);background:#e6e6e6}
.pitem:active{background:var(--chip)}
.qty span.pop{animation:qtyPop .28s var(--ease)}

.toast.is-out{animation:toastOut .22s var(--ease) forwards}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,10px)}}


@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important
  }
}

/* сердечко */
@keyframes heartBeat{
  0%{transform:scale(1)}
  28%{transform:scale(.78)}
  58%{transform:scale(1.25)}
  78%{transform:scale(.95)}
  100%{transform:scale(1)}
}
.beat{animation:heartBeat .5s var(--ease)}
.burst{position:relative}
.burst::after{
  content:'';position:absolute;inset:-6px;border-radius:var(--r-pill);
  border:2px solid var(--ink);animation:ring .5s var(--ease) forwards;pointer-events:none
}
@keyframes ring{
  from{transform:scale(.55);opacity:.5}
  to{transform:scale(1.75);opacity:0}
}

.home__logo{display:flex;justify-content:center;padding:32px 0 28px}
.home__mark{width:148px;height:148px;animation:popIn .5s var(--ease) both}

/* ===================== СЛАЙДЕР НА ГЛАВНОЙ ===================== */
.hs{position:relative;margin:0 var(--pad) 14px;animation:riseIn .5s var(--ease) both}
/* если лого убрано, слайдер идёт сразу за шапкой — нужен воздух сверху */
#scr > .hs:first-child{margin-top:18px}
.hs__track{
  display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
  border-radius:var(--r-lg);background:var(--photo);
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;
  box-shadow:0 8px 26px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06)
}
.hs__track::-webkit-scrollbar{display:none}
.hs__s{
  position:relative;flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;
  aspect-ratio:16/10;overflow:hidden;background:var(--photo)
}
.hs__img{width:100%;height:100%;object-fit:contain;object-position:center;user-select:none;-webkit-user-drag:none}
/* слой поверх фото: промо-баннер + точки */
.hs__over{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  display:flex;flex-direction:column;gap:10px;padding:40px 12px 12px;
  border-radius:0 0 var(--r-lg) var(--r-lg);pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.42))
}
.hs__banner{
  background:rgba(11,11,11,.9);color:#fff;border-radius:var(--r-sm);
  padding:12px 18px;font-size:13px;font-weight:600;line-height:1.35;text-align:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)
}
.hs__dots{display:flex;justify-content:center;align-items:center;gap:6px;pointer-events:auto}
.hs__dot{
  width:7px;height:7px;border-radius:var(--r-pill);background:rgba(255,255,255,.55);flex:none;
  box-shadow:0 1px 2px rgba(0,0,0,.25);
  transition:width var(--dur) var(--ease), background var(--dur) var(--ease)
}
.hs__dot:hover{background:rgba(255,255,255,.8)}
.hs__dot.on{width:22px;background:#fff}

/* ===================== ГЛАВНОЕ ФОТО (ГЕРОЙ) =====================
   Фото админа занимает почти весь экран: высота = экран минус парящая
   шапка. Текст и кнопка лежат поверх фото и не заходят под таб-бар. */
.hs--hero{margin:0 0 16px;border-radius:0}
#scr > .hs--hero:first-child{margin-top:0}
.hs--hero .hs__track{border-radius:0;box-shadow:none;background:var(--photo)}
/* фото видно целиком: высота по самой картинке, с потолком чуть меньше
   экрана — снизу должен выглядывать следующий блок */
/* без min-height: одно фото занимает ровно свою высоту, полей не остаётся.
   Если фото несколько и они разной высоты, поля будут в цвет карточки. */
.hs--hero .hs__s{
  aspect-ratio:auto;height:auto;background:var(--photo);
  display:flex;align-items:center;justify-content:center
}
.hs--hero .hs__img{
  width:100%;height:auto;object-fit:contain;
  max-height:calc(100vh - var(--hd-off) - 96px);
  max-height:calc(100svh - var(--hd-off) - 96px)
}
.hs__shade{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,.12) 58%,rgba(0,0,0,.62) 100%)
}
.hs__txt{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  /* снизу оставляем место под общую кнопку — она теперь вне слайда */
  padding:0 22px calc(var(--tab-h) + 104px + env(safe-area-inset-bottom));
  text-align:center;color:#fff
}
.hs__k{
  font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  opacity:.9;text-shadow:0 1px 10px rgba(0,0,0,.5)
}
.hs__t{
  font-size:26px;font-weight:800;line-height:1.16;letter-spacing:.06em;text-transform:uppercase;
  text-shadow:0 2px 18px rgba(0,0,0,.55);max-width:15ch
}
.hs__d{
  font-size:13.5px;line-height:1.5;opacity:.92;max-width:32ch;
  text-shadow:0 1px 10px rgba(0,0,0,.5);margin-top:-4px
}
/* Общая кнопка слайдера: не листается вместе с фото и всегда на месте. */
.hs__cta-wrap{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  display:flex;justify-content:center;
  padding:0 22px calc(var(--tab-h) + 42px + env(safe-area-inset-bottom));
  pointer-events:none
}
.hs__cta-wrap .hs__cta{pointer-events:auto}
.hs__cta{
  display:block;width:100%;max-width:340px;padding:15px 18px;text-align:center;
  border:1.5px solid rgba(255,255,255,.9);border-radius:2px;background:rgba(0,0,0,.18);
  color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:background var(--dur) var(--ease), transform .16s var(--ease)
}
.hs__cta:hover{background:rgba(255,255,255,.16)}
.hs__cta:active{transform:scale(.98)}
/* промо-плашка на герое уезжает наверх — низ занят заголовком и кнопкой */
.hs--hero .hs__over{
  top:0;bottom:auto;justify-content:flex-start;
  padding:14px 12px 40px;border-radius:0;
  background:linear-gradient(180deg,rgba(0,0,0,.34),transparent)
}
.hs--hero .hs__banner{max-width:340px;margin:0 auto;font-size:12px;padding:10px 16px}
.hs__ar{
  position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  color:#fff;opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.6)
}
.hs__ar--l{left:2px}
.hs__ar--r{right:2px}
.hs__ar:hover{opacity:1}

/* ===================== 4 БЛОКА ПРЕИМУЩЕСТВ ===================== */
/* без карточки — иконки и подписи лежат прямо на фоне страницы */
.usp{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  margin:0 var(--pad);padding:24px 4px 20px
}
.usp__i{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;padding:0 2px}
.usp__ic{
  display:flex;align-items:center;justify-content:center;width:42px;height:42px;
  border:1.4px solid var(--ink);border-radius:var(--r-pill)
}
.usp__ic .ic{width:20px;height:20px}
.usp__t{
  font-size:9px;font-weight:700;line-height:1.45;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink)
}
@media (max-width:330px){
  .usp{padding:16px 2px 14px}
  .usp__ic{width:36px;height:36px}
  .usp__t{font-size:8.2px}
}

/* заголовок раздела со ссылкой «Смотреть все» */
.sec__h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px var(--pad) 6px}
.sec__t{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.sec__all{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);
  transition:color var(--dur) var(--ease)}
.sec__all:hover{color:var(--ink)}

/* ===================== БОКОВОЕ МЕНЮ (БУРГЕР) ===================== */
.mnu{
  position:fixed;top:0;bottom:0;left:0;z-index:120;width:min(84vw,340px);
  background:var(--card);display:flex;flex-direction:column;
  box-shadow:0 0 44px rgba(0,0,0,.28);animation:mnuIn .26s var(--ease) both
}
@keyframes mnuIn{from{transform:translateX(-100%)}to{transform:none}}
.mnu__h{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 12px 12px;border-bottom:1px solid var(--line)
}
.mnu__logo{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase}
.mnu__mark{width:34px;height:34px}
.mnu__b{flex:1;overflow-y:auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
.mnu__g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mnu__gen{
  padding:13px 8px;border:1.5px solid var(--ink);border-radius:var(--r-sm);
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  transition:all var(--dur) var(--ease)
}
.mnu__gen:hover{background:var(--ink);color:#fff}
.mnu__sec{border-top:1px solid var(--line);padding:6px 0}
.mnu__sec:first-child{border-top:0}
.mnu__cap{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted2);padding:10px 8px 4px}
.mnu__i{
  display:flex;align-items:center;gap:10px;width:100%;padding:14px 8px;
  font-size:15px;border-radius:var(--r-sm);transition:background var(--dur) var(--ease)
}
.mnu__i:hover{background:var(--chip)}
.mnu__i > span{flex:1;text-align:left}
.mnu__n{
  flex:none;min-width:19px;height:19px;padding:0 6px;background:var(--ink);color:#fff;
  border-radius:var(--r-pill);font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center
}
.mnu__i .ic{color:var(--ink)}
.mnu__i .ic--sm:last-child{color:var(--muted2)}

/* ===================== КАТАЛОГ ===================== */
.crumbs{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:16px var(--pad) 0;font-size:13px;color:var(--muted)}
.crumbs i{font-style:normal;color:var(--line2)}
.crumbs b{font-weight:400;color:var(--ink)}
.crumbs a{transition:color var(--dur) var(--ease)}
.crumbs a:hover{color:var(--ink)}

.ph{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px var(--pad) 16px}
.ph__t{font-size:20px;font-weight:700;letter-spacing:.01em;text-transform:uppercase;line-height:1.2}
.ph__m{width:58px;height:58px;opacity:.9}

.gen{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 var(--pad)}
.gen__b{
  padding:14px 8px;border:1.5px solid var(--ink);border-radius:var(--r-sm);background:var(--card);
  font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;text-align:center;
  transition:all var(--dur) var(--ease)
}
.gen__b:hover{background:var(--chip)}
.gen__b[aria-current="page"]{background:var(--ink);color:#fff}
.gen__b[aria-current="page"]:hover{background:var(--ink-soft)}

.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px var(--pad) 14px}
.ctrl__b{display:flex;align-items:center;gap:8px;font-size:14px;transition:opacity var(--dur) var(--ease)}
.ctrl__b:hover{opacity:.6}
.ctrl__n{
  background:var(--ink);color:#fff;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;padding:4px var(--pad) 20px}
/* товар — цельная белая карточка: фото сверху, под ним название и цена */
.card{
  display:flex;flex-direction:column;text-align:left;position:relative;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--sh-1);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease)
}
@media(hover:hover){
  .card:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
  .card:hover .card__img{transform:scale(1.03)}
}
.card__ph{
  position:relative;background:#fff;border-radius:0;overflow:hidden;aspect-ratio:3/4
}
.card__meta{display:flex;flex-direction:column;gap:8px;padding:12px 12px 14px;flex:1}
.card__track{
  display:flex;height:100%;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;touch-action:pan-x
}
.card__track::-webkit-scrollbar{display:none}
.card__slide{
  flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  background:#fff
}
/* contain, а не cover: фото товара должно быть видно целиком.
   Поля по бокам закрывает белый фон .card__slide. */
.card__img{
  width:100%;height:100%;object-fit:contain;object-position:center;image-rendering:auto;display:block;
  pointer-events:none;transition:transform .4s var(--ease)
}
.card__dots{
  position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:center;gap:4px;
  pointer-events:none;z-index:2
}
.card__dot{
  width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.22);box-shadow:0 0 0 1px rgba(255,255,255,.35)
}
.card__dot.on{background:rgba(0,0,0,.72)}
.card__fav{
  position:absolute;top:9px;right:9px;width:32px;height:32px;border-radius:var(--r-pill);
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.78);
  backdrop-filter:blur(4px);transition:transform var(--dur) var(--ease);z-index:3
}
.card__fav:hover{transform:scale(1.1)}
.card__fav .ic{width:18px;height:18px;stroke-width:1.8}
.card__fav[aria-pressed="true"] .ic{fill:var(--ink);stroke:var(--ink)}
.card__n{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;line-height:1.35}
/* размеры прямо в каталоге — видно, есть ли твой, ещё до захода в карточку */
.card__sz{display:flex;flex-wrap:wrap;gap:4px}
.card__sz i{
  font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  padding:3px 6px;border-radius:var(--r-sm);background:var(--chip);color:var(--ink-soft)
}
.card__sz .card__sz-n{background:transparent;color:var(--muted2)}
.card__pr{
  display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;min-width:0;margin-top:auto;
  font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2
}
.card__pr s{font-size:11.5px;font-weight:400;color:var(--muted2);text-decoration:line-through}
/* Ярлыки одной колонкой слева: справа сверху живёт «в избранное» */
.card__tags{
  position:absolute;left:9px;top:9px;z-index:2;
  display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  max-width:calc(100% - 52px);pointer-events:none
}
.card__tags .card__badge{position:static;left:auto;top:auto}
.card__off{
  padding:5px 8px;border-radius:var(--r-sm);
  font-size:10.5px;font-weight:700;letter-spacing:.04em;
  background:#c62828;color:#fff;box-shadow:0 2px 8px rgba(198,40,40,.3)
}
/* кнопка покупки — во всю ширину карточки, с иконкой и словом */
.card__buy{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:40px;
  margin-top:2px;padding:0 10px;border-radius:var(--r-sm);
  border:1.5px solid var(--ink);background:var(--ink);color:#fff;
  font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease),
             border-color var(--dur) var(--ease), transform .14s var(--ease)
}
.card__buy-ic{display:flex;flex:none}
.card__buy .ic{width:16px;height:16px;stroke-width:1.9}
.card__buy:hover{opacity:.88}
.card__buy:active{transform:scale(.965)}
.card__buy.is-in{background:var(--card);color:var(--ink)}
.card__buy:disabled{
  border-color:var(--line2);background:var(--chip);color:var(--muted2);cursor:not-allowed;opacity:1
}
.card__out{font-size:11px;color:var(--muted2);letter-spacing:.04em;text-transform:uppercase}
.qsize{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 4px}
/* строки «размер + количество» под пилюлями размеров */
.qlines{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.qlines:empty{margin-top:0}
.qline{
  display:flex;align-items:center;gap:12px;padding:9px 12px;
  background:var(--chip);border-radius:var(--r-md)
}
.qline__s{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.qline .qty{background:var(--card)}
.qline__p{font-size:13.5px;font-weight:700;white-space:nowrap}
.qsize__b{
  min-width:52px;height:44px;padding:0 14px;border:1.5px solid var(--line2);border-radius:6px;
  font-size:14px;font-weight:600;background:var(--card);transition:all var(--dur) var(--ease)
}
/* выбор цвета в карточке товара */
.cols{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:4px}
.col{
  width:38px;height:38px;border-radius:var(--r-pill);padding:3px;
  border:1.5px solid var(--line2);background:var(--card);
  display:flex;align-items:center;justify-content:center;
  transition:border-color var(--dur) var(--ease), transform .14s var(--ease)
}
.col i{display:block;width:100%;height:100%;border-radius:var(--r-pill);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.col:hover{border-color:var(--muted)}
.col:active{transform:scale(.94)}
.col[aria-pressed="true"]{border-color:var(--ink);border-width:2px;padding:2px}

.qsize__b:hover{border-color:var(--ink)}
.qsize__b:active{transform:scale(.96)}
.qsize__b[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}


.none{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px;line-height:1.8;font-size:14px}
/* пустой экран: иконка, текст и всегда два выхода — в каталог и назад */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 20px 40px}
.empty__ic{
  width:74px;height:74px;border-radius:var(--r-pill);background:var(--chip);
  display:flex;align-items:center;justify-content:center;margin-bottom:20px
}
.empty__ic .ic{width:30px;height:30px;color:var(--muted2);stroke-width:1.5}
.empty__t{font-size:17px;font-weight:700;letter-spacing:-.01em}
.empty__d{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:8px;max-width:280px}
.empty__acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:24px}
.empty__acts .ghb{display:flex;align-items:center;justify-content:center;gap:7px}

/* ===================== КАРТОЧКА ТОВАРА =====================
   Ключевое: экран — колонка на всю высоту вьюпорта.
   Фото забирает остаток места, остальное прижато и всегда видно. */
.pd{
  display:flex;flex-direction:column;
  /* svh, а не dvh: при скрытии адресной строки dvh «дышит»,
     блок прыгает и прокрутка ведёт себя непредсказуемо */
  height:calc(100svh - var(--hd-off) - 12px);
  min-height:440px;
  margin:10px 12px 0;
  background:var(--card);
  border-radius:var(--r-lg)
}
.pd__hero{position:relative;flex:1 1 0;min-height:150px;background:#fff;
  overflow:hidden;border-radius:var(--r-lg) var(--r-lg) 0 0}
.pd__track{
  display:flex;height:100%;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x
}
.pd__track::-webkit-scrollbar{display:none}
.pd__slide{
  flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#fff
}
.pd__zoom{
  display:block;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:zoom-in
}
/* карточка товара: фото целиком, без срезанных рукавов и подола */
.pd__main{width:100%;height:100%;object-fit:contain;object-position:center;pointer-events:none;display:block}
.pd__side{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:9px;z-index:3}
.pd__rb{
  width:38px;height:38px;border-radius:var(--r-pill);background:#fff;box-shadow:var(--sh-1);
  display:flex;align-items:center;justify-content:center;transition:transform var(--dur) var(--ease)
}
.pd__rb:hover{transform:scale(1.08)}
.pd__rb .ic{width:18px;height:18px}
.pd__rb[aria-pressed="true"] .ic{fill:var(--ink)}

.thumbs{
  flex:none;display:flex;gap:6px;overflow-x:auto;
  padding:8px var(--pad);scrollbar-width:none;background:var(--card)
}
.thumbs::-webkit-scrollbar{display:none}
.thumb{
  width:46px;height:58px;border-radius:var(--r-sm);overflow:hidden;flex:none;
  border:1.5px solid transparent;background:var(--photo);transition:border-color var(--dur) var(--ease)
}
.thumb[aria-current="true"]{border-color:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:contain;object-position:center}

.pd__body{flex:none;padding:4px var(--pad) 16px}
.pd__t{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.25}
.pd__sku{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
  margin-top:4px;padding:4px 8px 4px 0;border-radius:var(--r-sm);
  transition:color var(--dur) var(--ease)
}
.pd__sku b{font-weight:600;color:var(--ink-soft)}
.pd__sku:hover{color:var(--ink)}
.pd__sku .ic{opacity:.55}
.ic--xs{width:13px;height:13px}
.pd__price{font-size:21px;font-weight:700;margin-top:10px}
.pd__price s{font-size:14px;font-weight:400;margin-left:6px}
.pd__lab{font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 8px}

.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{
  min-width:46px;padding:10px 14px;border:1.5px solid var(--line2);border-radius:var(--r-sm);
  background:var(--card);font-size:14px;font-weight:600;text-align:center;
  transition:all var(--dur) var(--ease)
}
.size:hover{border-color:var(--muted)}
.size[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
/* размера нет на складе — видно сразу, нажать нельзя */
.size--out{
  color:var(--muted2);border-color:var(--line);background:var(--chip);
  text-decoration:line-through;cursor:not-allowed
}
.size--out:hover{border-color:var(--line)}
.pd__stock{
  margin-top:10px;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px
}
.pd__stock::before{
  content:'';width:6px;height:6px;border-radius:50%;background:#e8a33d;flex:none
}
.pd__stock--out{color:var(--danger)}
.pd__stock--out::before{background:var(--danger)}

.pd__cta{display:flex;margin-top:16px}
.pd__cta .btn{flex:1;padding:15px}
/* Сердечко рядом с «В корзину» спрятано, пока видно сердечко на фото.
   Как только фото уходит за край экрана — выезжает, раздвигая кнопку. */
.pd__hb{
  width:54px;flex:none;border:1.5px solid var(--line2);border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  max-width:0;opacity:0;margin-left:0;border-width:0;overflow:hidden;
  transition:max-width .42s var(--ease), opacity .28s var(--ease),
             margin-left .42s var(--ease), border-width .18s var(--ease),
             border-color var(--dur) var(--ease)
}
.pd__cta.on .pd__hb{max-width:54px;opacity:1;margin-left:9px;border-width:1.5px}
.pd__hb:hover{border-color:var(--ink)}
.pd__hb[aria-pressed="true"] .ic{fill:var(--ink)}

.pd__try{
  width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 16px;border-radius:var(--r-md);border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);font-size:13.5px;font-weight:600;
  transition:background .2s var(--ease), color .2s var(--ease), transform .12s var(--ease)
}
.pd__try:hover{background:var(--ink);color:#fff}
.pd__try:active{transform:scale(.985)}
.pd__try .ic{width:18px;height:18px}

/* ===================== ПРИМЕРКА ===================== */
.try{padding:8px var(--pad) 28px;max-width:520px;margin:0 auto}
.try__hero{
  position:relative;border-radius:8px;overflow:hidden;aspect-ratio:3/4;
  background:linear-gradient(160deg,#1a1a1a 0%,#0b0b0b 55%,#2a2a2a 100%);
  margin-bottom:18px;display:grid;place-items:center
}
.try__hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.try__hero-mark{position:relative;z-index:1;text-align:center;color:#fff;padding:24px}
.try__hero-k{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  opacity:.7;margin-bottom:10px
}
.try__hero-t{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.try__hero-d{margin-top:10px;font-size:13.5px;line-height:1.5;opacity:.75;max-width:260px;margin-left:auto;margin-right:auto}
.try__h{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.try__lead{font-size:14px;color:var(--muted);line-height:1.55;margin:0 0 18px}
.try__steps{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.try__step{
  display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:8px;
  background:var(--card);border:1.5px solid var(--line)
}
.try__n{
  width:28px;height:28px;border-radius:9px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none
}
.try__st{font-size:13.5px;font-weight:600;margin-bottom:2px}
.try__sd{font-size:12.5px;color:var(--muted);line-height:1.45}
.try__prod{
  display:flex;gap:12px;align-items:center;padding:12px;border-radius:8px;
  background:var(--card);border:1.5px solid var(--line);margin-bottom:16px
}
.try__prod img{width:52px;height:66px;object-fit:contain;object-position:center;border-radius:6px;background:var(--photo)}
.try__prod-n{font-size:13.5px;font-weight:600}
.try__prod-m{font-size:12px;color:var(--muted);margin-top:2px}
.try__agree{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.45;margin:0 0 16px}
.try__agree input{margin-top:2px;width:18px;height:18px;accent-color:var(--ink);flex:none}
.try__drop{
  position:relative;border:1.5px dashed var(--line2);border-radius:8px;background:var(--card);
  padding:36px 18px;text-align:center;margin-bottom:14px;transition:border-color .2s var(--ease), background .2s var(--ease)
}
.try__drop.is-on{border-color:var(--ink);border-style:solid}
.try__drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.try__drop-ic{
  width:52px;height:52px;border-radius:8px;background:var(--chip);display:grid;place-items:center;
  margin:0 auto 12px
}
.try__drop-ic .ic{width:24px;height:24px}
.try__drop-t{font-size:15px;font-weight:700}
.try__drop-d{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.try__pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.try__pick-b{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:132px;padding:18px 12px;border-radius:8px;border:1.5px solid var(--line2);
  background:var(--card);font-size:13.5px;font-weight:600;text-align:center;
  transition:border-color .2s var(--ease), transform .12s var(--ease), background .2s var(--ease)
}
.try__pick-b:hover{border-color:var(--ink);background:#fafafa}
.try__pick-b:active{transform:scale(.98)}
.try__pick-b .ic{width:26px;height:26px}
.try__pick-d{font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.35}
.try__file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0,0,0,0)}
.try__prev{
  width:100%;max-height:360px;object-fit:cover;border-radius:8px;margin-bottom:14px;
  background:var(--photo);border:1.5px solid var(--line)
}
.try__stage{
  position:relative;border-radius:8px;overflow:hidden;background:var(--photo);
  aspect-ratio:3/4;margin-bottom:16px;display:grid;place-items:center
}
.try__stage img{width:100%;height:100%;object-fit:cover}
.try__wait{text-align:center;padding:20px;color:#fff}
.try__spin{
  width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.25);
  border-top-color:#fff;margin:0 auto 14px;animation:trySpin .8s linear infinite
}
@keyframes trySpin{to{transform:rotate(360deg)}}
.try__wait-t{font-size:16px;font-weight:700}
.try__wait-d{font-size:13px;opacity:.75;margin-top:6px;line-height:1.45}
.try__badge{
  position:absolute;left:12px;top:12px;z-index:2;padding:6px 10px;border-radius:var(--r-sm);
  background:rgba(11,11,11,.82);color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase
}
.try__actions{display:flex;flex-direction:column;gap:10px}
.try__note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px;text-align:center}

/* кнопка «схлопывается» и меняет роль */
.btn--rm{background:var(--card);color:var(--ink);border:1.5px solid var(--line2)}
.btn--rm:hover{border-color:var(--ink);opacity:1}
/* Своё имя: раньше кнопка делила имя с анимацией модальных окон,
   а при совпадении побеждает последнее объявление — кнопку уносило вбок. */
@keyframes cartPop{
  0%{transform:scale(1)}
  22%{transform:scale(.9)}
  52%{transform:scale(1.05)}
  76%{transform:scale(.985)}
  100%{transform:scale(1)}
}
.btn.pop{animation:cartPop .5s cubic-bezier(.34,1.15,.5,1)}
/* фон и рамка перетекают, а не переключаются мгновенно */
.pd__cta .btn{transition:background .28s var(--ease), color .28s var(--ease), border-color .28s var(--ease)}
.pd__cta .btn:active{transform:none}
@keyframes lblIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pd__cta .btn > span{display:inline-block;animation:lblIn .3s var(--ease) both}

/* кружок, летящий между кнопкой и корзиной */
.fly{
  position:fixed;width:34px;height:34px;border-radius:var(--r-pill);
  background:var(--photo) center/cover no-repeat;
  box-shadow:0 4px 14px rgba(0,0,0,.28);
  z-index:400;pointer-events:none
}
@keyframes shake{
  0%,100%{transform:scale(1)}
  35%{transform:scale(1.28)}
  65%{transform:scale(.92)}
}
.hd__b.hit{animation:shake .42s var(--ease)}

/* описание — ниже сгиба, не мешает основному экрану */
.pd__extra{background:var(--card);margin-top:8px;padding:18px var(--pad) 26px}
.pd__el{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.pd__ed{font-size:13.5px;color:var(--ink-soft);line-height:1.7}

/* на экране товара нижняя панель прячется — места больше */
body.no-tabs .tabs{
  transform:translateY(140%);opacity:0;pointer-events:none;
  transition:transform .3s var(--ease), opacity .2s var(--ease)
}
body.no-tabs .scr{padding-bottom:24px}
body.has-mini .scr{padding-bottom:calc(var(--tab-h) + 96px)}

/* ===================== КНОПКИ ===================== */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--ink);color:#fff;padding:16px;border-radius:var(--r-md);
  font-size:14px;font-weight:600;transition:opacity var(--dur) var(--ease)
}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn--gh{background:var(--card);color:var(--ink);border:1.5px solid var(--line2)}
.btn--gh:hover{border-color:var(--ink);opacity:1}
.btn--dgr{background:var(--danger)}
.btn--sm{padding:12px;font-size:13px}

/* ===================== КОРЗИНА / ЗАКАЗ ===================== */
.sec{background:var(--card);border-radius:var(--r-lg);margin:12px var(--pad);padding:16px}
.sec--flat{margin:0;border-radius:0}

.ci{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci__i{width:64px;height:80px;border-radius:var(--r-sm);object-fit:contain;object-position:center;background:var(--photo);flex:none}
.ci__b{flex:1;min-width:0}
.ci__n{font-size:14px;font-weight:600;line-height:1.35}
.ci__m{font-size:12.5px;color:var(--muted);margin-top:3px}
.ci__r{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.ci__p{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.ci__x{padding:6px;color:var(--muted);transition:color var(--dur) var(--ease);flex:none}
/* другие размеры того же товара — вторая вещь без возврата в каталог */
.ci__sizes{margin-top:12px}
.ci__sizes-l{
  display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted2);margin-bottom:7px
}
.ci__sizes-r{display:flex;flex-wrap:wrap;gap:6px}
.ci__sz{
  position:relative;min-width:38px;padding:7px 9px;border:1.5px solid var(--line2);
  border-radius:var(--r-sm);background:var(--card);font-size:12.5px;font-weight:600;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease)
}
.ci__sz:hover{border-color:var(--ink)}
.ci__sz.is-cur{border-color:var(--ink)}
.ci__sz.is-in{background:var(--ink);border-color:var(--ink);color:#fff}
.ci__sz i{
  position:absolute;top:-6px;right:-6px;display:flex;align-items:center;justify-content:center;
  width:17px;height:17px;border-radius:var(--r-pill);background:var(--ink);color:#fff;
  border:1.5px solid var(--card);font-style:normal;font-size:9.5px;font-weight:700
}
.ci__sz.is-in i{background:var(--card);color:var(--ink);border-color:var(--ink)}
.ci__del{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:7px 10px;
  border:1.5px solid var(--line2);border-radius:var(--r-sm);
  font-size:12.5px;font-weight:600;color:var(--muted);
  transition:color var(--dur) var(--ease), border-color var(--dur) var(--ease)
}
.ci__del:hover{color:var(--danger);border-color:var(--danger)}
.ci__del .ic{flex:none;width:14px;height:14px}
/* Позиция, которую разобрали, пока покупатель оформлял заказ. */
.ci--gone .ci__i{filter:grayscale(1);opacity:.5}
.ci--gone .ci__n{color:var(--muted)}
.ci__gone{
  display:flex;align-items:flex-start;gap:7px;margin-top:9px;padding:8px 10px;
  background:var(--tone-danger-bg);color:var(--danger);
  border-radius:var(--r-sm);font-size:12.5px;font-weight:600;line-height:1.4
}
.ci__gone .ic{flex:none;margin-top:1px}
.ci__drop{
  margin-top:8px;font-size:12.5px;font-weight:600;color:var(--danger);
  text-decoration:underline;text-underline-offset:2px
}
.cart__block{
  display:flex;align-items:flex-start;gap:7px;margin-bottom:10px;padding:11px 12px;
  background:var(--tone-danger-bg);color:var(--danger);border-radius:var(--r-md);
  font-size:12.5px;font-weight:600;line-height:1.45
}
.cart__block .ic{flex:none;margin-top:1px}
.btn--wide{width:100%;margin-top:9px;padding:12px}
.ci__x:hover{color:var(--ink)}

.qty{display:flex;align-items:center;gap:2px;background:var(--chip);border-radius:var(--r-sm);padding:3px}
.qty__n{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.qty button:disabled{opacity:.32;cursor:not-allowed}
.qty button:disabled:hover{background:transparent}
.qty--lg{padding:4px}
.qty--lg button{width:38px;height:38px;font-size:20px;background:var(--card)}
.qty--lg span{min-width:38px;font-size:16px}
/* «Количество» на карточке товара — своя строка под размерами */
.pd__qty{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 4px}
.pd__qty[hidden]{display:none}
.pd__qty-l{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pd__qty-n{font-size:12.5px;color:var(--muted2)}
/* 34px, а не 28: на телефоне в мелкую кнопку количества трудно попасть */
.qty button{width:34px;height:34px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;transition:background var(--dur) var(--ease)}
.qty button:hover{background:#e6e6e6}
.qty span{min-width:26px;text-align:center;font-size:14px;font-weight:600}

.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 0;min-width:0}
.row__l{font-size:14px;font-weight:600;line-height:1.45;flex:1 1 auto;min-width:0}
.row__v{font-size:14px;line-height:1.45;white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto;margin-left:auto}
.row__v--addr{
  white-space:normal;overflow-wrap:anywhere;word-break:break-word;
  flex:1 1 auto;min-width:0;max-width:70%;text-align:right
}
.row--total{border-top:1px solid var(--line);margin-top:6px;padding-top:16px}
.row--total .row__l{font-size:17px;font-weight:700}
.row--total .row__v{font-size:17px;font-weight:700}
.row--soft .row__l,.row--soft .row__v{font-weight:400;color:var(--muted);font-size:13.5px}
.row__hint{display:block;font-size:11.5px;font-weight:400;color:var(--muted2);margin-top:3px;line-height:1.4}
.cart-sum{background:var(--card);border-radius:var(--r-lg);margin:12px var(--pad);padding:6px 16px 14px;overflow:visible}
.cart-sum__note{
  display:flex;align-items:flex-start;gap:8px;margin-top:4px;padding:12px 0 4px;
  font-size:12.5px;color:var(--muted);line-height:1.5;border-top:1px dashed var(--line)
}
.cart-sum__note .ic{margin-top:1px;color:var(--muted2)}
.row__v--free{color:var(--tone-ok-fg);font-weight:600}

/* сколько добрать до бесплатной доставки */
.freebar{padding:10px 0 2px}
.freebar__t{font-size:12.5px;color:var(--muted);line-height:1.45}
.freebar__t b{color:var(--ink);font-weight:600}
.freebar__r{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.freebar__f{height:100%;border-radius:2px;background:var(--ink);transition:width .4s var(--ease)}

/* контакты покупателя на шаге доставки (нужны и гостю, и вошедшему) */
.gform{padding:2px var(--pad) 0}
.gform .f:last-child{margin-bottom:4px}
.gform__n{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 12px}
.gform__n button{text-decoration:underline;font-weight:600;color:var(--ink)}

/* подтверждение вместо системного confirm() */
/* Отдельный слой: админка лежит на z-index 200, её формы — на 210,
   поэтому подтверждение должно быть выше обоих. */
.askw{position:fixed;inset:0;z-index:260}
.ask__t{font-size:16px;font-weight:700;text-transform:uppercase;line-height:1.3;margin-bottom:8px}
.ask__d{font-size:13.5px;color:var(--muted);line-height:1.6}
.ask__acts{display:flex;gap:8px;margin-top:20px}
.ask__acts .btn,.ask__acts .ghb{flex:1;min-height:48px;margin:0}
.leg-miss{color:var(--muted2);font-style:italic}
.info__doc{font-size:14px;line-height:1.75;color:var(--ink-soft)}
.info__doc h3{font-size:14px;font-weight:700;color:var(--ink);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.info__doc p + p{margin-top:10px}
.info__doc ul{margin:8px 0 0;padding:0 0 0 18px;list-style:disc}
.info__doc li{margin:6px 0;padding-left:2px}
.info__banner{
  background:var(--chip);border-radius:var(--r-md);padding:12px 14px;margin-bottom:16px;
  font-size:12.5px;line-height:1.55;color:var(--muted)
}
.info__banner b{color:var(--ink-soft);font-weight:600}
.sztable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.sztable th,.sztable td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--line)}
.sztable th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sztable td:first-child,.sztable th:first-child{text-align:left;font-weight:600;color:var(--ink)}
.sztable .dash{color:var(--muted2)}
.faq-i{border-bottom:1px solid var(--line)}
.faq-i:last-child{border-bottom:0}
.faq-i summary{
  list-style:none;cursor:pointer;padding:14px 0;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;gap:12px
}
.faq-i summary::-webkit-details-marker{display:none}
.faq-i summary .ic{color:var(--muted);transition:transform .28s var(--ease);flex:none}
.faq-i[open] summary .ic{transform:rotate(180deg)}
.faq-i p{font-size:14px;line-height:1.65;color:var(--ink-soft);padding:0 0 16px}
.ship-card{
  display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)
}
.ship-card:last-child{border-bottom:0}
.ship-card__ic{
  width:42px;height:42px;border-radius:var(--r-sm);background:var(--chip);
  display:flex;align-items:center;justify-content:center;flex:none
}
.ship-card__t{font-size:14.5px;font-weight:600;margin-bottom:4px}
.ship-card__d{font-size:13px;color:var(--muted);line-height:1.55}
.sres-lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 0 10px}
.sres-empty{color:var(--muted);font-size:13.5px;padding:16px 0;line-height:1.6;text-align:center}
/* Поиск — отдельный слой во всю видимую высоту. Строка ввода закреплена
   сверху, результаты прокручиваются внутри: клавиатура их больше не прячет. */
.smod{
  position:fixed;left:50%;transform:translateX(-50%);z-index:101;
  top:var(--vv-top,0px);width:min(520px,100%);height:var(--vv-h,100dvh);
  display:flex;flex-direction:column;background:var(--card);
  animation:fadeIn .18s var(--ease)
}
.smod__h{
  flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--line);background:var(--card)
}
.smod__f{
  flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;
  background:var(--chip);border-radius:var(--r-md);
  transition:box-shadow var(--dur) var(--ease)
}
.smod__f:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.smod__f > .ic{flex:none;color:var(--muted2)}
.smod__f input{
  flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:15px;color:var(--ink);
  -webkit-appearance:none;appearance:none
}
.smod__f input::-webkit-search-cancel-button{display:none}
.smod__clr{display:flex;flex:none;padding:4px;color:var(--muted2);border-radius:var(--r-pill)}
.smod__clr:hover{color:var(--ink);background:var(--card)}
.smod__clr[hidden]{display:none}
.smod__b{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:12px 14px calc(24px + env(safe-area-inset-bottom))
}
@media(min-width:560px){
  .smod{
    top:calc(var(--vv-top,0px) + 5vh);height:min(calc(var(--vv-h,100dvh) - 10vh),640px);
    border-radius:var(--r-lg);overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28)
  }
}
.safe{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:12.5px;margin-top:14px}
.safe .ic{width:15px;height:15px}

/* --- своя цифровая клавиатура вместо системной --- */
.rng input[readonly]{cursor:pointer;background:var(--card)}
.rng input[readonly]:focus{border-color:var(--ink)}
.npad{
  flex:none;overflow:hidden;max-height:0;opacity:0;
  border-top:1px solid transparent;background:var(--bg);
  transition:max-height .34s var(--ease), opacity .24s var(--ease), border-color .24s
}
.npad.on{max-height:340px;opacity:1;border-top-color:var(--line)}
.npad__top{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 6px
}
.npad__lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.npad__done{font-size:13px;font-weight:600;color:var(--ink);padding:6px 10px;border-radius:var(--r-sm)}
.npad__done:hover{background:var(--chip)}
.npad__grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:2px 12px 14px
}
.npkey{
  height:50px;background:var(--card);border:1px solid var(--line2);border-radius:var(--r-md);
  font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;
  transition:transform .08s var(--ease), background var(--dur) var(--ease)
}
.npkey:active{transform:scale(.94);background:var(--chip)}
.npkey--fn{font-size:16px;color:var(--muted2);background:transparent;border-color:transparent}
.npkey--fn:active{background:var(--chip)}
.npkey--go{background:var(--ink);color:#fff;border-color:var(--ink);font-size:14px;font-weight:600}

/* ===================== ОПЛАТА ===================== */
.pay__h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.pay__ht{font-size:17px;font-weight:700}
.pay__hn{font-size:13px;color:var(--muted)}
.pay__ip{font-size:16px;font-weight:700;margin-top:10px;text-align:right}

.pm{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:1.5px solid var(--line2);border-radius:var(--r-md);padding:14px;
  transition:border-color var(--dur) var(--ease)
}
.pm[aria-current="true"]{border-color:var(--ink);border-width:2px;padding:13px}
.pm__r{
  width:20px;height:20px;border-radius:var(--r-pill);border:2px solid var(--line2);
  flex:none;position:relative
}
.pm[aria-current="true"] .pm__r{border-color:var(--ink)}
.pm[aria-current="true"] .pm__r::after{
  content:'';position:absolute;inset:3px;border-radius:var(--r-pill);background:var(--ink)
}
.pm__logo{flex:none;display:flex}
.pm__b{display:flex;flex-direction:column;gap:3px;min-width:0}
.pm__n{font-size:15px;font-weight:600}
.pm__d{font-size:12px;color:var(--muted);line-height:1.4}

/* --- индикатор трёх шагов оформления --- */
.sbar{
  display:flex;align-items:flex-start;
  padding:18px var(--pad) 16px;background:var(--card);
  border-bottom:1px solid var(--line)
}
.sbar__s{display:flex;flex-direction:column;align-items:center;gap:9px;flex:none;width:70px}
.sbar__c{
  width:30px;height:30px;border-radius:var(--r-pill);
  background:var(--card);border:1.5px solid var(--line2);color:var(--muted2);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;
  box-sizing:border-box;line-height:0;
  transition:background .34s var(--ease), border-color .34s var(--ease),
             color .34s var(--ease), box-shadow .34s var(--ease)
}
.sbar__c i{font-style:normal;line-height:1;display:block}
.sbar__c .ic{width:14px;height:14px;display:block;stroke-width:2.6}
.sbar__s.is-done .sbar__c{background:var(--ink);border-color:var(--ink);color:#fff}
.sbar__s.is-now .sbar__c{
  background:var(--ink);border-color:var(--ink);color:#fff;
  box-shadow:0 0 0 5px rgba(11,11,11,.07)
}
.sbar__s.is-now .sbar__c{animation:popIn .34s var(--ease) both}
.sbar__t{
  font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  line-height:1.2;text-align:center;color:var(--muted2);white-space:nowrap
}
.sbar__s.is-done .sbar__t{color:var(--muted)}
.sbar__s.is-now .sbar__t{color:var(--ink)}
.sbar__line{
  flex:1;height:1.5px;background:var(--line2);border-radius:2px;margin-top:15px;
  transition:background .34s var(--ease)
}
.sbar__line.on{background:var(--ink)}

/* --- блоки оформления --- */
.cosec{background:var(--card);border-radius:var(--r-lg);margin:12px var(--pad);padding:16px 16px 18px}
.cosec--tight{padding-bottom:8px}
.cosec__t{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted2);margin-bottom:14px
}
.cosec__lead{font-size:13px;color:var(--muted);line-height:1.5;margin:-6px 0 14px}

/* --- карточки выбора --- */
.pmlist{display:flex;flex-direction:column;gap:10px;padding:8px var(--pad) 0}
.pm{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line2);border-radius:var(--r-md);padding:14px;
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform .12s var(--ease);
  animation:riseIn .38s var(--ease) both
}
.pm:active{transform:scale(.99)}
.pm[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pm__r{
  width:20px;height:20px;border-radius:var(--r-pill);border:2px solid var(--line2);
  flex:none;position:relative;transition:border-color var(--dur) var(--ease)
}
.pm[aria-current="true"] .pm__r{border-color:var(--ink)}
.pm[aria-current="true"] .pm__r::after{
  content:'';position:absolute;inset:3px;border-radius:var(--r-pill);background:var(--ink);
  animation:popIn .22s var(--ease) both
}
.pm__ic{
  width:40px;height:40px;border-radius:var(--r-sm);flex:none;
  display:flex;align-items:center;justify-content:center
}
.pm__b{display:flex;flex-direction:column;gap:3px;min-width:0}
.pm__n{font-size:14.5px;font-weight:600}
.pm__d{font-size:12px;color:var(--muted);line-height:1.4}

.yk{gap:14px;border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);cursor:default}
.yk__m{width:44px;height:44px}
.yk__w{font-size:16px;font-weight:700;letter-spacing:-.01em}
.yk__w b{color:#0066FF;font-weight:800}
.yk__ok{
  margin-left:auto;flex:none;width:24px;height:24px;border-radius:var(--r-pill);
  background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center
}
.yk__ok .ic{width:14px;height:14px;stroke-width:2.6}
.pay__addr{
  display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--muted);
  padding:12px 0 2px;border-top:1px solid var(--line);margin-top:8px
}
.pay__addr .ic{flex:none;margin-top:2px}
.pay__addr span{min-width:0;flex:1;line-height:1.45;overflow-wrap:anywhere;word-break:break-word}

/* шаг оплаты — всё на одном экране */
.pay-scr .sbar{padding:12px var(--pad) 12px}
.pay-scr .sbar__s{gap:7px}
.pay-scr .sbar__c{width:26px;height:26px;font-size:11px}
.pay-scr .sbar__c .ic{width:12px;height:12px}
.pay-scr .sbar__line{margin-top:13px}
.pay-scr .sec,.pay-scr .cosec{margin:6px var(--pad);padding:12px 14px 14px}
.pay-scr .cosec__t{margin-bottom:10px}
.pay-scr .pay__ht{font-size:15px;margin:0 0 2px}
.pay-scr .pay__h{margin-bottom:0}
.pay-scr .ci{padding:8px 0;gap:10px;align-items:center}
.pay-scr .ci__i{width:48px;height:60px}
.pay-scr .ci__n{font-size:13px}
.pay-scr .ci__m{margin-top:1px;font-size:12px}
.pay-scr .pay__ip{margin:0;font-size:14px;text-align:right;flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.pay-scr .pay__addr{padding:7px 0 0;margin-top:4px;font-size:12.5px;gap:7px}
.pay-scr .cart-sum{margin:6px var(--pad);padding:0 14px 8px}
.pay-scr .row{padding:6px 0}
.pay-scr .row--total{margin-top:2px;padding-top:10px}
.pay-scr .row--total .row__l,.pay-scr .row--total .row__v{font-size:15px}
.pay-scr .pmlist{padding:4px var(--pad) 0;gap:0}
.pay-scr .pm{padding:10px 12px}
.pay-scr .yk{gap:10px}
.pay-scr .yk__m{width:34px;height:34px}
.pay-scr .yk__w{font-size:14px}
.pay-scr .pm__d{font-size:11px}
.pay-scr .pay-scr__cta{padding:8px var(--pad) 0}
.pay-scr .pay-scr__cta .btn{padding:14px}
.pay-scr .safe{margin-top:8px;font-size:12px}

/* --- экран «готово» --- */
.done{text-align:center;padding:26px var(--pad) 20px}
.done__ic{
  width:74px;height:74px;border-radius:var(--r-pill);background:var(--ink);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;margin-bottom:18px;
  animation:doneIn .6s cubic-bezier(.34,1.4,.5,1) both
}
.done__ic .ic{width:38px;height:38px;stroke-width:2.6}
@keyframes doneIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.done__t{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.done__s{font-size:14px;color:var(--muted);line-height:1.65;margin-top:10px}
.done__s b{color:var(--ink)}

/* ===================== ФОРМЫ ===================== */
.form{padding:8px var(--pad) 20px}
.form__t{font-size:21px;font-weight:700;text-transform:uppercase;padding:14px var(--pad) 4px}
.form__s{font-size:13.5px;color:var(--muted);padding:0 var(--pad) 18px}
.f{margin-bottom:14px}
.f__l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px}
.f__l .ic{width:14px;height:14px}
.f__i{
  width:100%;background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r-md);
  padding:14px;font-size:15px;outline:none;transition:border-color var(--dur) var(--ease)
}
.f__i:focus{border-color:var(--ink)}
.f__w{position:relative}
.f__eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:10px;color:var(--muted)}
.f__eye:hover{color:var(--ink)}
.f__eye .ic{display:block;width:19px;height:19px}
/* место под кнопку, чтобы длинный пароль не уезжал под глазик */
.f__i--eye{padding-right:48px}
.f__err{border-color:var(--danger)}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.5;margin:6px 0 18px;cursor:pointer}
.chk input{width:19px;height:19px;flex:none;margin-top:1px;accent-color:var(--ink)}
.chk u{text-decoration:underline}
.alt{text-align:center;font-size:13.5px;color:var(--muted);margin-top:18px}
.alt button{font-weight:700;color:var(--ink);text-decoration:underline}

.auth__logo{display:flex;justify-content:center;padding:26px 0 4px}
.auth__mark{width:128px;height:128px}
.auth__t{text-align:center;padding-top:6px}
.auth__s{text-align:center;max-width:320px;margin-left:auto;margin-right:auto}
.auth__hero{margin:8px 0 0;padding:0 4px}
.auth__tg-main{
  width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:16px 18px;border-radius:8px;border:0;
  background:#229ED9;color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;
  box-shadow:0 10px 28px rgba(34,158,217,.28);
  transition:transform .15s var(--ease), box-shadow .15s var(--ease)
}
.auth__tg-main:active{transform:scale(.985)}
.auth__tg-main .ic{stroke:#fff}
.auth__tg-sm{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:10px;padding:10px 14px;border-radius:6px;
  border:1.5px solid #c5e8f7;background:#f3faff;color:#1a8bbf;
  font-size:13.5px;font-weight:650;cursor:pointer;
  transition:transform .15s var(--ease), background .15s var(--ease)
}
.auth__tg-sm:active{transform:scale(.985);background:#e8f6fd}
.auth__tg-sm .ic{width:16px;height:16px;stroke:#229ED9}
.auth__links{
  margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:12px
}
.auth__link{
  background:none;border:0;padding:0;cursor:pointer;
  font-size:13px;color:var(--muted);text-decoration:underline;
  text-underline-offset:3px;text-align:center;line-height:1.4
}
.auth__link:active{opacity:.7}
.auth__warn{
  margin:0 0 14px;padding:12px 14px;border-radius:6px;
  background:#fff6e8;border:1px solid #f0e0c4;
  font-size:12.5px;line-height:1.5;color:#6b5420;text-align:left
}
.auth__device{
  margin-top:8px;padding:16px;border-radius:8px;background:#fff;border:1px solid var(--line);
  text-align:left
}
.auth__device ol{margin:10px 0 0;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.auth__device li{margin:6px 0}
.auth__device code{
  font-family:inherit;font-weight:700;background:var(--chip);padding:1px 6px;border-radius:6px
}
.auth__or{
  display:flex;align-items:center;gap:12px;
  margin:18px 0 12px;color:var(--muted2);font-size:12px
}
.auth__or::before,.auth__or::after{
  content:'';flex:1;height:1px;background:var(--line)
}
.auth__tg,.auth__google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 16px;border-radius:8px;border:1.5px solid var(--line2);
  background:#fff;font-size:15px;font-weight:650;color:var(--ink);cursor:pointer;margin-top:8px
}
.auth__tg:active,.auth__google:active{transform:scale(.985)}
.auth__tg-note{
  margin:10px 0 0;text-align:center;font-size:12.5px;line-height:1.45;
  color:var(--muted2)
}
.auth__resend,.auth__forgot{
  display:block;width:100%;margin:8px 0 0;padding:0;border:0;background:none;
  font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px
}
.auth__resend{text-align:center}
.auth__resend:disabled{opacity:.55;cursor:default;text-decoration:none}
.auth__timer{
  text-align:center;font-size:20px;font-weight:700;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;margin:10px 0 2px;color:var(--ink)
}
.auth__timer.is-exp{color:var(--danger)}
.auth__forgot{text-align:center;font-size:12.5px}
.tg-status{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  padding:5px 10px;border-radius:var(--r-sm);font-size:12px;font-weight:650;
  border:1px solid var(--line)
}
.tg-status--on{background:rgba(31,157,85,.08);border-color:rgba(31,157,85,.28);color:#1a7a42}
.tg-status--off{background:var(--chip);color:var(--muted)}

/* Telegram в России без VPN обычно не открывается. Одна и та же плашка
   стоит у каждого перехода в бота — чтобы человек включил VPN заранее,
   а не гадал, почему по кнопке ничего не произошло. */
.vpn{
  display:flex;align-items:flex-start;gap:11px;margin-top:12px;
  padding:12px 13px;border-radius:var(--r-md);
  background:var(--tone-ship-bg);border:1px solid rgba(234,140,40,.26)
}
.vpn__ic{
  width:28px;height:28px;border-radius:9px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.75);color:var(--tone-ship-fg)
}
.vpn__ic .ic{width:16px;height:16px}
.vpn__b{min-width:0}
.vpn__t{display:block;font-size:12.5px;font-weight:700;color:var(--tone-ship-fg);margin-bottom:3px}
.vpn__d{display:block;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
/* компактный вариант — одна строка под кнопкой на экранах с формой */
.vpn--slim{
  align-items:center;gap:9px;padding:9px 11px;margin-top:10px;
  background:rgba(234,140,40,.09);border-color:rgba(234,140,40,.2)
}
.vpn--slim .vpn__ic{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.85)}
.vpn--slim .vpn__ic .ic{width:14px;height:14px}
.vpn--slim .vpn__d{font-size:12px;font-weight:600;color:var(--tone-ship-fg)}
/* крупный вариант — когда плашка ведёт блок, а не подпирает кнопку */
.vpn--lead{margin-top:0;padding:14px;gap:12px}
.vpn--lead .vpn__ic{width:32px;height:32px;border-radius:6px}
.vpn--lead .vpn__ic .ic{width:18px;height:18px}
.vpn--lead .vpn__t{font-size:13.5px}
.vpn--lead .vpn__d{font-size:13px}
.otp{
  display:flex;gap:10px;justify-content:center;
  margin:12px 0 4px;padding:0 4px
}
.otp__cell{
  width:52px;height:56px;border-radius:8px;
  border:2px solid var(--line2);background:#fff;
  font-size:22px;font-weight:700;text-align:center;
  color:var(--ink);caret-color:#229ED9;
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease)
}
.otp__cell:focus{outline:none;border-color:#229ED9;box-shadow:0 0 0 3px rgba(34,158,217,.22)}
.otp__cell.is-fill{border-color:#229ED9;box-shadow:0 0 0 3px rgba(34,158,217,.18)}
.otp__cell.is-ok{border-color:var(--ok);background:rgba(31,157,85,.06);box-shadow:0 0 0 3px rgba(31,157,85,.18)}
.otp__cell.is-bad{border-color:var(--danger);background:rgba(214,69,69,.06);box-shadow:0 0 0 3px rgba(214,69,69,.16)}
.otp__hint{text-align:center;font-size:12.5px;color:var(--muted);margin:6px 0 10px;min-height:18px}
.stabs{display:flex;gap:20px;overflow-x:auto;padding:6px var(--pad) 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stab{
  padding:11px 0 13px;font-size:13.5px;color:var(--muted);white-space:nowrap;position:relative;
  transition:color var(--dur) var(--ease)
}
.stab[aria-current="true"]{color:var(--ink);font-weight:600}
.stab[aria-current="true"]::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}

.ord{background:var(--card);border-radius:var(--r-lg);margin:12px var(--pad);overflow:hidden}
.ord__top{display:flex;gap:12px;padding:16px}
.ord__i{width:62px;height:78px;border-radius:var(--r-sm);object-fit:contain;object-position:center;background:var(--photo);flex:none}
.ord__b{flex:1;min-width:0}
.ord__h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ord__n{font-size:14px;font-weight:600;line-height:1.35}
.ord__num{font-size:12px;color:var(--muted);text-align:right;flex:none;line-height:1.6}
.ord__m{font-size:12.5px;color:var(--muted);margin-top:4px}
.ord__p{font-size:15px;font-weight:700;margin-top:8px}
.ord__st{
  display:flex;align-items:center;gap:8px;width:100%;padding:14px 16px;
  border-top:1px solid var(--line);background:var(--chip);font-size:13.5px;font-weight:500;
  transition:background var(--dur) var(--ease)
}
.ord__st-t{flex:1;min-width:0;text-align:left}
/* тона — из :root, те же, что у бейджа в админке */
.ord__st--warn{background:var(--tone-warn-bg);color:var(--tone-warn-fg)}
.ord__st--ship{background:var(--tone-ship-bg);color:var(--tone-ship-fg)}
.ord__st--ok{background:var(--tone-ok-bg);color:var(--tone-ok-fg)}
.ord__st--danger{background:var(--tone-danger-bg);color:var(--tone-danger-fg)}
/* один ховер на все тона: затемняет любой фон, текст не задевает */
.ord__st:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.035)}
.ord__st > .ic:first-child{flex:none}
.ord__st .ic:last-child{margin-left:2px;opacity:.5;flex:none}
.ord__st--warn .ic:last-child{color:var(--muted)}
.ord__rv{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:calc(100% - 32px);margin:0 16px 14px;padding:13px 16px;
  border-radius:var(--r-md);
  background:rgba(232,163,61,.16);color:var(--ink);
  font-size:14.5px;font-weight:700;letter-spacing:-.01em;
  box-shadow:inset 0 0 0 1.5px rgba(232,163,61,.5)
}
.ord__rv .ic{color:var(--star);flex:none}
.ord__rv:hover{background:rgba(232,163,61,.24)}
.ord__rv:active{transform:scale(.98)}

/* тот же статус словом — в модалке заказа */
.sbadge{
  display:inline-flex;align-items:center;padding:4px 10px;border-radius:var(--r-sm);
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--chip);color:var(--ink-soft)
}
.sbadge--warn{background:var(--tone-warn-bg);color:var(--tone-warn-fg)}
.sbadge--ship{background:var(--tone-ship-bg);color:var(--tone-ship-fg)}
.sbadge--ok{background:var(--tone-ok-bg);color:var(--tone-ok-fg)}
.sbadge--danger{background:var(--tone-danger-bg);color:var(--tone-danger-fg)}
.ord__acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ord__acts .btn,.ord__acts .ghb,.ord__acts .ord__cancel{width:100%;flex:none}
.ord__hint{
  font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:12px;
  padding-top:12px;border-top:1px dashed var(--line)
}
.pay-timer{
  display:inline-flex;align-items:center;justify-content:center;
  margin-left:8px;padding:3px 8px;border-radius:999px;
  background:var(--tone-warn-bg);color:var(--tone-warn-fg);
  font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:.02em;vertical-align:middle;line-height:1.2;flex:none;white-space:nowrap
}
.ord__st .pay-timer{margin-left:0}
.track-hero__st .pay-timer{margin-left:0;font-size:14px;padding:5px 11px}
.ord__alert{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--ink);color:#fff;
  font-size:10px;font-weight:800;flex:none
}
.pay-wait{
  margin-top:16px;padding:14px;border-radius:var(--r-md);
  background:var(--tone-warn-bg);border:1px solid rgba(0,0,0,.06)
}
.pay-wait__row{
  display:flex;align-items:center;justify-content:space-between;gap:12px
}
.pay-wait__lab{font-size:13px;font-weight:650;color:var(--ink)}
.pay-wait .pay-timer{
  margin:0;font-size:18px;padding:6px 12px;background:#fff;color:var(--ink)
}
.pay-wait__h{font-size:12.5px;color:var(--muted);line-height:1.45;margin:10px 0 0}
.ord__cancel{
  display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:12px;border-radius:var(--r-md);
  font-size:14px;font-weight:600;color:var(--danger);background:transparent
}
.ord__cancel:hover{background:rgba(214,69,69,.06)}

/* степпер доставки */
.step{display:flex;align-items:flex-start;padding:6px 0 4px}
.step__i{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;position:relative}
.step__c{
  width:42px;height:42px;border-radius:var(--r-pill);background:var(--chip);
  display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none
}
.step__i--done .step__c{background:#e9e9e9;color:var(--ink-soft)}
.step__i--now .step__c{background:var(--ink);color:#fff}
.step__l{font-size:10.5px;line-height:1.35;color:var(--ink-soft);max-width:62px}
.step__i--off .step__l{color:var(--muted2)}
.step__d{font-size:10px;color:var(--muted2)}
.step__ln{flex:none;width:14px;height:1.5px;background:var(--line2);margin-top:20px}

.dl{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.dl:last-child{border-bottom:0}
.dl__k{color:var(--muted);flex:none;max-width:42%}
.dl__v{text-align:right;line-height:1.55;min-width:0;flex:1;overflow-wrap:anywhere;word-break:break-word}

/* ===================== ПРОФИЛЬ ===================== */
.plist{background:var(--card);border-radius:var(--r-lg);margin:12px var(--pad);overflow:hidden}
.pitem{
  display:flex;align-items:center;gap:14px;width:100%;padding:16px;text-align:left;
  border-bottom:1px solid var(--line);font-size:14.5px;transition:background var(--dur) var(--ease)
}
.pitem:last-child{border-bottom:0}
.pitem:hover{background:var(--chip)}
/* Подпись тянется на всю строку — так значки телеграма у разных пунктов
   встают в одну вертикаль, а не пляшут по длине текста. */
.pitem__t{flex:1;min-width:0}
.pitem__c{color:var(--muted2);flex:none}
.pitem__tg{
  width:18px;height:18px;border-radius:50%;object-fit:cover;flex:none;
  background:#229ED9
}
.pitem__n{
  min-width:18px;height:18px;padding:0 6px;
  border-radius:999px;background:var(--ink);color:#fff;
  font-size:11px;font-weight:800;line-height:1;flex:none;
  display:inline-flex;align-items:center;justify-content:center
}
.pitem--dgr{color:var(--danger)}
/* Выход — единственное необратимое действие в списке, поэтому не красная
   строка во всю ширину, а отдельная кнопка со значком в мягкой плашке. */
.pitem--out{gap:12px;font-weight:600;color:var(--danger);border-radius:var(--r-lg)}
.pitem--out:hover{background:var(--tone-danger-bg)}
.pitem--out:active{background:var(--tone-danger-bg)}
.pitem__box{
  width:34px;height:34px;border-radius:6px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--tone-danger-bg);color:var(--tone-danger-fg)
}
.pcard{background:var(--card);border-radius:var(--r-lg);margin:12px var(--pad);padding:18px 16px;text-align:center}
.track-hero{
  margin:12px var(--pad) 0;padding:18px 16px;border-radius:var(--r-lg);
  background:linear-gradient(160deg,#f7f3ec 0%,#fff 55%,#eef6f1 100%);
  border:1px solid var(--line);text-align:left
}
.track-hero__lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.track-hero__st{
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  font-size:26px;line-height:1.15;font-weight:800;margin:8px 0 6px;color:var(--ink)
}
.track-hero__meta{font-size:13px;color:var(--muted);line-height:1.45}
.track-hero__track{
  margin-top:12px;padding:12px 14px;border-radius:6px;background:#fff;
  border:1px dashed var(--line2);font-size:15px;font-weight:700;
  letter-spacing:.02em;word-break:break-all
}
.track-hero__track span{display:block;font-size:11px;font-weight:650;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pvz__default{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.4}
.pcard__n{font-size:17px;font-weight:700}
.pcard__e{font-size:13px;color:var(--muted);margin-top:3px}

/* --- адреса и карты --- */
.ghb{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;
  font-weight:500;color:var(--ink-soft);background:var(--card);
  border:1.5px solid var(--line2);border-radius:var(--r-md);
  padding:8px 10px;transition:all var(--dur) var(--ease)
}
.ghb:hover{border-color:var(--ink);color:var(--ink)}
.ghb .ic{opacity:.7}
.ghb--d{color:var(--danger)}
.ghb--d .ic{opacity:.85}
.ghb--d:hover{border-color:var(--danger);color:var(--danger);background:rgba(214,69,69,.05)}



/* --- свёрнутое оформление --- */
.mini{
  position:fixed;left:12px;right:12px;z-index:41;
  bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom));
  max-width:496px;margin:0 auto;
  background:var(--ink);color:#fff;border-radius:var(--r-xl);
  display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px;
  box-shadow:0 8px 26px rgba(0,0,0,.28);
  animation:miniIn .32s cubic-bezier(.34,1.25,.5,1) both
}
/* шапка на шагах 2–3 — чуть мягче, в духе свёрнутой плашки */
.hd--step{border-radius:var(--r-xl)}
@keyframes miniIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.mini__open{
  flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left;color:#fff;
  padding:2px;border-radius:var(--r-sm)
}
