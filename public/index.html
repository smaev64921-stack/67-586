    CMS.texts.aboutLead = document.getElementById('txAboutL').value.trim();
    CMS.texts.aboutBody = document.getElementById('txAboutB').value.trim();
    CMS.texts.historyLead = document.getElementById('txHistL').value.trim();
    CMS.texts.historyBody = document.getElementById('txHistB').value.trim();
    CMS.texts.shippingNote = document.getElementById('txShip').value.trim();
    /* тарифы: пустое или мусорное значение не должно обнулять цену молча */
    const num = (id, def) => {
      const raw = document.getElementById(id).value.trim();
      const v = Number(raw);
      return raw !== '' && isFinite(v) && v >= 0 ? Math.round(v) : def;
    };
    CMS.shipping.pickup   = num('shP', CMS.shipping.pickup);
    CMS.shipping.freeFrom = num('shF', CMS.shipping.freeFrom);
    CMS.shipping.pickupDays  = document.getElementById('shPD').value.trim() || CMS.shipping.pickupDays;
    CMS.texts.returnsNote = document.getElementById('txRet').value.trim();
    saveCms();
    toast('Контент сохранён');
    render(true);
  };
}

async function openAdmin(){
  if(!isAdmin()){ toast('Нет доступа'); return; }
  document.body.style.overflow = 'hidden';
  document.body.classList.add('adm-on');
  _admPaintKey = '';
  adTab = 'dash';
  if(window.LC){
    try{
      const allProducts = await LC.loadCatalogAll().catch(() => null);
      if(allProducts && allProducts.length){
        PRODUCTS = allProducts;
        persist();
        pruneStaleClientData();
      }
    }catch(e){}
    const loaded = await refreshAdminOrders();
    if(!loaded.ok){
      toast(loaded.error || 'Не удалось загрузить заказы');
      /* без серверных прав панель пустая по заказам — не подменяем локальным мусором */
      if(loaded.status === 403) ORDERS.length = 0;
    }
    try{ await rvHydrateFromServer(); }catch(_){}
  }
  adm.innerHTML = `<div class="ad" role="dialog" aria-label="Админ-панель">
    <div class="ad__frame">
      <div class="ad__top">
        <div class="ad__brand">${MARK('ad__mark')}
          <div><div class="ad__t">${BRAND} Admin</div>
            <span class="ad__c">Загрузка…</span></div>
        </div>
        <button class="ad__b" id="aX">Закрыть</button>
      </div>
      ${adNav()}
      <div class="ad__main"></div>
    </div>
  </div>`;
  document.getElementById('aX').onclick = closeAdmin;
  adm.querySelector('.ad__nav').onclick = e => {
    const b = e.target.closest('[data-adtab]'); if(!b) return;
    adTab = b.dataset.adtab;
    if(adTab === 'orders' && window.LC){
      refreshAdminOrders().then(r => {
        if(!r.ok) toast(r.error || 'Не обновилось');
        paintAdmin();
      });
      return;
    }
    paintAdmin();
  };
  paintAdmin();
}

function refresh(){
  if(!adm.querySelector('.ad')) return;
  if(adTab === 'catalog'){
    const l = document.getElementById('aList');
    if(l) l.innerHTML = adRows();
    const c = document.querySelector('.ad__c');
    if(c){ const a = analytics(); c.textContent = adOrdersLine(a); }
  } else paintAdmin();
}

adm.addEventListener('click', e => {
  const pzEd = e.target.closest('[data-pvzed]');
  const pzRm = e.target.closest('[data-pvzrm]');
  if(pzEd){ pvzForm((CMS.pvz || []).find(p => p.id === +pzEd.dataset.pvzed)); return; }
  if(pzRm){
    const p = (CMS.pvz || []).find(x => x.id === +pzRm.dataset.pvzrm);
    if(!p) return;
    askConfirm({
      title:'Удалить пункт выдачи?',
      text:`${p.city ? p.city + ', ' : ''}${p.addr}`,
      onOk(){
        CMS.pvz = CMS.pvz.filter(x => x.id !== p.id);
        if(S.checkout.pvz && S.checkout.pvz.code === p.code) S.checkout.pvz = null;
        saveCms(); saveUser(); paintAdmin(); render(true); toast('Пункт удалён');
      }
    });
    return;
  }

  const rvPub  = e.target.closest('[data-rvpub]');
  const rvHide = e.target.closest('[data-rvhide]');
  const rvRep  = e.target.closest('[data-rvrep]');
  const rvDel  = e.target.closest('[data-rvdel]');
  if(rvDel){
    const id = +rvDel.dataset.rvdel;
    if(!REVIEWS.some(x => x.id === id)) return;
    askConfirm({
      title:'Удалить отзыв?',
      text:'Он исчезнет со страницы товара. Восстановить будет нельзя.',
      async onOk(){
        try{
          if(window.LC && LC.deleteReview) await LC.deleteReview(id);
          REVIEWS = REVIEWS.filter(x => x.id !== id);
          rvSave(); paintAdmin(); render(true);
          toast('Отзыв удалён');
        }catch(e){
          toast(e.message || 'Не удалось удалить отзыв');
        }
      }
    });
    return;
  }
  if(rvPub || rvHide){
    const id = +(rvPub || rvHide).dataset[rvPub ? 'rvpub' : 'rvhide'];
    const r = REVIEWS.find(x => x.id === id);
    if(!r) return;
    (async () => {
      try{
        if(rvPub){
          const saved = window.LC && LC.patchReview
            ? await LC.patchReview(id, { status: 'ok' })
            : Object.assign(r, { status: 'ok' });
          Object.assign(r, saved || { status: 'ok' });
          toast('Отзыв опубликован');
        } else {
          const next = r.status === 'hide' ? 'ok' : 'hide';
          const saved = window.LC && LC.patchReview
            ? await LC.patchReview(id, { status: next })
            : Object.assign(r, { status: next });
          Object.assign(r, saved || { status: next });
          toast(r.status === 'hide' ? 'Отзыв скрыт с витрины' : 'Отзыв снова виден');
        }
        rvSave(); paintAdmin(); render(true);
      }catch(e){
        toast(e.message || 'Не удалось обновить отзыв');
      }
    })();
    return;
  }
  if(rvRep){ rvReplyForm(+rvRep.dataset.rvrep); return; }

  const ed = e.target.closest('[data-ed]');
  const rm = e.target.closest('[data-rm]');
  const tg = e.target.closest('[data-tog]');
  const dup = e.target.closest('[data-dup]');
  const ov = e.target.closest('[data-ordview]');
  const cv = e.target.closest('[data-cliview]');
  const pt = e.target.closest('[data-ptog]');
  const pe = e.target.closest('[data-ped]');
  const pr = e.target.closest('[data-prm]');
  const sed = e.target.closest('[data-sed]');
  const srm = e.target.closest('[data-srm]');
  const smv = e.target.closest('[data-smv]');
  if(sed){
    const s = (CMS.slides||[]).find(x => x.id === +sed.dataset.sed);
    if(s) slideForm(s);
    return;
  }
  if(srm){
    const id = +srm.dataset.srm;
    askConfirm({
      title:'Удалить фото с главной?',
      text:'Слайдер пересоберётся без него.',
      onOk(){
        CMS.slides = (CMS.slides||[]).filter(x => x.id !== id);
        saveCms(); paintAdmin(); render(true); toast('Фото удалено');
      }
    });
    return;
  }
  if(smv){
    const [id, dir] = smv.dataset.smv.split(':');
    const arr = CMS.slides || [];
    const i = arr.findIndex(x => x.id === +id), j = i + (+dir);
    if(i > -1 && j > -1 && j < arr.length){
      [arr[i], arr[j]] = [arr[j], arr[i]];
      saveCms(); paintAdmin(); render(true);
    }
    return;
  }
  if(ed) return pForm(byId(+ed.dataset.ed));
  if(dup){
    const p = byId(+dup.dataset.dup);
    if(!p) return;
    const copy = JSON.parse(JSON.stringify(p));
    copy.id = PRODUCTS.reduce((m,x)=>Math.max(m,x.id),0)+1;
    copy.name = p.name + ' (копия)';
    copy.sku = String(Math.floor(10000+Math.random()*90000));
    PRODUCTS.push(copy); persist();
    dropReviewsForPid(copy.id);
    S.cart = (S.cart || []).filter(i => +i.id !== +copy.id);
    saveUser();
    refresh(); render(true); toast('Товар скопирован'); return;
  }
  if(tg){
    const p = byId(+tg.dataset.tog);
    p.on = !p.on;
    (async () => {
      try{
        if(window.LC && S.user && S.user.admin) await LC.saveProduct(p);
        persist(); refresh(); render(true);
        toast(p.on ? 'Товар показан' : 'Товар скрыт');
      }catch(err){
        p.on = !p.on;
        toast(err.message || 'Не удалось обновить');
      }
    })();
    return;
  }
  if(rm){
    const p = byId(+rm.dataset.rm);
    if(!p) return;
    askConfirm({
      title:`Удалить «${p.name}»?`,
      text:'Товар пропадёт из каталога, корзин и избранного. Действие необратимо.',
      async onOk(){
        try{
          if(window.LC && S.user && S.user.admin) await LC.removeProduct(p.id);
          PRODUCTS = PRODUCTS.filter(x => x.id !== p.id);
          S.cart = S.cart.filter(x => x.id !== p.id);
          S.favs = S.favs.filter(x => x !== p.id);
          dropReviewsForPid(p.id);
          persist(); refresh(); render(true); toast('Товар удалён');
        }catch(err){
          toast(err.message || 'Не удалось удалить');
        }
      }
    });
    return;
  }
  if(ov) return orderDrawer(ov.dataset.ordview);
  if(cv) return clientDrawer(decodeURIComponent(cv.dataset.cliview));
  if(pt){
    const p = CMS.promos.find(x => x.id === +pt.dataset.ptog);
    if(p){ p.on = !p.on; saveCms(); paintAdmin(); }
    return;
  }
  if(pe){
    const p = CMS.promos.find(x => x.id === +pe.dataset.ped);
    if(p) promoForm(p);
    return;
  }
  if(pr){
    const id = +pr.dataset.prm;
    const promo = (CMS.promos || []).find(x => x.id === id);
    askConfirm({
      title:'Удалить промокод?',
      text: promo ? `Код ${promo.code} перестанет действовать.` : 'Код перестанет действовать.',
      onOk(){
        CMS.promos = CMS.promos.filter(x => x.id !== id);
        saveCms(); paintAdmin(); toast('Удалено');
      }
    });
  }
});

    <div class="ad__colors" id="xColors"></div>
    <div class="cpk" id="xCpk">
      <div class="cpk__row">
        <span class="cpk__prev" id="xCpkPrev" aria-hidden="true"></span>
        <span class="cpk__field">

        </span>
        <button type="button" class="ad__b ad__b--pri cpk__add" id="xColorAdd">Добавить</button>
      </div>
      <p class="cpk__will" id="xCpkWill"></p>
      <div class="cpk__sw" id="xCpkSw"></div>
      <button type="button" class="cpk__more" id="xCpkMore" aria-expanded="false">Подобрать оттенок вручную</button>
      <div class="cpk__pane" id="xCpkPane" hidden>
        <div class="cpk__sv" id="xCpkSv" role="application" aria-label="Насыщенность и яркость">
          <span class="cpk__dot" id="xCpkDot"></span>
        </div>
        <input class="cpk__hue" id="xCpkHue" type="range" min="0" max="360" step="1" value="0" aria-label="Тон">

    <input type="file" id="xf" accept="image/*" multiple class="hide" aria-hidden="true">
    <div class="ad__gal-url">
      <input class="ad__f" id="xi" placeholder="Или вставьте ссылку на фото">
      <button type="button" class="ad__b" id="xAddUrl">Добавить</button>
    </div>

    <label class="ad__sw"><input type="checkbox" id="xtry" ${d.tryon===true?'checked':''}> Примерка на фото</label>
    <label class="ad__sw"><input type="checkbox" id="xon" ${d.on!==false?'checked':''}> Показывать на сайте</label>
    <div class="ad__foot">
      <button class="ad__b" id="xCancel">Отмена</button>
      <button class="ad__b ad__b--pri" id="xSave">${p?'Сохранить':'Добавить'}</button>
    </div></div>`;
  adm.appendChild(w);

  const bindPick = (root, get, set) => {
    root.onclick = e => {
      const b = e.target.closest('.ad__pick-b'); if(!b) return;
      set(b.dataset.v);
      root.querySelectorAll('.ad__pick-b').forEach(x => {
        x.setAttribute('aria-pressed', x.dataset.v === get() ? 'true' : 'false');
      });
    };
  };
  bindPick(w.querySelector('#xGender'), () => gender, v => { gender = v; });
  bindPick(w.querySelector('#xCat'), () => cat, v => { cat = v; });
  bindPick(w.querySelector('#xBadge'), () => badge, v => { badge = v; });

  const normalizeQty = inp => {
    const raw = String(inp.value || '').replace(/\D/g, '');
    inp.value = raw === '' ? '' : String(parseInt(raw, 10));
  };
  w.querySelectorAll('.xs').forEach(inp => {
    inp.addEventListener('focus', () => inp.select());
    inp.addEventListener('input', () => normalizeQty(inp));
  });
  const syncStockEnabled = () => {
    const checked = new Set([...w.querySelectorAll('.xz:checked')].map(i => i.value));
    w.querySelectorAll('.xs').forEach(inp => {
      const on = checked.has(inp.dataset.sz);
      inp.disabled = !on;
      inp.parentElement.style.opacity = on ? '1' : '.35';
      if(!on) inp.value = '';
      else if(inp.value === '0') inp.select();
    });
  };
  w.querySelector('#xSz').onchange = syncStockEnabled;

  /* цвета: список любой длины, оттенок + название.
     Подбор — свой, без системного окна выбора цвета: имя ищется в словаре,
     а точный оттенок при желании крутится на месте. */
  let colorList = Array.isArray(d.colors) ? d.colors.filter(c => c && c.hex).slice(0, 20) : [];
  const colorBox = w.querySelector('#xColors');
  const nameEl   = w.querySelector('#xColorName');
  const prevEl   = w.querySelector('#xCpkPrev');
  const sugEl    = w.querySelector('#xCpkSug');
  const swEl     = w.querySelector('#xCpkSw');
  const paneEl   = w.querySelector('#xCpkPane');
  const moreEl   = w.querySelector('#xCpkMore');
  const svEl     = w.querySelector('#xCpkSv');
  const dotEl    = w.querySelector('#xCpkDot');
  const hueEl    = w.querySelector('#xCpkHue');
  const hexEl    = w.querySelector('#xCpkHex');
  const willEl   = w.querySelector('#xCpkWill');

  let curHex = '#1b1b1b';       // что уйдёт в список при «Добавить»
  let hsv = rgbToHsv(curHex);   // то же самое для ручного подбора

  const paintColors = () => {
    colorBox.innerHTML = colorList.length
      ? colorList.map((c, i) => `
        <span class="ad__color" title="${esc(c.hex)}">
          <i style="background:${esc(c.hex)}"></i>${esc(c.name || c.hex)}
          <button type="button" data-cdel="${i}" aria-label="Убрать цвет">${svg('x','ic')}</button>
        </span>`).join('')
      : `<span class="ad__hint" style="margin:0">Цвета не добавлены — в карточке выбора не будет.</span>`;
  };
  colorBox.onclick = e => {
    const b = e.target.closest('[data-cdel]');
    if(!b) return;
    colorList.splice(+b.dataset.cdel, 1);
    paintColors();
  };

  /* превью и ручной подбор всегда показывают один и тот же цвет */
  const paintCur = syncHsv => {
    if(syncHsv) hsv = rgbToHsv(curHex);
    const will = willAdd();
    willEl.textContent = `Добавим: ${will.name} · ${will.hex.toUpperCase()}`;
    prevEl.style.background = curHex;
    prevEl.classList.toggle('is-light', hexLuma(curHex) > 0.82);
    hexEl.textContent = curHex.toUpperCase();
    hueEl.value = Math.round(hsv.h);
    svEl.style.setProperty('--h', hsv.h);
    dotEl.style.left = (hsv.s * 100) + '%';
    dotEl.style.top  = ((1 - hsv.v) * 100) + '%';
    dotEl.style.background = curHex;
    swEl.querySelectorAll('[data-sw]').forEach(b => {
      b.setAttribute('aria-pressed', b.dataset.sw === curHex ? 'true' : 'false');
    });
  };

  /* Что именно уедет в список — видно до нажатия «Добавить» */
  function willAdd(){
    const typed = nameEl.value.trim();
    const hit = colorResolve(typed);
    const hex = String(hit ? hit.hex : curHex).toLowerCase();
    const isCode = /^#?[0-9a-fA-F]{3,8}$/.test(typed);
    const name = (hit && !hit.loose && !isCode) ? hit.name
               : (typed && !isCode) ? typed
               : (hit ? hit.name : colorNearest(hex));
    return {hex, name: String(name).slice(0, 32)};
  }

  /* подсказки по набранному: имя из словаря сразу подставляет оттенок */
  const paintSug = () => {
    const raw = nameEl.value;
    const list = colorSuggest(raw);
    const hit = colorResolve(raw);
    if(hit){ curHex = hit.hex; paintCur(true); }
    const will = willAdd();
    willEl.textContent = `Добавим: ${will.name} · ${will.hex.toUpperCase()}`;
    /* когда набрано ровно название из словаря, список подсказок только мешает */
    const settled = hit && colorKey(raw) === colorKey(hit.name);
    if(!list.length || settled){
      sugEl.hidden = true;
      sugEl.innerHTML = '';
      return;
    }
    sugEl.hidden = false;
    sugEl.innerHTML = list.map(c =>
      `<button type="button" data-sug="${esc(c.hex)}" data-sugn="${esc(c.name)}">
        <i style="background:${esc(c.hex)}"></i>${esc(c.name)}</button>`).join('');
  };
  sugEl.onclick = e => {
    const b = e.target.closest('[data-sug]');
    if(!b) return;
    curHex = b.dataset.sug;
    nameEl.value = b.dataset.sugn;
    sugEl.hidden = true;
    paintCur(true);
    addColor();
  };

  /* готовые оттенки — то, что в одежде спрашивают чаще всего */
  swEl.innerHTML = COLOR_QUICK.map(c =>
    `<button type="button" class="cpk__chip" data-sw="${c.hex}" data-swn="${esc(c.name)}"
      title="${esc(c.name)}" aria-label="${esc(c.name)}" aria-pressed="false">
      <i style="background:${c.hex}"></i></button>`).join('');
  swEl.onclick = e => {
    const b = e.target.closest('[data-sw]');
    if(!b) return;
    curHex = b.dataset.sw;
    if(!nameEl.value.trim() || colorResolve(nameEl.value)) nameEl.value = b.dataset.swn;
    sugEl.hidden = true;
    paintCur(true);
  };

  moreEl.onclick = () => {
    const open = paneEl.hidden;
    paneEl.hidden = !open;
    moreEl.setAttribute('aria-expanded', open ? 'true' : 'false');
    moreEl.textContent = open ? 'Свернуть подбор' : 'Подобрать оттенок вручную';
  };

  /* квадрат «насыщенность x яркость»: тянем пальцем или мышью */
  const svPick = ev => {
    const r = svEl.getBoundingClientRect();
    hsv.s = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    hsv.v = 1 - Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
    curHex = hsvToHex(hsv);
    paintCur(false);
  };
  let svDrag = false;
  svEl.addEventListener('pointerdown', e => {
    svDrag = true;
    try{ svEl.setPointerCapture(e.pointerId); }catch(_){}
    svPick(e);
    e.preventDefault();
  });
  svEl.addEventListener('pointermove', e => { if(svDrag) svPick(e); });
  svEl.addEventListener('pointerup',     () => { svDrag = false; });
  svEl.addEventListener('pointercancel', () => { svDrag = false; });
  hueEl.oninput = () => { hsv.h = +hueEl.value; curHex = hsvToHex(hsv); paintCur(false); };

  function addColor(){
    const {hex, name} = willAdd();
    if(!/^#[0-9a-f]{6}$/.test(hex)) return toast('Выберите оттенок');
    const dup = colorList.find(c => String(c.hex).toLowerCase() === hex);
    if(dup) return toast(`Этот оттенок уже есть — «${dup.name}»`);
    if(colorList.length >= 20) return toast('Больше 20 цветов не нужно');
    colorList.push({hex, name});
    nameEl.value = '';
    sugEl.hidden = true;
    paintColors();
    paintCur(false);
    toast('Цвет добавлен · ' + name);
  }

  nameEl.addEventListener('input', paintSug);
  nameEl.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    e.preventDefault();
    addColor();
  });
  w.querySelector('#xColorAdd').onclick = addColor;
  paintColors();
  paintCur(true);

  const grid = w.querySelector('#xGalGrid');
  const file = w.querySelector('#xf');

  const paintGal = () => {
    const slots = galList.map((src, i) => `
      <div class="ad__gal-item ${i===0?'is-cover':''}" data-gi="${i}">
        <img src="${src}" alt="Фото ${i+1}">
        ${i===0 ? '<span class="ad__gal-badge">Обложка</span>' : ''}
        <div class="ad__gal-acts">
          <button type="button" data-gact="left" aria-label="Влево" ${i===0?'disabled':''}>${svg('back','ic')}</button>
          <button type="button" data-gact="cover" aria-label="Сделать обложкой" ${i===0?'disabled':''}>${svg('img','ic')}</button>
          <button type="button" data-gact="right" aria-label="Вправо" ${i>=galList.length-1?'disabled':''}>${svg('chev','ic')}</button>
          <button type="button" data-gact="del" aria-label="Удалить">${svg('trash','ic')}</button>
        </div>
      </div>`).join('');
    const addBtn = galList.length < MAX_PHOTOS
      ? `<button type="button" class="ad__gal-add" id="xGalAdd">${svg('img','ic')}<span>${galList.length ? 'Ещё фото' : 'Загрузить<br>фото'}</span></button>`
      : '';
    grid.innerHTML = slots + addBtn;
    const add = w.querySelector('#xGalAdd');
    if(add) add.onclick = () => { file.value = ''; file.click(); };
  };

  grid.onclick = e => {
    const btn = e.target.closest('[data-gact]');
    if(!btn || btn.disabled) return;
    const item = btn.closest('[data-gi]');
    if(!item) return;
    const i = +item.dataset.gi;
    const act = btn.dataset.gact;
    if(act === 'del'){
      galList.splice(i, 1);
    } else if(act === 'left' && i > 0){
      [galList[i-1], galList[i]] = [galList[i], galList[i-1]];
    } else if(act === 'right' && i < galList.length - 1){
      [galList[i+1], galList[i]] = [galList[i], galList[i+1]];
    } else if(act === 'cover' && i > 0){
      const [ph] = galList.splice(i, 1);
      galList.unshift(ph);
    }
    paintGal();
  };

  let addingPhotos = false;
  /**
   * Фото добавляются по одному, а не все разом: раньше выбор пяти снимков
   * запускал пять полных декодирований одновременно и вешал вкладку.
   * Каждое готовое фото сразу появляется в списке — это и есть прогресс.
   */
  async function addFiles(list){
    if(addingPhotos) return;
    const room = MAX_PHOTOS - galList.length;
    if(room <= 0) return toast('Максимум ' + MAX_PHOTOS + ' фото');
    const files = [...list].slice(0, room);
    if(!files.length) return;
    addingPhotos = true;
    file.disabled = true;
    if(files.length > 1) toast('Готовлю фото: ' + files.length + '…');
    let ok = 0, bad = 0;
    try{
      for(const f of files){
        try{
          /* 1600 / 0.86: на витрине разницы не видно, а фото весит вдвое
             меньше и каталог грузится быстрее */
          galList.push(await fileToPhotoDataUrl(f, 1600, 0.86));
          ok++;
          paintGal();
        }catch(err){
          bad++;
          toast((err && err.message) || 'Не удалось прочитать фото');
        }
        /* отдаём кадр интерфейсу, иначе список не успевает обновиться */
        await letUiBreathe();
      }
    } finally {
      addingPhotos = false;
      file.disabled = false;
      file.value = '';
      paintGal();
    }
    if(files.length > 1 && ok) toast('Добавлено фото: ' + ok + (bad ? ' · не вышло: ' + bad : ''));
  }

  file.onchange = () => addFiles(file.files || []);
  w.querySelector('#xAddUrl').onclick = () => {
    const u = w.querySelector('#xi').value.trim();
    if(!u) return toast('Вставьте ссылку');
    if(galList.length >= MAX_PHOTOS) return toast('Максимум ' + MAX_PHOTOS + ' фото');
    if(galList.includes(u)) return toast('Это фото уже добавлено');
    galList.push(u);
    w.querySelector('#xi').value = '';
    paintGal();
  };
  paintGal();

  w.querySelector('#xCancel').onclick = () => w.remove();
  w.onclick = e => { if(e.target === w) w.remove(); };

  /* Пока запрос идёт, кнопка выключена: без этого каждый лишний тап по
     «Добавить» создавал ещё один такой же товар. */
  let saving = false;
  const saveBtn = w.querySelector('#xSave');
  const saveLabel = saveBtn.textContent;
  saveBtn.onclick = () => {
    /* saving — от повторного тапа во время запроса, isConnected — от клика
       по кнопке уже закрытой формы. */
    if(saving || !w.isConnected) return;
    const name = w.querySelector('#xn').value.trim();
    const price = +w.querySelector('#xp').value;
    if(!name){ toast('Впишите название'); return w.querySelector('#xn').focus(); }
    if(!price || price <= 0){ toast('Укажите цену больше нуля'); return w.querySelector('#xp').focus(); }
    const sizes = [...w.querySelectorAll('.xz:checked')].map(i => i.value);
    if(!sizes.length){ toast('Отметьте хотя бы один размер'); return; }
    const stock = {};
    w.querySelectorAll('.xs').forEach(inp => {
      if(sizes.includes(inp.dataset.sz)) stock[inp.dataset.sz] = Math.max(0, +inp.value||0);
    });
    const fallback = garment(
      /худи|hood/i.test(name) ? 'hoodie' : /джоггер|брюк/i.test(name) ? 'joggers' :
      /шорт/i.test(name) ? 'shorts' : /свитер|вязк/i.test(name) ? 'sweater' :
      /бомбер|куртк|жилет/i.test(name) ? 'jacket' : /костюм/i.test(name) ? 'suit' :
      /свитшот/i.test(name) ? 'sweat' : 'tshirt');
    const photos = galList.filter(Boolean);
    const img = photos[0] || fallback;
    const data = {
      name, price, cat, sizes, stock, badge,
      old:+w.querySelector('#xo').value || 0,
      gender,
      sku:w.querySelector('#xs').value.trim() || String(Math.floor(10000 + Math.random() * 90000)),
      desc:w.querySelector('#xd').value.trim(),
      img,
      gal: photos.length ? photos : [img],
      colors: colorList,
      tryon: w.querySelector('#xtry').checked,
      on:w.querySelector('#xon').checked
    };
    saving = true;
    saveBtn.disabled = true;
    saveBtn.textContent = editId ? 'Сохраняем…' : 'Добавляем…';
    (async () => {
      try{
        if(window.LC && S.user && S.user.admin){
          const saved = await LC.saveProduct(editId ? Object.assign({}, byId(editId), data, {id: editId}) : data);
          if(editId){
            Object.assign(byId(editId), saved);
            REVIEWS.forEach(r => { if(+r.pid === +saved.id) r.sku = String(saved.sku || ''); });
            (S.cart || []).forEach(i => { if(+i.id === +saved.id) i.sku = String(saved.sku || ''); });
            rvSave(); saveUser();
          } else {
            PRODUCTS.push(saved);
            dropReviewsForPid(saved.id);
            S.cart = (S.cart || []).filter(i => +i.id !== +saved.id);
            S.favs = (S.favs || []).filter(id => +id !== +saved.id);
            saveUser();
          }
          persist();
        } else {
          if(editId){
            Object.assign(byId(editId), data);
            const p = byId(editId);
            REVIEWS.forEach(r => { if(+r.pid === +editId) r.sku = String((p && p.sku) || data.sku || ''); });
            (S.cart || []).forEach(i => { if(+i.id === +editId) i.sku = String((p && p.sku) || data.sku || ''); });
            rvSave(); saveUser();
          } else {
            const nid = PRODUCTS.reduce((m,x) => Math.max(m,x.id),0) + 1;
            PRODUCTS.push({id:nid, ...data});
            dropReviewsForPid(nid);
            S.cart = (S.cart || []).filter(i => +i.id !== +nid);
            S.favs = (S.favs || []).filter(id => +id !== +nid);
            saveUser();
          }
          persist();
        }
        w.remove(); refresh(); render(true);
        toast(editId ? 'Изменения сохранены' : 'Товар добавлен');
      }catch(err){
        toast(err.message || 'Не удалось сохранить товар');
      }finally{
        /* форму уже могли снять — тогда возвращать нечего */
        saving = false;
        if(saveBtn.isConnected){
          saveBtn.disabled = false;
          saveBtn.textContent = saveLabel;
        }
      }
    })();
  };
}

/* ==========================================================
   СТАРТ
   ========================================================== */
async function bootFromServer(){
  loadUser();
  rvLoad();
  wipeStaleBrowserJunk();
  if(window.LC){
    try{
      const health = await LC.health();
      window.__LC_YK = !!health.yookassa;
      window.__LC_TG_BOT = String(health.telegramBot || '').replace(/^@/, '');
      window.__LC_GOOGLE = !!health.google;
      window.__LC_GOOGLE_ID = String(health.googleClientId || '');
      try{
        if(window.__LC_GOOGLE_ID) localStorage.setItem(GOOGLE_ID_KEY, window.__LC_GOOGLE_ID);
        else localStorage.removeItem(GOOGLE_ID_KEY);
      }catch(e){}
      /* окно входа уже открыто, а кнопки в нём нет — дорисовываем */
      if(window.__LC_GOOGLE_ID && ov.querySelector('.amod') && !ov.querySelector('#gsiBtn')){
        authModal(authMod.view);
      } else if(ov.querySelector('#gsiBtn')){
        mountGoogleButton();
      }
      window.__LC_SMTP = !!health.smtp;
      window.__LC_CDEK = !!health.cdek;
      const [products, cms] = await Promise.all([LC.loadCatalog(), LC.loadCms()]);
      if(Array.isArray(products)){
        PRODUCTS = products;
        persist();
      }
      pruneStaleClientData();
      if(cms){
        CMS = Object.assign(defaultCms(), cms, {
          brand: Object.assign({}, defaultCms().brand, cms.brand || {}),
          contacts: Object.assign({}, defaultCms().contacts, cms.contacts || {}),
          legal: Object.assign({}, defaultCms().legal, cms.legal || {}),
          texts: Object.assign({}, defaultCms().texts, cms.texts || {}),
          shipping: Object.assign({}, defaultCms().shipping, cms.shipping || {}),
          tryon: Object.assign({}, defaultCms().tryon, cms.tryon || {}),
          reviews: Object.assign({}, defaultCms().reviews, cms.reviews || {}),
          pvz: (Array.isArray(cms.pvz) && cms.pvz.length) ? cms.pvz : defaultCms().pvz,
          promos: Array.isArray(cms.promos) ? cms.promos : defaultCms().promos,
          slides: Array.isArray(cms.slides) ? cms.slides : [],
          about: {blocks: (cms.about && Array.isArray(cms.about.blocks)) ? cms.about.blocks : []},
          usp: uspMerge(defaultCms().usp, cms.usp)
        });
        try{ localStorage.setItem(CMS_KEY, JSON.stringify(CMS)); }catch(e){}
        syncBrandFromCms();
        syncTryonFromCms();
      }
      const earlyAdmin = new URLSearchParams(location.search).get('tg_admin');
      if(!earlyAdmin){
        const me = await applyServerSession();
        if(me){
          try{
            const remote = await LC.myOrders();
            ORDERS.length = 0;
            remote.forEach(o => ORDERS.push(normalizeServerOrder(o)));
          }catch(e){}
        }
      }
    }catch(err){
      console.warn('Сервер недоступен, локальный режим', err);
      toast('Сервер недоступен — показаны локальные данные');
    }
  }

  /* Авто-вход админа с бота (?tg_admin=) — ДО остальных auth, сбрасывает прошлую сессию */
  const bootQs = new URLSearchParams(location.search);
  const tgAdminTokEarly = bootQs.get('tg_admin');
  let tgAdminOpened = false;
  if(tgAdminTokEarly && window.LC && LC.loginTgAdmin){
    try{
      /* Сначала меняем сессию на серверную, и только если она пришла.
         Раньше здесь был logout() ДО проверки кода: по устаревшей ссылке
         человека выкидывало и из его обычного аккаунта. */
      const user = await LC.loginTgAdmin(tgAdminTokEarly);
      if(!user || !user.admin) throw new Error('У этого аккаунта нет прав администратора');
      S.user = user;
      S.tgLinked = false;
      grantAdmin(user.email);
      saveUser();
      toast('Вы вошли как админ');
      bootLockPlace = true;
      tgAdminOpened = true;
      history.replaceState(null, '', location.pathname + '#admin');
      try{ await openAdmin(); }catch(e){ console.warn(e); }
    }catch(err){
      history.replaceState(null, '', location.pathname + (location.hash || ''));
      tgAdminStaleDialog(err && err.message);
    }
  }

  /* возврат с ЮKassa */
  const paid = bootQs.get('paid');
  const paidT = bootQs.get('t') || '';
  if(paid && window.LC){
    try{
      if(paidT) LC.rememberOrderToken(paid, paidT);
      const tok = paidT || LC.orderToken(paid);
      const waitPaid = async () => {
        let order = normalizeServerOrder(await LC.getOrder(paid, true, tok));
        for(let i = 0; i < 5 && order && order.payStatus !== 'paid' && order.payStatus !== 'manual'; i++){
          await new Promise(r => setTimeout(r, 1200));
          order = normalizeServerOrder(await LC.getOrder(paid, true, tok));
        }
        return order;
      };
      const order = await waitPaid();
      if(order){
        seedOrderSeen();
        const ix = ORDERS.findIndex(o => o.num === order.num);
        if(ix >= 0) ORDERS[ix] = order; else ORDERS.unshift(order);
        S.lastOrder = order;
        saveUser();
        S.screen = 'done';
        bootLockPlace = true;
        if(order.payStatus === 'paid'){
          S.cart = [];
          saveUser();
          toast('Оплата прошла · заказ №' + order.num);
        } else {
          toast('Заказ №' + order.num + ' сохранён. Если оплата не прошла — нажмите «Оплатить».');
        }
        history.replaceState(null, '', location.pathname + location.hash);
      }
    }catch(e){
      console.warn('paid return', e);
      toast((e && e.message) || 'Не удалось загрузить заказ после оплаты');
    }
  }

  ORDERS.forEach(o => { if(o.status === 'Доставка') o.status = 'Едет'; });
  if(S.orderTab === 'Доставка') S.orderTab = 'Едет';
  if(ORDERS.length){
    const maxN = Math.max(...ORDERS.map(o => +o.num || 0), 10000);
    if(maxN >= orderSeq) orderSeq = maxN + 1;
  }

  /* Авто-вход после регистрации через Telegram-контакт */
  const qs = bootQs;
  const authErr = qs.get('auth_err');
  if(authErr){
    toast(authErr);
    history.replaceState(null, '', location.pathname + (location.hash || ''));
  }

  /* Возврат от Google: токен приезжает в hash.

     Раньше здесь было просто `if(me){ ... }` — и если сервер отвечал
     пусто (например, пока шла пересборка), не происходило ровным счётом
     ничего: ни входа на экране, ни ошибки. Токен при этом уже лежал в
     хранилище, поэтому ручное обновление страницы «вдруг» показывало,
     что человек вошёл. Теперь пробуем ещё раз по куке и в любом случае
     перерисовываем экран. */
  const hash = String(location.hash || '');
  const gm = /^#google_token=(.+)$/.exec(hash);
  if(gm && window.LC){
    /* адрес чистим сразу: токен не должен остаться в истории браузера */
    history.replaceState(null, '', location.pathname);
    try{
      LC.setToken(decodeURIComponent(gm[1]));
      let me = await LC.me().catch(() => null);
      /* вторая попытка: серверная кука уже стоит, ей токен не нужен */
      if(!me) me = await applyServerSession().catch(() => null);
      if(me){
        S.user = me;
        if(me.admin) grantAdmin(me.email);
        saveUser();
        await refreshMyOrders(false).catch(() => {});
        bootLockPlace = true;
        continueAfterAuth({
          isNew: profileNeedsFill(me),
          next: 'profile',
          askTg: true
        });
      } else {
        /* молчать нельзя: человек должен понимать, что произошло */
        toast('Google подтвердил вход, но сервер не ответил — обновите страницу');
        render(true);
      }
    }catch(err){
      toast((err && err.message) || 'Google вход не удался');
      render(true);
    }
  }

  const tgPhoneTok = qs.get('tg_phone');
  if(tgPhoneTok && !tgAdminTokEarly && window.LC){
    try{
      const d = await LC.api('/api/auth/telegram-phone', { method:'POST', body:{ token: tgPhoneTok } });
      if(d && d.user){
        if(d.token) LC.setToken(d.token);
        S.user = d.user;
        if(d.user.admin) grantAdmin(d.user.email);
        saveUser();
        await refreshMyOrders(false);
        history.replaceState(null, '', location.pathname + (location.hash || ''));
        bootLockPlace = true;
        continueAfterAuth({
          isNew: profileNeedsFill(d.user),
          next: 'profile',
          askTg: true
        });
      }
    }catch(err){
      toast(err.message || 'Ссылка устарела');
      history.replaceState(null, '', location.pathname + (location.hash || ''));
    }
  }

  /* Со страницы письма: #reset=<билет>. Секрет вырезаем из адреса сразу —
     он не должен осесть ни в истории браузера, ни в кнопке «Поделиться».
     Сервер хеш и так не видит: то, что после «#», в запрос не уходит. */
  const resetHit = /[#&]reset=([^&]+)/.exec(location.hash || '');
  const resetTicket = resetHit ? decodeURIComponent(resetHit[1]) : '';
  /* ссылка из письма протухла — открываем восстановление, а не главную */
  const wantForgot = !resetTicket && /^#forgot\b/i.test(location.hash || '');
  if(resetTicket || wantForgot) history.replaceState(null, '', location.pathname + location.search);

  /* Авто-вход админа с бота — уже обработан выше (?tg_admin=) */

  const wantAdmin = /^#admin\b/i.test(location.hash || '') && isAdmin();
  restorePlace();
  /* панель уже открыта ссылкой из бота — второй openAdmin() только перезагружал её */
  if(wantAdmin && !tgAdminOpened){
    setTimeout(() => { try{ openAdmin(); }catch(e){} }, 200);
  }

  /* с бота (?from=tg) — не дёргаем шторку уведомлений каждый раз */
  const fromTg = qs.get('from') === 'tg';
  if(fromTg && !tgAdminTokEarly){
    history.replaceState(null, '', location.pathname + (location.hash || ''));
  }

  if(S.user && window.LC){
    tgLinkedStatus().then(st => { S.tgLinked = !!st.linked; }).catch(() => {});
  }

  seedOrderSeen();
  try{ await rvHydrateFromServer(); }catch(_){}
  pruneStaleClientData();

  if(S.cart.length && revalidateCart().length){
    setTimeout(() => toast(cartBlocked()
      ? 'Часть товаров в корзине закончилась'
      : 'Корзина обновилась — часть позиций изменилась'), 600);
  }
  render();
  restorePlaceScroll();
  persistPlace();

  /* Спрашиваем сервер, живой ли билет и чей он: покупатель не должен
     набирать новый пароль в форму, которая всё равно его не примет. */
  if(resetTicket && window.LC){
    try{
      const who = await LC.api('/api/auth/reset/check', { method:'POST', body:{ ticket: resetTicket } });
      authMod.ticket = resetTicket;
      authMod.email = (who && who.email) || '';
      authMod.mask = (who && who.emailMask) || '';
      authModal('newpass');
    }catch(err){
      toast((err && err.message) || 'Ссылка устарела — запросите смену пароля заново');
      setTimeout(() => authModal('forgot'), 900);
    }
  } else if(wantForgot){
    authModal('forgot');
  }
}
bootFromServer().catch((err) => {
  console.error('bootFromServer', err);
  /* Сервер не ответил — показываем сайт на сохранённых данных, а не пустой
     экран. Что именно случилось, объясняет полоса состояния связи. */
  try{ render(); }catch(e){ console.error(e); }
  try{
    if(err && (err.offline || !navigator.onLine)) NET.set('offline');
    else toast('Сервер не отвечает — показываем сохранённые данные');
  }catch(_){}
});

/* ==========================================================
   ЖИВОЕ ОБНОВЛЕНИЕ
   Сначала спрашиваем короткие отпечатки (/api/live-version) и качаем
   каталог, отзывы или CMS, только если они реально изменились: раньше
   каждый опрос тянул мегабайты и сажал и сеть, и телефон.
   Экран трогаем только при изменениях — иначе innerHTML моргает фото.
   ========================================================== */
(() => {
  let pulling = false;
  let ordTick = 0;
  let _adminFeed = false;
  const seen = {products:'', reviews:'', cms:''};

  async function pullLive(){
    if(pulling || document.hidden || !window.LC) return;
    if(livePaintQueued && !liveUiBusy()) requestLivePaint();
    pulling = true;
    try{
      const adminOn = !!adm.querySelector('.ad');
      const admin = adminOn && S.user && S.user.admin;

      /* что изменилось на сервере */
      let ver = null;
      try{ ver = await LC.liveVersion(); }catch(_){}
      const changed = key => !ver || !ver[key] || ver[key] !== seen[key];
      /* в админке каталог и отзывы приходят другим запросом (со скрытыми
         позициями), поэтому при её открытии отпечатки сбрасываем */
      if(admin !== _adminFeed){ _adminFeed = admin; seen.products = ''; seen.reviews = ''; }

      const jobs = [];
      let catIdx = -1, reviewsIdx = -1, ordersIdx = -1, adminOrdersIdx = -1, cmsIdx = -1;
      if(changed('products')){
        catIdx = jobs.length;
        jobs.push(admin ? LC.loadCatalogAll().catch(() => LC.loadCatalog()) : LC.loadCatalog());
      }
      /* заказы отпечатка не имеют — опрашиваем реже, они меняются не мгновенно */
      const wantOrders = (++ordTick % 3 === 1);
      /* Пока открыта админка, свои покупательские заказы не трогаем: ниже
         тем же тиком грузятся ВСЕ заказы магазина, и список ORDERS
         перезаписывался дважды разным содержимым. «Что-то изменилось»
         срабатывало каждый раз, панель перерисовывалась каждые 2 секунды —
         это и было моргание. */
      if(S.user && wantOrders && !adminOn){ ordersIdx = jobs.length; jobs.push(LC.myOrders()); }
      if(changed('reviews')){
        reviewsIdx = jobs.length;
        jobs.push(admin ? LC.adminReviews() : LC.loadReviews());
      }
      if(admin && wantOrders){
        adminOrdersIdx = jobs.length;
        jobs.push(LC.adminOrders());
      }
      if(changed('cms')){
        cmsIdx = jobs.length;
        jobs.push(LC.loadCms());
      }
      if(!jobs.length && !(!S.user && ORDERS.length && wantOrders)){
        if(ver) Object.assign(seen, ver);
        return;
      }
      const settled = await Promise.allSettled(jobs);
      const got = i => (i >= 0 && settled[i].status === 'fulfilled') ? settled[i].value : null;
      const products = got(catIdx);
      const orders = got(ordersIdx);
      const reviews = got(reviewsIdx);
      /* отпечаток запоминаем только там, где запрос удался: иначе после
         сетевой ошибки данные так и остались бы старыми */
      if(ver){
        if(catIdx < 0 || products) seen.products = ver.products;
        if(reviewsIdx < 0 || reviews) seen.reviews = ver.reviews;
        if(cmsIdx < 0 || got(cmsIdx)) seen.cms = ver.cms;
      }
      let dirty = false;
      if(applyLiveProducts(products)) dirty = true;
      if(applyLiveReviews(reviews)) dirty = true;

      if(Array.isArray(orders)){
        const before = buyerOrderFingerprint();
        const leftover = new Map((ORDERS || []).map(o => [String(o.num), o]));
        ORDERS.length = 0;
        orders.forEach(o => {
          const n = normalizeServerOrder(o);
          ORDERS.push(n);
          leftover.delete(String(n.num));
        });
        leftover.forEach((o, num) => {
          if(LC.orderToken && LC.orderToken(num)) ORDERS.push(o);
        });
        if(S.lastOrder && S.lastOrder.num){
          const live = ORDERS.find(x => String(x.num) === String(S.lastOrder.num));
          if(live) S.lastOrder = live;
        }
        if(before !== buyerOrderFingerprint()){
          saveUser();
          dirty = true;
        }
      } else if(!S.user && ORDERS.length && wantOrders){
        const before = buyerOrderFingerprint();
        await Promise.all(ORDERS.map(o => o && o.num ? pullOrderByNum(o.num).catch(() => {}) : null));
        if(before !== buyerOrderFingerprint()) dirty = true;
      }

      if(adminOrdersIdx >= 0){
        const adminOrders = got(adminOrdersIdx);
        if(Array.isArray(adminOrders)){
          const before = buyerOrderFingerprint();
          ORDERS.length = 0;
          adminOrders.forEach(o => ORDERS.push(normalizeServerOrder(o)));
          if(before !== buyerOrderFingerprint()){
            saveUser();
            dirty = true;
          }
        }
      }

      if(got(cmsIdx)){
        const cms = got(cmsIdx);
        try{
          const prev = JSON.stringify(CMS.shipping || {}) + JSON.stringify(CMS.reviews || {});
          CMS.shipping = Object.assign({}, CMS.shipping || {}, cms.shipping || {});
          CMS.reviews = Object.assign({}, CMS.reviews || {}, cms.reviews || {});
          if(prev !== JSON.stringify(CMS.shipping || {}) + JSON.stringify(CMS.reviews || {})) dirty = true;
          /* главная (фото, тексты, плашки) — иначе правки из админки
             доезжали до покупателя только после перезагрузки страницы */
          const homeKey = () => JSON.stringify([CMS.slides || [], CMS.texts || {}, CMS.usp || {}, CMS.about || {}]);
          const beforeHome = homeKey();
          if(Array.isArray(cms.slides)) CMS.slides = cms.slides;
          CMS.texts = Object.assign({}, CMS.texts || {}, cms.texts || {});
          CMS.usp = uspMerge(defaultCms().usp, cms.usp);
          if(cms.about && Array.isArray(cms.about.blocks)) CMS.about = cms.about;
          if(beforeHome !== homeKey()) dirty = true;
        }catch(_){}
      }

      if(adminOn){
        if(dirty) paintAdmin();
        return;
      }

      if(dirty) requestLivePaint();
    }catch(_){}
    finally { pulling = false; }
  }

  /* чтобы «связь появилась» могла сразу дёрнуть обновление */
  window.__lcPullLive = pullLive;
  setInterval(pullLive, 2000);
  window.addEventListener('storage', e => {
    if(e.key !== KEY) return;
    const fresh = store.load();
    if(applyLiveProducts(fresh)) requestLivePaint();
  });
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) return;
    pullLive();
    refreshAuthUser().catch(() => {});
  });
  setInterval(() => {
    if(!document.hidden && S.user) refreshAuthUser().catch(() => {});
  }, 20000);
})();
</script>
</body>
</html>
