async function rvSubmit(p){
  const d = rvDraft;
  if(!d) return;
  if(d.id) return toast('Отзыв нельзя изменить');
  if(!d.rating) return toast('Поставьте оценку');
  const text = String(d.text || '').trim();
  if(text.length < RV_MIN_TEXT) return toast(`Расскажите чуть подробнее — минимум ${RV_MIN_TEXT} символов`);
  const name = String(d.name || '').trim() || 'Покупатель';
  const sku = String(p.sku || '').trim();
  if(!sku) return toast('Не удалось привязать отзыв к товару');
  if(!window.LC || !LC.createReview) return toast('Сервер недоступен — отзыв не сохранится для других');
  if(!S.user) return toast('Войдите, чтобы отзыв увидели другие');

  const send = document.getElementById('rvSend');
  if(send) send.disabled = true;
  try{
    const saved = await LC.createReview({
      productId: p.id,
      rating: d.rating,
      fit: +d.fit,
      size: d.size,
      name,
      text,
      photos: (d.photos || []).slice()
    });
    if(saved){
      REVIEWS = REVIEWS.filter(x => +x.id !== +saved.id);
      REVIEWS.unshift(saved);
      if(!rvMine.includes(saved.id)) rvMine.push(saved.id);
      rvSave();
    }
    closeOv();
    render(true);
    refresh();
    toast(saved && saved.status === 'new' ? 'Спасибо! Отзыв уйдёт на проверку' : 'Спасибо! Отзыв опубликован');
  }catch(e){
    toast(e.message || 'Не удалось отправить отзыв');
    if(send) send.disabled = false;
  }
}

async function rvVote(id){
  const r = REVIEWS.find(x => x.id === +id);
  if(!r) return;
  if(rvIsMine(r)) return toast('Это ваш отзыв');
  if(!window.LC || !LC.voteReview) return toast('Войдите, чтобы оценить отзыв');
  try{
    const saved = await LC.voteReview(id);
    if(saved){
      const i = REVIEWS.findIndex(x => x.id === +id);
      if(i >= 0) REVIEWS[i] = Object.assign({}, REVIEWS[i], saved);
      if(saved.voted){
        if(!rvVotes.includes(+id)) rvVotes.push(+id);
      } else {
        rvVotes = rvVotes.filter(x => x !== +id);
      }
      rvSave();
    }
    if(document.getElementById('rvSheet')) rvRepaint();
    else render(true);
  }catch(e){
    toast(e.message || 'Не удалось оценить отзыв');
  }
}

async function rvHydrateFromServer(){
  if(!window.LC || !LC.loadReviews) return;
  const localMine = REVIEWS.filter(r => rvIsMine(r));
  let remote = [];
  try{
    remote = (S.user && S.user.admin && LC.adminReviews)
      ? await LC.adminReviews()
      : await LC.loadReviews();
  }catch(e){
    try{ remote = await LC.loadReviews(); }catch(_){ return; }
  }
  if(!Array.isArray(remote)) return;
  REVIEWS = remote;
  if(S.user && localMine.length){
    for(const r of localMine){
      const already = REVIEWS.some(x =>
        +x.pid === +r.pid && String(x.text || '') === String(r.text || '')
      );
      if(already) continue;
      try{
        const saved = await LC.createReview({
          productId: r.pid,
          rating: r.rating,
          fit: r.fit,
          size: r.size,
          name: r.name,
          text: r.text,
          photos: r.photos || []
        });
        if(saved) REVIEWS.unshift(saved);
      }catch(_){
        if(!REVIEWS.some(x => +x.pid === +r.pid && String(x.text || '') === String(r.text || ''))){
          REVIEWS.push(Object.assign({}, r, { mine: true }));
        }
      }
    }
  }
  rvMine = REVIEWS.filter(r => r.mine).map(r => r.id);
  rvVotes = REVIEWS.filter(r => r.voted).map(r => r.id);
  rvSeq = REVIEWS.reduce((m,r) => Math.max(m, +r.id || 0), 0) + 1;
  rvSave();
}

   Реальные ПВЗ приходят с сервера через официальный CDEK API v2.

/* Расстояние по прямой — этого хватает, чтобы отсортировать
   несколько точек в одном городе. */
function pvzDist(a, b){
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const x = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const pvzKm = k => k < 1 ? Math.round(k * 1000) + ' м' : k.toFixed(1).replace('.', ',') + ' км';

   Leaflet + тайлы OpenStreetMap: без ключей и регистрации.
   Не загрузилась (нет сети) — показываем список и ссылки
   на Яндекс.Карты, выбрать пункт всё равно можно.

const MAP_CSS = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';

function ensureMap(){
  if(mapLib) return mapLib;
  mapLib = new Promise((res, rej) => {
    if(window.L) return res(window.L);
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = MAP_CSS;
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = MAP_JS;
    js.onload  = () => window.L ? res(window.L) : rej(new Error('no-lib'));
    js.onerror = () => rej(new Error('offline'));
    document.head.appendChild(js);
    setTimeout(() => rej(new Error('timeout')), 7000);
  });
  mapLib.catch(() => { mapLib = null; });   // появится сеть — попробуем снова
  return mapLib;
}

function pvzShown(){
  const all = pvzFiltered();
  return pvzView.all ? all : all.slice(0, 8);
}

function sheetPvz(){
  const chosen = S.checkout.pvz;
  pvzView = {
    city: chosen && chosen.cityCode ? {code: chosen.cityCode, city: chosen.city || ''} : null,
    cities: [],
    points: [],
    me: null,
    q: (chosen && chosen.city) || '',
    all: false,
    geo: 'idle',
    loading: false,
    error: '',
    req: pvzView.req + 1
  };
  openOv(`<div class="scrim"></div><div class="sheet sheet--tall" role="dialog" aria-label="Пункт выдачи">
    <div class="sheet__g"></div>
    <div class="sheet__h"><span class="sheet__t">Выберите ПВЗ СДЭК</span>
      <button class="hd__b" data-x aria-label="Закрыть">${svg('x')}</button></div>
    <div class="sheet__b">
      <p class="pvz__lead">Как на маркетплейсе: определим ваше местоположение или найдём город по поиску.</p>
      <div class="pvz__search">
        <input class="f__i" id="pvzSearch" value="${esc(pvzView.q)}"
          placeholder="Город или адрес, например Москва Тверская" autocomplete="address-level2">
        <button type="button" class="ghb pvz__search-b" data-a="pvzsearch">Найти</button>
      </div>
      <div class="pvz__cities" id="pvzCities"></div>
      <div class="pvz__map" id="pvzMap"><span class="pvz__map-s">Загружаем карту…</span></div>
      <div class="pvz__ctrl" id="pvzCtrl"></div>
      <div id="pvzList"></div>
    </div></div>`);
  bindPvzSearch();
  pvzPaint();
  if(chosen && chosen.cityCode) pvzLoadPoints();
  pvzLocate();
}

function pvzPaint(){
  const ctrl = document.getElementById('pvzCtrl');
  const box  = document.getElementById('pvzList');
  const citiesBox = document.getElementById('pvzCities');
  if(!ctrl || !box || !citiesBox) return;
  const filtered = pvzFiltered();
  const total = filtered.length;

  citiesBox.innerHTML = pvzView.cities.length ? pvzView.cities.map(c => `
    <button type="button" class="chip" data-a="pvzcity:${encodeURIComponent(c.code)}"
      aria-pressed="${pvzView.city && +pvzView.city.code === +c.code}">
      ${esc(c.city)}${c.region ? ' · ' + esc(c.region) : ''}
    </button>`).join('') : '';

  ctrl.innerHTML = `
    <button class="chip pvz__geo" data-a="pvzgeo" aria-pressed="${!!pvzView.me}">
      ${svg('pin','ic ic--xs')} ${pvzView.geo === 'wait' ? 'Ищем вас…' : 'Рядом со мной'}</button>
    ${pvzView.city ? `<span class="chip" aria-pressed="true">${esc(pvzView.city.city || 'Город выбран')}</span>` : ''}`;

  if(pvzView.loading){
    box.innerHTML = `<div class="pvz__state"><b>Загружаем ПВЗ СДЭК</b>Получаем реальные пункты выдачи и строим карту.</div>`;
    return;
  }
  if(pvzView.error){
    box.innerHTML = `<div class="pvz__state pvz__state--err"><b>Не удалось загрузить ПВЗ</b>${esc(pvzView.error)}</div>`;
    const mapBox = document.getElementById('pvzMap');
    if(mapBox) mapBox.innerHTML = '<span class="pvz__map-s">ПВЗ не загружены</span>';
    return;
  }
  if(!pvzView.city && !pvzView.me && !filtered.length){
    box.innerHTML = `<div class="pvz__state"><b>Введите город или разрешите геолокацию</b>После этого покажем ближайшие реальные ПВЗ СДЭК.</div>`;
    const mapBox = document.getElementById('pvzMap');
    if(mapBox) mapBox.innerHTML = '<span class="pvz__map-s">Ждём город или геолокацию</span>';
    return;
  }

  const list = pvzShown();
  box.innerHTML = `
    <p class="pvz__head">${pvzView.me ? 'Ближайшие к вам' : 'Пункты выдачи · ' + esc((pvzView.city && pvzView.city.city) || '—')}</p>
    ${list.length ? list.map(p => {
      const on = S.checkout.pvz && S.checkout.pvz.code === p.code;
      return `<button type="button" class="pvz__i${on ? ' on' : ''}" data-a="pvzpick:${encodeURIComponent(p.code)}">
        <span class="pvz__r"></span>
        <span class="pvz__b">
          <span class="pvz__n">${esc(p.addr)}</span>
          <span class="pvz__m">${esc(p.city)}${p.km != null ? ' · ' + pvzKm(p.km) + ' от вас' : ''}</span>
          ${p.hours ? `<span class="pvz__m">${esc(p.hours)}</span>` : ''}
        </span>
        <span class="btn pvz__choose">Выбрать</span>
      </button>`;
    }).join('') : `<p class="none" style="padding:22px 12px">В этом городе пунктов пока нет</p>`}
    ${total > list.length ? `<button type="button" class="ghb pvz__more" data-a="pvzmore">Показать все · ${total}</button>` : ''}`;
}

function bindPvzSearch(){
  const input = document.getElementById('pvzSearch');
  if(!input) return;
  input.oninput = () => {
    pvzView.q = input.value.trim();
    clearTimeout(pvzSearchTimer);
    pvzSearchTimer = setTimeout(() => pvzSearchCity(false), 350);
  };
  input.onkeydown = e => {
    if(e.key === 'Enter'){
      e.preventDefault();
      pvzSearchCity(true);
    }
  };
}

async function pvzSearchCity(force){
  if(!window.LC) return pvzSetError('API сайта недоступен');
  const q = (document.getElementById('pvzSearch')?.value || pvzView.q || '').trim();
  pvzView.q = q;
  if(q.length < 2){
    pvzView.cities = [];
    if(force) pvzSetError('Введите город или адрес минимум из 2 символов');
    else { pvzView.error = ''; pvzPaint(); }
    return;
  }
  const req = ++pvzView.req;
  pvzView.loading = true;
  pvzView.error = '';
  pvzPaint();
  try{
    const cities = await LC.cdekCities({q});
    if(req !== pvzView.req) return;
    pvzView.cities = cities || [];
    pvzView.loading = false;
    if(!pvzView.cities.length){
      pvzView.points = [];
      pvzSetError('СДЭК не нашёл такой город. Попробуйте написать город без сокращений.');
      return;
    }
    pvzView.city = pvzView.cities[0];
    pvzView.me = null;
    pvzView.geo = 'idle';
    await pvzLoadPoints(q);
  }catch(e){
    if(req !== pvzView.req) return;
    pvzSetError(e.message || 'Ошибка поиска города СДЭК');
  }
}

function pvzSetError(msg){
  pvzView.loading = false;
  pvzView.error = msg || 'Неизвестная ошибка';
  pvzPaint();
}

/* Геолокация: спрашиваем сразу после открытия — тап по кнопке
   и есть тот жест, которого требует браузер. */
function pvzLocate(force){
  if(!navigator.geolocation){
    if(force) toast('Браузер не умеет определять положение');
    return;
  }
  pvzView.geo = 'wait';
  pvzPaint();
  navigator.geolocation.getCurrentPosition(
    async pos => {
      pvzView.me = {lat: pos.coords.latitude, lng: pos.coords.longitude};
      pvzView.geo = 'ok';
      pvzView.all = false;
      pvzPaint();
      try{
        if(window.LC){
          const cities = await LC.cdekCities({lat: pvzView.me.lat, lng: pvzView.me.lng});
          pvzView.cities = cities || [];
          if(pvzView.cities[0]) pvzView.city = pvzView.cities[0];
        }
        if(!pvzView.city){
          pvzSetError('Не удалось определить город СДЭК по геолокации. Введите город вручную.');
          return;
        }
        await pvzLoadPoints();
      }catch(e){
        pvzSetError(e.message || 'Не удалось загрузить ближайшие ПВЗ');
      }
    },
    () => {
      pvzView.geo = 'deny';
      pvzPaint();
      if(force) toast('Не получилось определить положение — введите город');
    },
    {timeout: 8000, maximumAge: 300000}
  );
}

async function pvzLoadPoints(q){
  if(!window.LC) return pvzSetError('API сайта недоступен');
  if(!pvzView.city) return pvzSetError('Сначала выберите город');
  const req = ++pvzView.req;
  pvzView.loading = true;
  pvzView.error = '';
  pvzPaint();
  try{
    const raw = await LC.cdekPoints({
      city_code: pvzView.city && pvzView.city.code,
      lat: pvzView.me && pvzView.me.lat,
      lng: pvzView.me && pvzView.me.lng,
      q: q || '',
      limit: 120
    });
    if(req !== pvzView.req) return;
    pvzView.points = (raw || []).map(pvzNormalizePoint);
    if(pvzView.me){
      pvzView.points = pvzView.points.map(p => ({
        ...p,
        km: p.km != null ? p.km : pvzDist(pvzView.me, p)
      })).sort((a,b) => a.km - b.km);
    }
    pvzView.loading = false;
    pvzPaint();
    pvzDrawMap();
  }catch(e){
    if(req !== pvzView.req) return;
    pvzSetError(e.message || 'Ошибка загрузки ПВЗ СДЭК');
  }
}

function pvzDrawMap(){
  const box = document.getElementById('pvzMap');
  if(!box) return;
  /* на карте — все точки фильтра; в списке ниже может быть укороченный топ */
  const list = pvzFiltered();
  if(!list.length){ box.innerHTML = '<span class="pvz__map-s">Нет точек для показа</span>'; return; }

  ensureMap().then(L => {
    if(!document.getElementById('pvzMap')) return;
    if(!pvzMap || !box.querySelector('.leaflet-pane')){
      if(pvzMap){ try{ pvzMap.remove(); }catch(e){} }   // шторку закрыли — узел старой карты мёртв
      box.innerHTML = '';
      pvzMap = L.map(box, {zoomControl:true, attributionControl:true});
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
      }).addTo(pvzMap);
      pvzLayer = L.layerGroup().addTo(pvzMap);
    }
    pvzLayer.clearLayers();
    const pts = [];
    list.forEach((p, i) => {
      const n = i + 1;
      const on = S.checkout.pvz && S.checkout.pvz.code === p.code;
      const icon = L.divIcon({
        className: 'pvz__pin-w',
        html: `<button type="button" class="pvz__pin${on ? ' on' : ''}" aria-label="${esc(p.addr)}">${n}</button>`,
        iconSize: [26, 26], iconAnchor: [13, 13]
      });
      const km = p.km != null ? `<br>${pvzKm(p.km)} от вас` : '';
      L.marker([p.lat, p.lng], {icon})
        .addTo(pvzLayer)
        .bindPopup(`<b>${esc(p.addr)}</b><br>${esc(p.city)}${km}${p.hours ? '<br>' + esc(p.hours) : ''}<br><small>Нажмите маркер ещё раз, чтобы выбрать</small>`)
        .on('click', () => pvzPick(p.code));
      pts.push([p.lat, p.lng]);
    });
    if(pvzView.me){
      L.circleMarker([pvzView.me.lat, pvzView.me.lng], {
        radius:7, color:'#1f9d55', fillColor:'#1f9d55', fillOpacity:.95, weight:2
      }).addTo(pvzLayer).bindPopup('Вы здесь');
      pts.push([pvzView.me.lat, pvzView.me.lng]);
    }
    pvzMap.fitBounds(pts, {padding:[36,36], maxZoom: pvzView.me ? 13 : 14});
    setTimeout(() => pvzMap && pvzMap.invalidateSize(), 80);
  }).catch(() => {
    /* офлайн или карта заблокирована — не мешаем выбрать пункт */
    const b = document.getElementById('pvzMap');
    if(b) b.innerHTML = `<span class="pvz__map-s">Карта не загрузилась — нет связи.<br>
      Пункты можно выбрать списком ниже.</span>`;
  });
}

function pvzPick(code){
  const p = pvzView.points.find(x => String(x.code) === String(code));
  if(!p) return;
  /* сохраняем копию: адрес точки в заказе не должен меняться,
     если магазин потом поправит справочник */
  S.checkout.pvz = {
    code: p.code,
    id: p.code,
    type: p.type || 'PVZ',
    ownerCode: p.ownerCode || '',
    city: p.city,
    cityCode: p.cityCode || (pvzView.city && pvzView.city.code) || 0,
    addr: p.addr,
    addressComment: p.addressComment || '',
    hours: p.hours || '',
    lat: +p.lat,
    lng: +p.lng,
    phone: p.phone || '',
    haveCashless: p.haveCashless === true,
    haveCash: p.haveCash === true,
    allowedCod: p.allowedCod === true,
    isHandout: p.isHandout !== false,
    isReception: p.isReception === true,
    isDressingRoom: p.isDressingRoom === true,
    weightMin: +p.weightMin || 0,
    weightMax: +p.weightMax || 0
  };
  rememberDefaultPvz(S.checkout.pvz);
  closeOv();
  render(true);
  toast('Пункт выдачи выбран');
}

function legalVal(key, fallback){
  try{
    if(typeof CMS !== 'undefined' && CMS.legal && CMS.legal[key]){
      const cv = String(CMS.legal[key]).trim();
      if(cv) return cv;
    }
  }catch(e){}
  const v = (LINKS.legal && LINKS.legal[key]) || '';
  if(v) return v;
  if(fallback) return fallback;
  return null;
}
function legalOr(key, label){
  return legalVal(key, key === 'email' ? LINKS.email : key === 'phone' ? LINKS.phone : '')
    || `<span class="leg-miss">[укажите ${label} в LINKS.legal]</span>`;
}
function legalLineAuto(){
  if(LINKS.legalLine) return LINKS.legalLine;
  const parts = [];
  const name = legalVal('sellerName');
  const inn = legalVal('inn');
  if(name) parts.push(name);
  if(inn) parts.push('ИНН ' + inn);
  return parts.join(' · ');
}

/**

function googleBtnHTML(){
  if(!window.__LC_GOOGLE) return '';
  return `<div class="amod__gwrap" id="gsiBtn"></div>
  <button type="button" class="amod__google hide" id="gsiFallback" data-a="auth_google">

  </button>`;

/* ==========================================================
   ВХОД ЧЕРЕЗ GOOGLE
   Работает по ID-токену (Google Identity Services): Google отдаёт
   браузеру подписанный токен, сервер проверяет подпись публичными
   ключами Google. Секретный ключ приложения при этом не нужен —
   поэтому его нигде и нет.

   Если Client ID не пришёл, откатываемся на старый переход
   /api/auth/google — он работает, когда на сервере задан секрет.
   ========================================================== */
let gsiLoading = null;
function loadGoogleScript(){
  if(window.google && google.accounts && google.accounts.id) return Promise.resolve(true);
  if(gsiLoading) return gsiLoading;
  gsiLoading = new Promise(resolve => {
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client';
    sc.async = true;
    sc.onload = () => resolve(true);
    sc.onerror = () => resolve(false);   // без интернета до Google — не падаем
    document.head.appendChild(sc);
  });
  return gsiLoading;
}

/** Общий обработчик ответа Google: токен -> сервер -> вход. */
async function onGoogleCredential(resp){
  if(!resp || !resp.credential){ toast('Google не вернул данные'); return; }
  try{
    const d = await LC.api('/api/auth/google/token', {
      method:'POST', body:{ credential: resp.credential }
    });
    if(d && d.token) LC.setToken(d.token);
    toast('Вы вошли через Google');
    authDone(d && d.user, false);
  }catch(err){
    toast((err && err.message) || 'Google вход не удался');
  }
}

/**
 * Рисует кнопку Google в открытом окне входа.
 *
 * Раньше здесь вызывался prompt() — всплывающее окошко One Tap. Google
 * глушит его после первого закрытия (и когда браузер режет сторонние
 * куки), а запасным путём стоял переход на старую схему с секретным
 * ключом — которого у нас нет. Отсюда и была ошибка про ключи Google
 * при второй попытке входа. Настоящая кнопка таких ограничений не имеет.
 */
async function mountGoogleButton(){
  const box = document.getElementById('gsiBtn');
  const cid = window.__LC_GOOGLE_ID;
  if(!box || !cid) return;

  const ok = await loadGoogleScript();
  const api = window.google && google.accounts && google.accounts.id;
  if(!ok || !api){
    /* скрипт Google не доехал — показываем свою кнопку */
    const fb = document.getElementById('gsiFallback');
    if(fb) fb.classList.remove('hide');
    return;
  }
  if(!document.getElementById('gsiBtn')) return;   // окно успели закрыть
  google.accounts.id.initialize({ client_id: cid, callback: onGoogleCredential });
  google.accounts.id.renderButton(box, {
    type: 'standard', theme: 'outline', size: 'large',
    text: 'signin_with', shape: 'rectangular', logo_alignment: 'center',
    locale: 'ru', width: Math.round(Math.min(400, box.clientWidth || 320))
  });
}

/** Запасной путь: сработает, только если скрипт Google не загрузился. */
async function startGoogleLogin(){
  const ok = await loadGoogleScript();
  const api = window.google && google.accounts && google.accounts.id;
  if(!ok || !api || !window.__LC_GOOGLE_ID){
    toast('Google сейчас недоступен — войдите почтой или через Telegram');
    return;
  }
  google.accounts.id.initialize({ client_id: window.__LC_GOOGLE_ID, callback: onGoogleCredential });
  google.accounts.id.prompt();
}

async function pullPrefs(){
  if(!S.user || !window.LC || !LC.getPrefs) return;
  try{
    const p = await LC.getPrefs();
    if(!p) return;
    const byKey = i => [i.id, i.size || '', i.color || ''].join('|');
    const seen = new Set((S.cart || []).map(byKey));
    (p.cart || []).forEach(i => { if(i && !seen.has(byKey(i))){ S.cart.push(i); seen.add(byKey(i)); } });
    const favs = new Set([...(S.favs || []), ...(p.favs || [])].map(Number).filter(Boolean));
    S.favs = [...favs];
    if(typeof rvVotes !== 'undefined' && Array.isArray(p.rvVotes)){
      rvVotes = [...new Set([...(rvVotes || []), ...p.rvVotes])];
      try{ rvSave(); }catch(e){}

    if(!S.defaultPvz && p.defaultPvz) S.defaultPvz = p.defaultPvz;
    if(S.checkout && !S.checkout.pvz && p.pvz) S.checkout.pvz = p.pvz;
    saveUser();
  }catch(e){}
  finally{
    _prefsReady = true;
    pushPrefs();   // отдаём объединённое обратно
  }
}

function shipRates(){
  const d = {pickup:190, freeFrom:15000, pickupDays:'2–5 дней'};
  if(typeof CMS === 'undefined' || !CMS.shipping) return d;
  return Object.assign(d, CMS.shipping);
}
/* Порог бесплатной доставки считаем от суммы со скидкой —
   иначе промокод «дотягивал» заказ до бесплатной доставки бесплатно. */
function shipFreeLeft(){
  const free = +shipRates().freeFrom || 0;
  if(!free) return 0;
  return Math.max(0, free - cartTotal());
}
function shipCost(){
  const r = shipRates();
  if(!S.cart.length) return 0;
  if(isFreeShipPromo(S.promo)) return 0;
  if(!shipFreeLeft() && (+r.freeFrom || 0)) return 0;
  return +r.pickup || 0;
}
function shipModeName(){ return 'Пункт выдачи СДЭК'; }

function orderTotal(){ return cartTotal() + shipCost(); }

/* ==========================================================
   СВЕРКА КОРЗИНЫ С ОСТАТКАМИ
   Корзина живёт в localStorage и может пролежать сутки: товар за это
   время сняли с продажи, размер разобрали, остаток уменьшили. Поэтому
   перед каждым шагом оформления пересчитываем её по складу.
   Настоящая брони́ остатка возможна только на сервере — здесь мы
   защищаемся от заведомо невыполнимого заказа, а не от гонки.
   ========================================================== */
function revalidateCart(){
  const notes = [];
  const keep = [];
  /* сколько штук каждого размера уже разобрали строки выше по списку */
  const takenBySize = new Map();
  S.cart.forEach(i => {
    const p = byId(i.id);
    if(!cartLineBelongs(i, p)) return;
    keep.push(i);
    const was = i.gone || '';
    i.gone = '';
    if(p.on === false){
      i.gone = 'Товар снят с продажи';
      if(was !== i.gone) notes.push(`«${i.name}» больше не продаётся`);
      return;
    }
    if(+p.price && +p.price !== +i.price){
      notes.push(`«${i.name}»: цена изменилась на ${money(p.price)}`);
      i.price = +p.price;
      i.name = p.name;
      i.img = p.img || i.img;
    }
    const left = stockOf(p, i.size);
    if(left <= 0){
      i.gone = `Размер ${i.size} закончился`;
      if(was !== i.gone) notes.push(`«${i.name}», размер ${i.size} закончился`);
      return;
    }
    /* Лимит общий на размер, а строк с этим размером может быть несколько
       (разные цвета). Раздаём остаток по порядку: что не влезло — срезаем,
       иначе заказ уходил на большее количество, чем есть на складе. */
    if(left !== STOCK_ANY){
      const key = i.id + '|' + i.size;
      const used = takenBySize.get(key) || 0;
      const room = Math.max(0, left - used);
      if(i.qty > room){
        notes.push(room > 0
          ? `«${i.name}», размер ${i.size}: осталось ${left} шт. — уменьшили количество`
          : `«${i.name}», размер ${i.size} закончился`);
        i.qty = room;
        if(!room){ i.gone = `Размер ${i.size} закончился`; return; }
      }
      takenBySize.set(key, used + i.qty);
    }
  });
  const dropped = keep.length !== (S.cart || []).length;
  if(dropped) S.cart = keep;
  if(notes.length || dropped){
    revalidatePromo();
    saveUser();
  }
  return notes;
}

  {k:'favs',    t:'Избранное', i:'heart'},

];
/* экран -> какая вкладка подсвечена (товар относится к каталогу и т.д.) */

let _hdKey = '';
function paintHeader(){
  const slot = document.getElementById('hdSlot');
  if(!slot) return;
  const s = SCREENS[S.screen] || SCREENS.catalog;

let tabsReady = false;
function buildTabs(){
  document.getElementById('tabs').innerHTML =
    '<span class="tabs__pill"></span>' +
    TAB_ITEMS.map(x => `<button class="tab notranslate" data-a="go:${x.k}" aria-label="${x.t}" translate="no">
      ${svg(x.i)}<span class="tab__n hide"></span><span translate="no">${x.t}</span>

}
function renderTabs(){
  if(!tabsReady) buildTabs();
  const bar = document.getElementById('tabs');
  const idx = TAB_OF[S.screen] ?? 0;
  bar.style.setProperty('--i', idx);
  bar.querySelectorAll('.tab').forEach((b,i) => {
    i === idx ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current');
  });
  // счётчик корзины
  const n = cartCount();
  const cartBadge = bar.querySelectorAll('.tab')[4].querySelector('.tab__n');
  cartBadge.textContent = n;
  cartBadge.classList.toggle('hide', n === 0);
  const unseen = unseenOrderCount();

  if(profBadge){
    profBadge.textContent = unseen;
    profBadge.classList.toggle('hide', unseen === 0);

}

   ========================================================== */
function listProducts(){
  let list = PRODUCTS.filter(p => p.on && p.gender === S.gender);
  const f = S.filter;
  if(f.cats.length)  list = list.filter(p => f.cats.includes(p.cat));
  if(f.sizes.length) list = list.filter(p => f.sizes.some(s => (p.sizes||[]).includes(s)));
  if(f.min !== '')   list = list.filter(p => p.price >= +f.min);
  if(f.max !== '')   list = list.filter(p => p.price <= +f.max);
  if(S.sort === 'cheap') list.sort((a,b) => a.price - b.price);
  if(S.sort === 'exp')   list.sort((a,b) => b.price - a.price);
  if(S.sort === 'new')   list.sort((a,b) => b.id - a.id);
  /* Рейтинг: товары без отзывов уходят вниз — иначе пустая
     карточка обгоняла бы честные 4,7 просто потому, что 0 = 0. */
  if(S.sort === 'rate')  list.sort((a,b) => {
    const x = rvStats(a.id), y = rvStats(b.id);
    return (y.avg - x.avg) || (y.n - x.n) || (b.id - a.id);
  });
  return list;
}

/* Что написано на кнопке карточки. Одно место — чтобы разметка и
   быстрая перерисовка refreshCardBuys() не разъезжались. */
function cardBuyLabel(on, out){
  if(out) return {ic:'x',     t:'Нет в наличии',  aria:'Нет в наличии'};
  return on ? {ic:'check', t:'В корзине', aria:'Изменить размеры и количество'}
            : {ic:'bag',   t:'В корзину', aria:'Добавить в корзину'};
}
/* i приходит из list.map(cardHTML): первые карточки видны сразу, их обложку
   грузим не откладывая — иначе на Safari верх экрана какое-то время пустой. */
function cardHTML(p, i){
  const on = cardInCart(p);
  const out = soldOut(p);
  /* В карточке каталога хватает первых кадров: за остальными покупатель
     идёт внутрь товара. Иначе сотня товаров по 8 фото — это 800 запросов. */
  const gal = (p.gal && p.gal.length ? p.gal : [p.img]).filter(Boolean).slice(0, 3);
  const badge = out
    ? `<span class="card__badge card__badge--out">Нет в наличии</span>`
    : (p.badge && BADGE_LAB[p.badge]
      ? `<span class="card__badge card__badge--${p.badge}">${BADGE_LAB[p.badge]}</span>` : '');
  /* «−30 %» считаем сами: сравнивать две цены глазами покупатель не должен */
  const off = (!out && p.old && p.old > p.price) ? Math.round((1 - p.price / p.old) * 100) : 0;
  /* размеры показываем только те, что реально есть на складе */
  const sz = (p.sizes || []).filter(x => stockOf(p, x) > 0);
  const lab = cardBuyLabel(on, out);
  return `<article class="card">
    <div class="card__ph${out ? ' card__ph--out' : ''}" data-a="open:${p.id}" role="link" aria-label="${p.name}">
      ${badge || off ? `<span class="card__tags">${badge}${
        off ? `<span class="card__off">−${off}%</span>` : ''}</span>` : ''}
      <div class="card__track">${gal.map((src, gi) => {
        /* сразу грузим только обложки первых карточек; остальные кадры —
           lazy и низким приоритетом, иначе каталог из сотни товаров
           тянет тысячу файлов разом */
        const above = !gi && (+i || 0) < 4;
        return `<div class="card__slide"><img class="card__img" src="${src}" alt="" decoding="async"
          loading="${above ? 'eager' : 'lazy'}" fetchpriority="${above ? 'high' : (gi ? 'low' : 'auto')}"
          draggable="false"></div>`;
      }).join('')}</div>
      ${gal.length > 1 ? `<div class="card__dots">${gal.map((_,i) =>
        `<span class="card__dot${i ? '' : ' on'}"></span>`).join('')}</div>` : ''}
    </div>
    <button class="card__fav" data-a="fav:${p.id}" aria-pressed="${S.favs.includes(p.id)}" aria-label="В избранное">${svg('heart')}</button>
    <div class="card__meta">
    <button class="card__n" data-a="open:${p.id}" style="text-align:left">${p.name}</button>
    ${rvCardHTML(p)}
    ${sz.length ? `<span class="card__sz">${sz.slice(0, 4).map(x => `<i>${x}</i>`).join('')}${
      sz.length > 4 ? `<i class="card__sz-n">+${sz.length - 4}</i>` : ''}</span>` : ''}
    <span class="card__pr"><span>${money(p.price)}</span>${p.old ? `<s>${money(p.old)}</s>` : ''}</span>
    <button class="card__buy${on ? ' is-in' : ''}" data-a="quick:${p.id}"
      ${out ? 'disabled' : ''} aria-label="${lab.aria}">
      <span class="card__buy-ic">${svg(lab.ic,'ic ic--sm')}</span>
      <span class="card__buy-t">${lab.t}</span>
    </button>
    </div>
  </article>`;
}

/* Честная строка про остаток: только когда есть что сказать. */
function stockNote(p){
  if(soldOut(p)) return `<p class="pd__stock pd__stock--out">${GONE_TEXT}</p>`;
  const left = stockOf(p, S.size);
  if(left === STOCK_ANY || left > 5) return '';
  const mine = inCartQty(p, S.size);
  if(mine >= left) return `<p class="pd__stock pd__stock--out">Весь остаток уже у вас в корзине</p>`;
  return `<p class="pd__stock">Осталось ${left} шт · размер ${S.size}</p>`;
}

/* Строка «Количество» на карточке товара. Считается от остатка: больше,
   чем лежит на складе (с учётом уже набранного в корзину), взять нельзя. */
function qtyRowHTML(p){
  const max = clampQty(p, S.size);
  const q = S.qty;
  return `<span class="pd__qty-l">Количество</span>
    <span class="qty qty--lg">
      <button data-a="pq:-1" aria-label="Меньше" ${q <= 1 ? 'disabled' : ''}>−</button>
      <span id="pdQtyN">${q}</span>
      <button data-a="pq:1" aria-label="Больше" ${q >= max ? 'disabled' : ''}>+</button>
    </span>
    ${max <= 1 ? `<span class="pd__qty-n">${max ? 'Остался 1 шт' : 'Больше нет'}</span>` : ''}`;
}
function paintQty(){
  const p = byId(S.productId);
  const box = document.getElementById('pdQty');
  if(!p || !box) return;
  /* позиция уже в корзине — количество меняют там, здесь выбирать нечего */
  const hide = soldOut(p) || inCart(p);
  box.hidden = hide;
  if(!hide) box.innerHTML = qtyRowHTML(p);
}

function scrProduct(){
  const p = byId(S.productId);
  if(!p) return '<p class="none">Товар не найден</p>';
  const gal = p.gal && p.gal.length ? p.gal : [p.img];
  const fav = S.favs.includes(p.id);

     размер исчезает из выбора и вернётся, когда склад пополнят. */
  const sizes = SIZES.filter(s => (p.sizes || []).includes(s) && stockOf(p, s) > 0);
  if(sizes.length && !sizes.includes(S.size)) S.size = sizes[0];

  const colors = Array.isArray(p.colors) ? p.colors.filter(c => c && c.hex) : [];
  if(colors.length && !colors.some(c => c.hex === S.color)) S.color = colors[0].hex;
  if(!colors.length) S.color = '';
  const cur = colors.find(c => c.hex === S.color) || null;
  const out = soldOut(p) || (!sizes.length && (p.sizes || []).length > 0);
  return `
  <div class="pd">
    <div class="pd__hero">
      <div class="pd__track" id="pdTrack">
        ${gal.map((g,i) => `
        <div class="pd__slide">
          <button type="button" class="pd__zoom" data-a="zoom:${i}" aria-label="Открыть фото">
            <img class="pd__main" src="${g}" alt="${p.name}" draggable="false"

          </button>

      </div>
      <div class="pd__side">
        <button class="pd__rb" data-a="fav:${p.id}" aria-pressed="${fav}" aria-label="В избранное">${svg('heart')}</button>
        <button class="pd__rb" data-a="share" aria-label="Поделиться">${svg('share')}</button>
      </div>
    </div>

    ${gal.length > 1 ? `<div class="thumbs">${gal.map((g,i) => `
      <button class="thumb" data-a="gal:${i}" aria-current="${i === S.galIdx}" aria-label="Фото ${i+1}">
        <img src="${g}" alt="" loading="lazy" decoding="async"></button>`).join('')}</div>` : ''}

    <div class="pd__body">
      <h1 class="pd__t">${p.name}</h1>
      ${p.sku ? `<button class="pd__sku" data-a="copysku:${p.sku}">
        Артикул: <b>${p.sku}</b>${svg('copy','ic ic--xs')}</button>` : ''}
      <p class="pd__price">${money(p.price)}${p.old ? ` <s>${money(p.old)}</s>` : ''}</p>
      ${rvInlineHTML(p)}

      ${colors.length ? `<p class="pd__lab">Цвет${cur ? ` · <b>${esc(cur.name)}</b>` : ''}</p>
      <div class="cols">${colors.map(c => `<button class="col" data-a="color:${encodeURIComponent(c.hex)}"
          aria-pressed="${S.color === c.hex}" aria-label="${esc(c.name)}" title="${esc(c.name)}">

      ${sizes.length ? `<p class="pd__lab">Размер</p>
      <div class="sizes">${sizes.map(s => `<button class="size" data-a="size:${s}"
          aria-pressed="${S.size === s}">${s}</button>`).join('')}</div>` : ''}

      </div>
    </div>
  </div>

    <h2 class="pd__el">Описание</h2>
    <p class="pd__ed">${p.desc}</p>
  </div>` : ''}

  ${(CMS.sizeChart) ? `<div class="pd__extra pd__chart">
    <h2 class="pd__el">Таблица размеров</h2>

  ${rvBlockHTML(p)}`;

/**

 * Уже набранные размеры показаны с количеством, нажатие добавляет ещё одну.

function cartSizesHTML(line){
  const p = byId(line.id);

  if(sizes.length < 2) return '';

    <span class="ci__sizes-l">Размеры этого товара</span>

      const cur = s === line.size;
      return `<button class="ci__sz${n ? ' is-in' : ''}${cur ? ' is-cur' : ''}"
        data-a="addsz:${p.id}:${encodeURIComponent(s)}"
        aria-label="Добавить размер ${esc(s)}${n ? `, сейчас в корзине ${n}` : ''}"
        >${esc(s)}${n ? `<i>${n}</i>` : ''}</button>`;
    }).join('')}</div>
  </div>`;
}

function plural(n, forms){           // 1 товар / 2 товара / 5 товаров
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return forms[2];
  if(b > 1 && b < 5)   return forms[1];
  if(b === 1)          return forms[0];
  return forms[2];
}

/* --- индикатор шагов: корзина → получение → оплата → готово --- */
const STEP_NAMES = ['Корзина','Оформление','Оплата','Готово'];
function stepBar(active){
  const n = STEP_NAMES.length;
  return `<div class="sbar" aria-label="Оформление заказа: шаг ${Math.min(active + 1, n)} из ${n}">
    ${STEP_NAMES.map((t, i) => {
      const st = i < active ? ' is-done' : i === active ? ' is-now' : '';
      const line = i < n - 1 ? `<span class="sbar__line${i < active ? ' on' : ''}"></span>` : '';
      return `<div class="sbar__s${st}">
        <span class="sbar__c">${i < active ? svg('check','ic') : `<i>${i + 1}</i>`}</span>
        <span class="sbar__t">${t}</span>
      </div>${line}`;
    }).join('')}
  </div>`;
}

/* ==========================================================
   СТАТУС ЗАКАЗА: ОДИН СПИСОК ТОНОВ НА ВСЁ ПРИЛОЖЕНИЕ
   Отсюда красятся и плашка у покупателя (.ord__st, .sbadge), и бейдж
   в админке (.ad__badge). Раньше цвета задавались в двух местах и
   разъезжались: «Доставлен» был зелёным у владельца и серым у клиента.
   ========================================================== */
const STATUS_TONE = {
  'В обработке':'warn', 'Едет':'ship', 'Доставка':'ship',
  'Доставлен':'ok', 'Отменён':'danger', 'Возврат':'danger'
};
const STATUS_ICON = {warn:'refresh', ship:'truck', ok:'check', danger:'x', muted:'box'};
const statusTone = st => STATUS_TONE[st] || 'muted';
/* Срок возврата для дистанционной торговли */
const RETURN_DAYS = 14;
const todayStamp = () => {
  const n = new Date();
  return String(n.getDate()).padStart(2,'0') + '.' +
         String(n.getMonth()+1).padStart(2,'0') + '.' + n.getFullYear();
};
/* Товар по строке заказа. У заказов, оформленных раньше, id не сохранялся —
   для них ищем по названию, иначе остаток не вернуть. */
function orderLineProduct(i){
  return (i.id != null ? byId(i.id) : null) || PRODUCTS.find(p => p.name === i.name) || null;
}
/* Отмена возвращает вещи в продажу */
function returnStock(o){
  (o.items || []).forEach(i => {
    const p = orderLineProduct(i);
    if(p && p.stock && p.stock[i.size] != null){
      p.stock[i.size] = Math.max(0, (+p.stock[i.size] || 0) + i.qty);
    }
  });
  persist();
}
/* ...и освобождает использование промокода */
function releasePromo(o){
  if(!o.promoCode || typeof CMS === 'undefined') return;
  const pr = (CMS.promos || []).find(x => String(x.code).toUpperCase() === String(o.promoCode).toUpperCase());
  if(pr && pr.used){ pr.used = Math.max(0, pr.used - 1); saveCms(); }
}
function orderDaysPassed(o){
  const d = parseOrderDate(o);
  return d ? Math.floor((Date.now() - d.getTime()) / 864e5) : 0;
}

function isAwaitingPay(o){
  return !!(o && (o.status === 'Ожидает оплаты' || o.payStatus === 'pending') && o.payStatus !== 'paid' && o.payStatus !== 'manual');
}
function payUntilMs(o){
  const n = +((o && o.payUntil) || 0);
  if(Number.isFinite(n) && n > 0) return n;
  const created = o && o.createdAt ? Date.parse(o.createdAt) : NaN;
  if(Number.isFinite(created) && created > 0) return created + 3600000;
  return 0;
}
function payLeftMs(o){
  const until = payUntilMs(o);
  if(!until) return 0;
  return Math.max(0, until - Date.now());
}
function payTimerHTML(o){
  if(!isAwaitingPay(o)) return '';
  const until = payUntilMs(o);
  if(!until) return '';
  const left = Math.max(0, until - Date.now());
  return `<span class="pay-timer" data-payuntil="${until}">${formatMmSs(Math.ceil(left / 1000))}</span>`;
}
function orderAlertKey(o){
  return [o.status || '', o.payStatus || '', o.track || o.tracking || ''].join('|');
}
function orderUnseen(o){
  if(!o || !o.num) return false;
  if(o.status === 'Отменён') return false;
  return (S.orderSeen || {})[o.num] !== orderAlertKey(o);
}
function unseenOrderCount(){
  return (ORDERS || []).filter(orderUnseen).length;
}
function markOrderSeen(num){
  const o = ORDERS.find(x => String(x.num) === String(num));
  if(!o) return;
  if(!S.orderSeen) S.orderSeen = {};
  S.orderSeen[o.num] = orderAlertKey(o);
  S.orderSeenInit = true;
  saveUser();
}
function seedOrderSeen(){
  if(S.orderSeenInit) return;
  if(!S.orderSeen) S.orderSeen = {};
  (ORDERS || []).forEach(o => {
    if(!o || !o.num || S.orderSeen[o.num] != null) return;
    if(isAwaitingPay(o)) return;
    S.orderSeen[o.num] = orderAlertKey(o);
  });
  S.orderSeenInit = true;
  saveUser();
}

let payTickTimer = null;
let expireBusy = false;
function stopPayTimers(){
  if(payTickTimer){ clearInterval(payTickTimer); clearTimeout(payTickTimer); payTickTimer = null; }
}
function startPayTimers(){
  stopPayTimers();
  const nodes = document.querySelectorAll('[data-payuntil]');
  if(!nodes.length && !ORDERS.some(isAwaitingPay)) return;
  const tick = () => {
    let expired = false;
    document.querySelectorAll('[data-payuntil]').forEach(el => {
      const left = Math.max(0, +el.dataset.payuntil - Date.now());
      el.textContent = formatMmSs(Math.ceil(left / 1000));
      if(left <= 0) expired = true;
    });
    if(expired) expireLocalUnpaid();
  };
  tick();
  if(!expireBusy) payTickTimer = setInterval(tick, 1000);
}
function dropExpiredCart(o){
  (o.items || []).forEach(it => {
    S.cart = (S.cart || []).filter(c => !(c.id === it.id && String(c.size) === String(it.size)));
  });
}
async function expireLocalUnpaid(){
  const candidates = ORDERS.filter(o => isAwaitingPay(o) && payUntilMs(o) && payLeftMs(o) <= 0);
  if(!candidates.length || expireBusy) return;
  expireBusy = true;
  stopPayTimers();
  try{
    if(window.LC){
      try{
        const o0 = candidates[0];
        await LC.getOrder(o0.num, false, (LC.orderToken && LC.orderToken(o0.num)) || '');
      }catch(_){}
    }
    if(S.user) await refreshMyOrders(false);
    const live = new Set(ORDERS.map(o => String(o.num)));
    const gone = S.user
      ? candidates.filter(o => !live.has(String(o.num)))
      : candidates;
    if(!gone.length){
      document.querySelectorAll('[data-payuntil]').forEach(el => { el.textContent = '0:00'; });
      payTickTimer = setTimeout(() => { payTickTimer = null; expireBusy = false; expireLocalUnpaid(); }, 20000);
      return;
    }
    gone.forEach(o => {
      dropExpiredCart(o);
      if(!S.user){
        const i = ORDERS.findIndex(x => x.num === o.num);
        if(i >= 0) ORDERS.splice(i, 1);
      }
      if(S.lastOrder && S.lastOrder.num === o.num) S.lastOrder = null;
    });
    saveUser();
    closeOv();
    toast('Время на оплату вышло · вещи снова в каталоге');
    render(true);
    refreshCatalogQuiet();
  } finally {
    expireBusy = false;
  }
}
function liveProductsFp(list){
  return (list || []).map(p => [
    p.id, p.on === false ? 0 : 1, p.price, p.old || 0, p.sku || '',
    p.img || '', (p.gal || []).length,
    p.stock ? Object.keys(p.stock).sort().map(k => k + ':' + p.stock[k]).join(',') : ''
  ].join('~')).join('|');
}
function liveReviewsFp(list){
  return (list || []).map(r => [
    r.id, r.pid, r.status, r.useful || 0, r.rating,
    (r.reply && r.reply.text) || '', (r.photos || []).length, r.mine ? 1 : 0
  ].join('~')).join('|');
}
function applyLiveProducts(list){
  if(!Array.isArray(list)) return false;
  if(liveProductsFp(list) === liveProductsFp(PRODUCTS)) return false;
  PRODUCTS = list;
  persist();
  pruneStaleClientData();
  if(S.cart && S.cart.length) revalidateCart();
  return true;
}
function applyLiveReviews(list){
  if(!Array.isArray(list)) return false;
  if(liveReviewsFp(list) === liveReviewsFp(REVIEWS)) return false;
  REVIEWS = list;
  rvMine = REVIEWS.filter(r => r.mine).map(r => r.id);
  rvVotes = REVIEWS.filter(r => r.voted).map(r => r.id);
  rvSave();
  return true;
}
function liveUiBusy(){
  if(document.hidden) return true;
  if(adm.querySelector('.ad')) return true;
  const tag = document.activeElement && document.activeElement.tagName;
  if(tag && ['INPUT','TEXTAREA','SELECT'].includes(tag)) return true;
  if(ov.innerHTML && !ov.querySelector('.modal[aria-label="Заказ"]')) return true;
  if(['auth','pdata','tryon'].includes(S.screen)) return true;
  return false;
}
let livePaintQueued = false;
function requestLivePaint(){
  if(liveUiBusy()){ livePaintQueued = true; return; }
  livePaintQueued = false;
  render(true);
  if(ov.querySelector('.modal[aria-label="Заказ"]')){
    const title = ov.querySelector('.modal[aria-label="Заказ"] .modal__t');

}
async function refreshCatalogQuiet(){

}

function orderModal(num){
  const o = ORDERS.find(x => x.num === num);
  const stepRows = displayOrderSteps(o);
  const steps = stepRows.map((s,i) => {
    const cls = i < o.now ? 'step__i--done' : i === o.now ? 'step__i--now' : 'step__i--off';
    const ic = ['card','cal','refresh','truck','check'][i];
    return `<div class="step__i ${cls}"><span class="step__c">${svg(ic,'ic ic--sm')}</span>
      <span class="step__l">${s[0]}</span>${s[1] ? `<span class="step__d">${s[1]}</span>` : ''}</div>`;
  }).join('<span class="step__ln"></span>');

  const tone = statusTone(o.status);
  const ship = +o.ship || 0;
  const refund = Math.max(0, (+o.goods || o.price) - (+o.discount || 0));
  const shipping = o.status === 'Едет' || o.status === 'Доставка' || Number(o.now) >= 3;
  const canCancel = (o.status === 'В обработке' || o.status === 'Ожидает оплаты') && !shipping;
  const canPay = (o.payStatus === 'pending' || o.status === 'Ожидает оплаты') && o.payStatus !== 'paid' && o.payStatus !== 'manual';
  const left = RETURN_DAYS - orderDaysPassed(o);
  const canReturn = o.status === 'Доставлен' && left > 0;
  const canReorder = !canPay && ['Доставлен','Отменён','Возврат','Едет','В обработке'].includes(o.status);
  const paid = o.payStatus === 'paid';
  const waitingPay = isAwaitingPay(o);
  const payLeft = waitingPay ? payTimerHTML(o) : '';

  return `<div class="scrim"></div><div class="modal" role="dialog" aria-label="Заказ">
    <div class="modal__h"><h2 class="modal__t">Заказ №${o.num}</h2>
      <button class="hd__b" data-x aria-label="Закрыть">${svg('x')}</button></div>
    <div class="step">${steps}</div>
    <div style="margin-top:18px">
      ${o.items.map(i => `<div class="dl"><span class="dl__k">${i.name}, ${i.size}${i.qty > 1 ? ` × ${i.qty}` : ''}
        ${o.status === 'Доставлен' && byId(i.id) && !rvHasMine(i.id) ? `<button class="rvi__edit" style="margin-left:8px" data-a="rvnew:${i.id}">Оставить отзыв</button>` : ''}</span>
        <span class="dl__v">${money(i.price * i.qty)}</span></div>`).join('')}
      ${o.promoCode ? `<div class="dl"><span class="dl__k">Промокод ${esc(o.promoCode)}</span>
        <span class="dl__v" style="color:var(--ok)">${o.discount ? '−' + money(o.discount) : 'доставка 0 ₽'}</span></div>` : ''}
      <div class="dl"><span class="dl__k">Доставка${o.shipMode ? ' · ' + shipModeName(o.shipMode).toLowerCase() : ''}</span>
        <span class="dl__v">${ship ? money(ship) : 'Бесплатно'}</span></div>
      <div class="dl"><span class="dl__k">Оформлен</span><span class="dl__v">${o.date}</span></div>
      <div class="dl"><span class="dl__k">Статус</span>
        <span class="dl__v"><span class="sbadge sbadge--${tone}">${esc(o.status)}</span></span></div>
      ${o.addr ? `<div class="dl"><span class="dl__k">Пункт выдачи</span>
        <span class="dl__v">${esc(o.addr)}</span></div>` : ''}
      ${o.track ? `<div class="dl"><span class="dl__k">Трек-номер</span><span class="dl__v">${esc(o.track)}</span></div>` : ''}
      <div class="dl"><span class="dl__k">Итого</span><span class="dl__v" style="font-weight:700">${money(o.price)}</span></div>
    </div>
    ${waitingPay ? `<div class="pay-wait">
      <div class="pay-wait__row">
        <span class="pay-wait__lab">Осталось на оплату</span>
        ${payLeft}
      </div>
      <p class="pay-wait__h">Час с оформления. Если не успеете — заказ отменится, вещи вернутся в каталог.</p>
      <div class="ord__acts">
        <button class="btn" data-a="ordpay:${o.num}">${svg('lock','ic ic--sm')} Оплатить</button>
        ${canCancel ? `<button class="ord__cancel" data-a="ordcancel:${o.num}">Отменить заказ</button>` : ''}
      </div>
    </div>` : ''}
    ${!waitingPay && (canReorder || canCancel || canReturn) ? `<div class="ord__acts">
      ${canReorder ? `<button class="ghb" data-a="reorder:${o.num}">${svg('refresh','ic ic--sm')} Повторить заказ</button>` : ''}
      ${canCancel ? `<button class="ghb ghb--d" data-a="ordcancel:${o.num}">${svg('x','ic ic--sm')} Отменить заказ</button>` : ''}
      ${canReturn ? `<button class="ghb" data-a="ordreturn:${o.num}">${svg('refresh','ic ic--sm')} Оформить возврат</button>` : ''}
    </div>` : ''}
    ${!waitingPay && canCancel ? `<p class="ord__hint">Пока заказ не уехал, его можно отменить.${paid ? ' Вернём деньги в течение дня.' : ''}</p>` : ''}
    ${canReturn ? `<p class="ord__hint">На возврат осталось ${left} ${plural(left,['день','дня','дней'])}.
      Вернём ${money(refund)} после проверки вещи.</p>` : ''}
    ${o.status === 'Возврат' ? `<p class="ord__hint">Заявка на возврат принята${o.returnAt ? ' ' + o.returnAt : ''} —
      свяжемся с вами и подтвердим сумму.</p>` : ''}
    ${o.status === 'Отменён' ? `<p class="ord__hint">Заказ отменён${o.cancelledAt ? ' ' + o.cancelledAt : ''}.
      ${paid ? 'Вернём ваши деньги в течение дня на ту же карту.' : 'Если оплата уже прошла, вернём деньги в течение дня.'}</p>` : ''}
    ${o.status === 'Доставлен' && !canReturn ? `<p class="ord__hint">Срок возврата (${RETURN_DAYS} дней) истёк.
      Если с вещью что-то не так — напишите нам, разберёмся.</p>` : ''}
  </div>`;
}

function displayUserPhone(u){

}
function displayUserTitle(u){
  if(!u) return '';
  const parts = [u.last, u.name, u.middle].map(s => String(s || '').trim()).filter(Boolean);
  if(parts.length) return parts.join(' ');
  return 'Заполните профиль';
}
function displayUserSub(u){
  if(!u) return '';
  const phone = displayUserPhone(u);
  if(phone) return phone;
  if(u.email) return u.email;
  return 'ФИО и email';
}
function profileNeedsFill(u){
  if(!u) return false;
  if(u.admin) return false;
  const name = String(u.name || '').trim();
  const last = String(u.last || '').trim();
  const email = String(u.email || '').trim();
  return !name || !last || !email || !email.includes('@') || !email.includes('.');
}
function profileMissingHint(u){
  if(!u) return 'Укажите ФИО и email';
  const nameOk = !!(String(u.name || '').trim() && String(u.last || '').trim());
  const emailOk = !!(String(u.email || '').trim().includes('@') && String(u.email || '').includes('.'));
  if(!nameOk && emailOk) return 'Укажите ФИО';
  if(nameOk && !emailOk) return 'Укажите email';
  return 'Укажите ФИО и email';
}
/** После любого нового входа без ФИО — сразу анкета, потом nextScreen. */
function continueAfterAuth(opts){
  const next = (opts && opts.next) || S.afterAuth || 'profile';
  S.afterAuth = null;
  /* email из чекаута — только префилл формы, не «второй» ввод с нуля */
  if(S.user && !S.user.email && S.checkout && S.checkout.guest && S.checkout.guest.email){
    S.user.email = String(S.checkout.guest.email || '').trim();
  }
  if(profileNeedsFill(S.user)){
    S.afterProfile = next;
    toast((opts && opts.isNew) ? ('Аккаунт создан · ' + profileMissingHint(S.user).toLowerCase()) : profileMissingHint(S.user));
    go('pdata');
    return;
  }
  toast('Вы вошли');
  go(next);
  rvHydrateFromServer().then(() => render(true)).catch(() => {});
  /* спросить про TG только один раз после первой регистрации */
  if(opts && opts.askTg) setTimeout(() => maybeAskTgNotif(true), 400);
}

async function authSubmit(){
  if(!window.LC) return toast('API недоступен');
  const val = id => String((document.getElementById(id) || {}).value || '').trim();
  const v = authMod.view;
  const btn = ov.querySelector('.amod__b');
  if(btn) btn.disabled = true;
  try{
    if(v === 'log' || v === 'reg'){
      const email = val('amEmail');
      const password = String((document.getElementById('amPass') || {}).value || '');
      if(!email.includes('@')) return toast('Укажите эл. почту');
      if(password.length < 6) return toast('Пароль минимум 6 символов');
      if(v === 'reg' && password !== String((document.getElementById('amPass2') || {}).value || '')){
        return toast('Пароли не совпадают');
      }
      const user = v === 'reg'
        ? await LC.register({ email, password, name: '' })
        : await LC.login({ email, password });
      authDone(user, v === 'reg');
      return;
    }
    if(v === 'forgot'){
      const email = val('amEmail');
      if(!email.includes('@')) return toast('Укажите эл. почту');
      const out = await LC.api('/api/auth/forgot', { method:'POST', body:{ email } });
      authMod.email = email;
      authMod.via = (out && out.via) || [];
      authMod.link = !!(out && out.link);
      authModal('reset');
      toast(authMod.via.includes('email') ? 'Письмо отправлено · проверьте и папку «Спам»' : 'Код отправлен');
      return;
    }
    if(v === 'newpass'){
      const password = String((document.getElementById('amPass') || {}).value || '');
      if(password.length < 6) return toast('Пароль минимум 6 символов');
      if(password !== String((document.getElementById('amPass2') || {}).value || '')){
        return toast('Пароли не совпадают');
      }
      const d = await LC.api('/api/auth/reset', {
        method:'POST', body:{ ticket: authMod.ticket, password }
      });
      if(d && d.token) LC.setToken(d.token);
      toast('Пароль изменён');
      authDone(d && d.user, false);
      return;
    }
    if(v === 'reset'){
      const code = val('amCode');
      const password = String((document.getElementById('amPass') || {}).value || '');
      if(code.length < 4) return toast('Введите код');
      if(password.length < 6) return toast('Пароль минимум 6 символов');
      const d = await LC.api('/api/auth/reset', {
        method:'POST', body:{ email: authMod.email, code, password }
      });
      if(d && d.token) LC.setToken(d.token);
      toast('Пароль изменён');
      authDone(d && d.user, false);
    }
  }catch(err){
    toast((err && err.message) || 'Не получилось');
  }finally{
    const b = ov.querySelector('.amod__b');
    if(b) b.disabled = false;
  }
}

/* Свайп + точки + автопрокрутка. Таймер сам гаснет, когда узел исчезает из DOM. */
function bindSlider(box){
  if(!box || box.dataset.bound === '1') return;
  box.dataset.bound = '1';
  const track = box.querySelector('.hs__track');
  if(!track) return;
  const dots = [...box.querySelectorAll('.hs__dot')];
  const n = track.children.length;
  if(n < 1) return;
  let idx = 0, touched = 0;

  const paint = () => {
    const w = track.clientWidth || 1;
    const i = Math.max(0, Math.min(n - 1, Math.round(track.scrollLeft / w)));
    idx = i;
    dots.forEach((d,k) => d.classList.toggle('on', k === i));
  };
  const go = i => {
    idx = (i + n) % n;
    track.scrollTo({left: idx * track.clientWidth, behavior:'smooth'});
  };

  let raf = 0;
  track.addEventListener('scroll', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(paint);
  }, {passive:true});
  ['pointerdown','touchstart','wheel'].forEach(ev =>
    track.addEventListener(ev, () => { touched = Date.now(); }, {passive:true}));
  dots.forEach(d => d.onclick = () => { touched = Date.now(); go(+d.dataset.hs); });
  box.querySelectorAll('[data-hsar]').forEach(b => b.onclick = () => {
    touched = Date.now();
    go(idx + (+b.dataset.hsar || 1));
  });

  if(n > 1){
    const t = setInterval(() => {
      if(!document.body.contains(box)){ clearInterval(t); return; }
      if(document.hidden || Date.now() - touched < 7000) return;
      go(idx + 1);
    }, 4500);
  }
  paint();
}
const bindSliders = () => document.querySelectorAll('.hs').forEach(bindSlider);

function bindGalleryTrack(track, { dotsSel, onIndex } = {}){
  if(!track || track.dataset.bound === '1') return;
  track.dataset.bound = '1';
  const host = track.closest('.card__ph, .pd__hero') || track.parentElement;
  const dots = dotsSel ? [...(host ? host.querySelectorAll(dotsSel) : [])] : [];
  let moved = false, x0 = 0, y0 = 0, holding = false;
  const idxOf = () => {
    const w = track.clientWidth || 1;
    return Math.max(0, Math.min(track.children.length - 1, Math.round(track.scrollLeft / w)));
  };
  const paint = () => {
    const i = idxOf();
    dots.forEach((d, k) => d.classList.toggle('on', k === i));
    if(onIndex) onIndex(i);
  };
  let raf = 0;
  track.addEventListener('scroll', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(paint);
  }, {passive:true});
  const down = e => {
    const p = e.touches ? e.touches[0] : e;
    x0 = p.clientX; y0 = p.clientY; moved = false; holding = true;
  };
  const move = e => {
    if(!holding) return;
    const p = e.touches ? e.touches[0] : e;
    if(Math.abs(p.clientX - x0) > 8 || Math.abs(p.clientY - y0) > 8) moved = true;
  };
  const up = () => { holding = false; };
  track.addEventListener('touchstart', down, {passive:true});
  track.addEventListener('touchmove', move, {passive:true});
  track.addEventListener('touchend', up, {passive:true});
  track.addEventListener('pointerdown', down);
  track.addEventListener('pointermove', move);
  track.addEventListener('pointerup', up);
  track.addEventListener('pointercancel', up);
  track.addEventListener('click', e => {
    if(!moved) return;
    e.preventDefault();
    e.stopPropagation();
  }, true);
  paint();
}

function bindGalleries(){
  document.querySelectorAll('.card__track').forEach(t => bindGalleryTrack(t, { dotsSel: '.card__dot' }));
  const pd = document.getElementById('pdTrack');
  if(pd){

        S.galIdx = i;

    const w = pd.clientWidth || 1;
    pd.scrollLeft = (S.galIdx || 0) * w;
  }
}

  if(fromHealth) return fromHealth;
  const u = (typeof cmsContact === 'function' ? cmsContact('telegram') : '') || LINKS.telegram || TELEGRAM_BOT_URL || '';

  if(m) return m[1];
  const at = /^@?([A-Za-z0-9_]{5,})$/.exec(String(u).trim());

}

         <span class="vpn__d">В России Telegram без него обычно не открывается.</span>`}

function launchTelegramApp(url){
  if(!url) return false;
  try{
    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    return true;
  }catch(_){
    try{ location.href = url; return true; }catch(e){ return false; }
  }
}

function openTelegram(startPayload, opts){
  if(!telegramReady()){
    toast('Ссылка на Telegram появится позже');
    return;
  }
  opts = opts || {};
  let payload;
  if(startPayload === undefined){
    payload = (S.user && S.user.id) ? ('u' + S.user.id) : '';
  } else {
    payload = String(startPayload || '');
  }
  if(opts.skipStartIfLinked && (S.tgLinked || tgBotAlreadyOpened())) payload = '';
  const app = telegramAppLink(payload);
  try{
    if(S.user && S.user.id) sessionStorage.setItem('lc_tg_clicked_' + S.user.id, '1');
  }catch(e){}
  try{ localStorage.setItem('lc_tg_opened', '1'); }catch(e){}
  try{ closeOv(); }catch(e){}
  S._tgOpenPayload = payload;
  launchTelegramApp(app);
  setTimeout(() => {
    if(document.hidden || document.visibilityState === 'hidden') return;
    sheetTelegramHelp(payload);
  }, 1100);
}
function tgBotAlreadyOpened(){
  try{ return localStorage.getItem('lc_tg_opened') === '1'; }catch(_){ return false; }
}

function refreshTgLinkedSilent(){
  if(!S.user || !window.LC) return;
  tgLinkedStatus().then(st => {
    const next = !!st.linked;
    if(next === !!S.tgLinked) return;
    S.tgLinked = next;
    if(S.screen === 'notif' || S.screen === 'profile') render(true);
  }).catch(() => {});
}

async function copyText(text){
  const t = String(text || '');
  if(!t) return false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(t);
      return true;
    }
  }catch(_){}
  try{
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  }catch(_){ return false; }
}

async function tgLinkedStatus(){
  if(!S.user || !window.LC) return { linked: false };

    const d = await LC.api('/api/auth/telegram');

  }catch(e){ return { linked: false }; }
}

async function maybeAskTgNotif(force){
  if(!S.user || !S.user.id) return;
  if(S.user.admin || isAdmin()) return;
  if(!telegramReady()) return;
  const uid = S.user.id;
  try{
    /* «Позже» или уже спрашивали раньше — больше не достаём */
    if(localStorage.getItem('lc_tg_skip_' + uid) === '1') return;
    if(!force && localStorage.getItem('lc_tg_asked_' + uid) === '1') return;
  }catch(e){}
  let linked = false;
  try{
    const st = await tgLinkedStatus();
    linked = !!(st && st.linked);
  }catch(_){ return; }
  if(linked){
    S.tgLinked = true;
    try{ localStorage.setItem('lc_tg_asked_' + uid, '1'); }catch(e){}
    return;
  }
  try{ localStorage.setItem('lc_tg_asked_' + uid, '1'); }catch(e){}
  sheetTgNotif();
}

function aboutBlocks(){
  const list = (CMS.about && Array.isArray(CMS.about.blocks)) ? CMS.about.blocks : [];
  return list.filter(b => b && (
    (b.type === 'text'  && (String(b.title || '').trim() || String(b.body || '').trim())) ||
    (b.type === 'photos' && (b.imgs || []).filter(Boolean).length)
  ));
}

function aboutBlocksHTML(){
  const list = aboutBlocks();
  if(!list.length) return '';
  return list.map(b => {
    if(b.type === 'photos'){
      const imgs = (b.imgs || []).filter(Boolean);
      /* один кадр — во всю ширину, несколько — лента с прокруткой вбок */
      const one = imgs.length === 1;
      return `<div class="abt abt--ph">
        <div class="abt__row${one ? ' abt__row--one' : ''}">${imgs.map((src, i) => `
          <button type="button" class="abt__ph" data-a="abtzoom:${b.id}:${i}" aria-label="Открыть фото ${i + 1}">
            <img src="${esc(src)}" alt="${esc(b.caption || '')}" loading="lazy" decoding="async">
          </button>`).join('')}</div>
        ${b.caption ? `<p class="abt__cap">${esc(b.caption)}</p>` : ''}
      </div>`;
    }
    const paras = String(b.body || '').split(/\n+/).map(x => x.trim()).filter(Boolean);
    return `<div class="abt abt--tx">
      ${b.title ? `<h2 class="abt__t">${esc(b.title)}</h2>` : ''}
      ${paras.map((x, i) => `<p class="${i || b.title ? 'info__p' : 'info__lead'}">${esc(x)}</p>`).join('')}
    </div>`;
  }).join('');
}

function footerMotionOk(){
  return !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function bindFooterCols(){
  const cols = document.querySelectorAll('.ft__col');
  if(window.matchMedia('(min-width:760px)').matches){
    cols.forEach(d => { d.open = true; });
    return;
  }
  cols.forEach(col => {
    const sum = col.querySelector(':scope > .ft__sum');
    const box = col.querySelector(':scope > .ft__links');
    if(!sum || !box) return;
    sum.addEventListener('click', e => {
      e.preventDefault();
      if(col.classList.contains('ft__col--busy')) return;
      toggleFooterCol(col, box, !col.open);
    });
  });
}
function toggleFooterCol(col, box, open){
  if(!footerMotionOk()){
    col.open = open;
    return;
  }
  const finish = () => {
    box.style.height = '';
    box.style.opacity = '';
    box.style.transition = '';
    col.classList.remove('ft__col--busy');
  };
  col.classList.add('ft__col--busy');
  if(open){
    box.style.height = '0px';
    box.style.opacity = '0';
    col.open = true;
    const to = box.scrollHeight;
    requestAnimationFrame(() => {
      box.style.transition = 'height .4s cubic-bezier(.22,1,.36,1), opacity .28s ease';
      box.style.height = to + 'px';
      box.style.opacity = '1';
    });
    const end = ev => {
      if(ev.propertyName && ev.propertyName !== 'height') return;
      box.removeEventListener('transitionend', end);
      finish();
    };
    box.addEventListener('transitionend', end);
  } else {
    box.style.height = box.scrollHeight + 'px';
    box.style.opacity = '1';
    requestAnimationFrame(() => {
      box.style.transition = 'height .34s cubic-bezier(.4,0,.2,1), opacity .22s ease';
      box.style.height = '0px';
      box.style.opacity = '0';
    });
    const end = ev => {
      if(ev.propertyName && ev.propertyName !== 'height') return;
      box.removeEventListener('transitionend', end);
      col.open = false;
      finish();
    };
    box.addEventListener('transitionend', end);
  }
}

function loadImg(src){
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error('Не удалось открыть изображение'));
    const u = String(src || '');
    if(u && !u.startsWith('data:') && !u.startsWith('blob:')) im.crossOrigin = 'anonymous';
    im.src = src;
  });
}
function readFileAsDataURL(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function compressDataUrl(dataUrl, maxSide, quality){
  const im = await loadImg(dataUrl);
  let w = im.naturalWidth || 1, h = im.naturalHeight || 1;
  const side = Math.max(800, +maxSide || 1800);
  const m = Math.max(w, h);
  if(m > side){
    const k = side / m;
    w = Math.max(1, Math.round(w * k));
    h = Math.max(1, Math.round(h * k));
  }
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(im, 0, 0, w, h);
  const q = Math.min(0.95, Math.max(0.7, quality == null ? 0.92 : +quality));
  try{
    const webp = await canvasToBlob(c, 'image/webp', q);
    if(webp && webp.size > 0) return blobToDataURL(webp);
  }catch(e){}
  return c.toDataURL('image/jpeg', q);
}
function canvasToBlob(c, type, q){
  return new Promise(resolve => {
    if(!c.toBlob){ resolve(null); return; }
    try{ c.toBlob(b => resolve(b && b.size ? b : null), type, q); }
    catch(e){ resolve(null); }
  });
}
function blobToDataURL(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

/* ==========================================================
   ФОТО: БЫСТРОЕ ЧТЕНИЕ ФАЙЛА
   Раньше каждый снимок проходил через base64 дважды: сначала FileReader
   разворачивал оригинал в строку (фото на 5 МБ — это ~6,7 МБ текста),
   потом из этой строки заново собиралась картинка. На телефоне вкладка
   вставала колом на несколько секунд, а при выборе нескольких файлов
   сразу — почти намертво.

   Теперь файл декодируется напрямую через createImageBitmap: без
   промежуточной строки и вне основного потока. base64 остаётся только
   один раз — на выходе, потому что сервер принимает фото именно так.
   ========================================================== */
const PHOTO_MAX_BYTES = 25 * 1024 * 1024;

/** Пауза, чтобы браузер успел перерисовать интерфейс между тяжёлыми шагами. */
function letUiBreathe(){
  return new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
}

/** Картинка из файла без base64. Возвращает объект с обязательным free(). */
async function decodeImageFile(file){
  if(window.createImageBitmap){
    try{
      const bmp = await createImageBitmap(file);
      return {img: bmp, free(){ try{ bmp.close && bmp.close(); }catch(e){} }};
    }catch(e){}
  }
  /* Запасной путь для старых браузеров: тоже без base64, через blob-ссылку.
     Её обязательно освобождаем, иначе картинка висит в памяти до перезагрузки. */
  const url = URL.createObjectURL(file);
  try{
    const im = await loadImg(url);
    return {img: im, free(){ URL.revokeObjectURL(url); }};
  }catch(e){
    URL.revokeObjectURL(url);
    throw e;
  }
}

/**
 * Файл -> сжатый dataURL. maxSide — потолок по длинной стороне,
 * flatten — подложить белый фон (нужно, когда запасной формат JPEG:
 * иначе прозрачные места станут чёрными).
 */
async function fileToPhotoDataUrl(file, maxSide, quality, opts){
  const o = opts || {};
  if(!String(file && file.type || '').startsWith('image/')){
    throw new Error('Нужен файл изображения');
  }
  if(file.size > PHOTO_MAX_BYTES){
    throw new Error('Фото тяжелее ' + Math.round(PHOTO_MAX_BYTES / 1048576) + ' МБ — возьмите поменьше');
  }
  const src = await decodeImageFile(file);
  try{
    const iw = src.img.width || src.img.naturalWidth || 1;
    const ih = src.img.height || src.img.naturalHeight || 1;
    const side = Math.max(800, +maxSide || 1600);
    const k = Math.min(1, side / Math.max(iw, ih));
    const w = Math.max(1, Math.round(iw * k));
    const h = Math.max(1, Math.round(ih * k));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    if(o.flatten){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); }
    ctx.drawImage(src.img, 0, 0, w, h);
    const q = Math.min(0.95, Math.max(0.7, quality == null ? 0.86 : +quality));
    /* WebP заметно легче JPEG при том же качестве и умеет прозрачность */
    let blob = await canvasToBlob(c, 'image/webp', q);
    if(!blob) blob = await canvasToBlob(c, 'image/jpeg', q);
    if(!blob) return c.toDataURL('image/jpeg', q);
    return await blobToDataURL(blob);
  } finally {
    src.free();
  }
}
/* Убрать светлый «квадратик» фона у лого и обрезать пустые поля. */
function knockOutLogoBg(c){
  const ctx = c.getContext('2d');
  const {width:w, height:h} = c;
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const sample = (x, y) => {
    const i = (y * w + x) * 4;
    return [d[i], d[i+1], d[i+2]];
  };
  const pts = [[0,0],[w-1,0],[0,h-1],[w-1,h-1],[2,2],[w-3,h-3],[Math.floor(w/2),2],[2,Math.floor(h/2)]];
  let sr=0, sg=0, sb=0;
  pts.forEach(([x,y]) => { const [r,g,b]=sample(x,y); sr+=r; sg+=g; sb+=b; });
  sr/=pts.length; sg/=pts.length; sb/=pts.length;
  /* только если углы светлые — иначе это уже прозрачный/тёмный логотип */
  if((sr+sg+sb)/3 < 210) return c;
  const thr = 42, soft = 22;
  let minX=w, minY=h, maxX=0, maxY=0;
  for(let i=0;i<d.length;i+=4){
    const dr=d[i]-sr, dg=d[i+1]-sg, db=d[i+2]-sb;
    const dist=Math.sqrt(dr*dr+dg*dg+db*db);
    if(dist < thr){ d[i+3]=0; }
    else if(dist < thr+soft){ d[i+3]=Math.round(255*(dist-thr)/soft); }
    if(d[i+3] > 12){
      const p = (i/4)|0, x = p % w, y = (p / w)|0;
      if(x<minX) minX=x; if(y<minY) minY=y;
      if(x>maxX) maxX=x; if(y>maxY) maxY=y;
    }
  }
  ctx.putImageData(img, 0, 0);
  if(maxX <= minX || maxY <= minY) return c;
  const pad = 4;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(w-1, maxX + pad); maxY = Math.min(h-1, maxY + pad);
  const tw = maxX - minX + 1, th = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = tw; out.height = th;
  out.getContext('2d').drawImage(c, minX, minY, tw, th, 0, 0, tw, th);
  return out;
}
/* Логотип: вырезаем фон → AVIF/WebP с прозрачностью (JPEG только запасной). */
async function encodeLogoAvif(src, maxSide){
  const im = await loadImg(src);
  const side = maxSide || 720;
  let w = im.naturalWidth || 1, h = im.naturalHeight || 1;
  const m = Math.max(w, h);
  if(m > side){
    const k = side / m;
    w = Math.round(w * k);
    h = Math.round(h * k);
  }
  let c = document.createElement('canvas');
  c.width = Math.max(1, w);
  c.height = Math.max(1, h);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  c = knockOutLogoBg(c);
  const tries = [['image/avif', 0.6], ['image/webp', 0.82], ['image/png', 0.92]];
  for(const [type, q] of tries){
    const blob = await canvasToBlob(c, type, q);
    if(!blob) continue;
    const dataUrl = await blobToDataURL(blob);
    return { dataUrl, mime: type, bytes: blob.size };
  }
  const dataUrl = c.toDataURL('image/png');
  return { dataUrl, mime: 'image/png', bytes: Math.round(dataUrl.length * 0.75) };
}
function logoFmtLabel(src){
  const m = String(src || '').match(/^data:([^;,]+)/);
  if(!m) return 'файл';
  const t = m[1].toLowerCase();
  if(t.includes('avif')) return 'AVIF';
  if(t.includes('webp')) return 'WebP';
  if(t.includes('jpeg') || t.includes('jpg')) return 'JPEG';
  if(t.includes('png')) return 'PNG';
  return t.replace('image/','').toUpperCase();
}

  const ctx = c.getContext('2d');
  const scale = Math.max(W / person.naturalWidth, H / person.naturalHeight);
  const pw = person.naturalWidth * scale, ph = person.naturalHeight * scale;
  ctx.drawImage(person, (W - pw) / 2, (H - ph) / 2, pw, ph);
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.fillRect(0, 0, W, H);
  const gw = W * 0.62, gh = gw * (garment.naturalHeight / garment.naturalWidth);
  const gx = (W - gw) / 2, gy = H * 0.28;
  ctx.save();
  ctx.globalAlpha = 0.88;
  ctx.shadowColor = 'rgba(0,0,0,.35)';
  ctx.shadowBlur = 28;
  ctx.drawImage(garment, gx, gy, gw, gh);
  ctx.restore();
  const g = ctx.createLinearGradient(0, H * 0.72, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.font = '700 28px system-ui,sans-serif';
  ctx.fillText(BRAND, 40, H - 70);
  ctx.font = '500 20px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.fillText(productName || 'Примерка', 40, H - 40);
  return c.toDataURL('image/jpeg', 0.92);
}
async function tryonViaApi(personUrl, garmentUrl, product){
  if(window.LC && typeof LC.tryon === 'function' && (TRYON.serverConfigured || TRYON.apiUrl === '/api/tryon')){
    const data = await LC.tryon({
      personImage: personUrl,
      garmentImage: garmentUrl,
      productId: product.id,
      productName: product.name,
      brand: BRAND
    });
    const out = data.image || data.imageUrl || data.result || data.url;
    if(!out) throw new Error('В ответе нет изображения');
    return out;
  }
  const headers = {'Content-Type':'application/json'};
  const tok = window.LC && LC.getToken && LC.getToken();
  if(tok) headers.Authorization = 'Bearer ' + tok;
  const res = await fetch(TRYON.apiUrl || '/api/tryon', {
    method:'POST', headers, credentials:'same-origin',
    body: JSON.stringify({
      personImage: personUrl,
      garmentImage: garmentUrl,
      productId: product.id,
      productName: product.name,
      brand: BRAND
    })
  });
  if(res.status === 401) throw new Error('Войдите в аккаунт, чтобы пользоваться примеркой');
  if(!res.ok){
    let msg = 'Сервер примерки ответил ' + res.status;
    try{ const d = await res.json(); if(d && d.error) msg = d.error; }catch(_){}
    throw new Error(msg);
  }
  const data = await res.json();
  const out = data.image || data.imageUrl || data.result || data.url;
  if(!out) throw new Error('В ответе нет изображения');
  return out;
}

async function takeTryonFile(file){
  if(!file) return;
  if(!String(file.type || '').startsWith('image/')) return toast('Нужен файл изображения');
  if(file.size > 12e6) return toast('Файл слишком большой — до 12 МБ');
  try{
    toast('Загружаем фото…');
    const raw = await readFileAsDataURL(file);
    S.tryon.photo = await compressDataUrl(raw, TRYON.maxSide || 1280);
    S.tryon.err = '';
    render(true);
  }catch(err){
    S.tryon.err = 'Не удалось прочитать фото. Попробуйте другой файл.';
    toast(S.tryon.err);
    render(true);
  }
}

let favObserver = null;
function watchPhotoFav(){
  favObserver?.disconnect();
  const onPhoto = document.querySelector('.pd__hero .pd__rb');
  const cta = document.querySelector('.pd__cta');
  if(!onPhoto || !cta) return;
  if(!('IntersectionObserver' in window)){ cta.classList.add('on'); return; }
  // Шапка парит поверх контента: без верхнего отступа наблюдатель считает
  // сердечко «видимым», когда оно уже уехало под шапку.
  favObserver = new IntersectionObserver(
    ([entry]) => cta.classList.toggle('on', !entry.isIntersecting),
    {threshold:0, rootMargin:'-84px 0px 0px 0px'}
  );
  favObserver.observe(onPhoto);
}

    if(!prod) return false;
    S.productId = id;
    S.galIdx = S.galIdx || 0;
    S.size = S.size || firstSize(prod);
    S.screen = 'product';
    return true;
  }
  const cat = /^catalog(?:\/([mw]))?$/.exec(h);
  if(cat){
    if(cat[1]) S.gender = cat[1];
    S.screen = 'catalog';
    return true;
  }
  const info = /^info[=/]([a-z0-9_-]+)$/i.exec(h);
  if(info && INFO_PAGES[info[1]]){
    S.infoKey = info[1];
    S.screen = 'info';
    return true;
  }
  if(SCREENS[h]){
    S.screen = h;
    return true;
  }
  return false;
}
function readSavedPlace(){
  try{ return JSON.parse(sessionStorage.getItem(PLACE_KEY) || 'null'); }catch(_){ return null; }
}
function applySavedPlace(d){
  if(!d || typeof d !== 'object') return;
  if(d.gender === 'w' || d.gender === 'm') S.gender = d.gender;
  if(d.productId && byId(d.productId)){
    S.productId = +d.productId;
    S.size = d.size || firstSize(byId(d.productId));
    S.galIdx = +d.galIdx || 0;
  }
  if(d.infoKey && INFO_PAGES[d.infoKey]) S.infoKey = d.infoKey;
  if(d.orderTab) S.orderTab = d.orderTab;
  if(d.filter && typeof d.filter === 'object') S.filter = Object.assign({}, S.filter, d.filter);
  if(d.sort) S.sort = d.sort;
  if(d.screen && SCREENS[d.screen]){
    if(d.screen === 'product' && !byId(S.productId)) S.screen = 'catalog';
    /* вход — теперь окно поверх магазина, восстанавливать его нечего */
    else if(d.screen === 'auth') S.screen = 'profile';
    else S.screen = d.screen;
  }
  _restoreScroll = +d.scroll || 0;
  _restoreGal = +d.galLeft || 0;
}
function restorePlace(){
  if(bootLockPlace) return;
  const saved = readSavedPlace();
  const fromHash = applyRouteHash(location.hash);
  if(fromHash){
    if(saved && saved.screen === S.screen){
      _restoreScroll = +saved.scroll || 0;
      _restoreGal = +saved.galLeft || 0;
      if(S.screen === 'product'){
        if(saved.galIdx != null) S.galIdx = +saved.galIdx || 0;
        if(saved.size) S.size = saved.size;
      }
      if(saved.filter && typeof saved.filter === 'object') S.filter = Object.assign({}, S.filter, saved.filter);
      if(saved.sort) S.sort = saved.sort;
      if(saved.orderTab) S.orderTab = saved.orderTab;
    }
    return;
  }
  if(saved) applySavedPlace(saved);
}
function restorePlaceScroll(){
  const y = _restoreScroll;

  const apply = () => {
    if(y) window.scrollTo(0, y);
    const t = document.getElementById('pdTrack');
    if(t && g) t.scrollLeft = g;
  };
  apply();
  requestAnimationFrame(() => {
    apply();
    requestAnimationFrame(apply);
  });
  setTimeout(apply, 120);

}
