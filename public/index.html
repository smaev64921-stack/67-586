.mini__open .ic{opacity:.75}
.mini__b{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini__b b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini__b span{font-size:11px;color:rgba(255,255,255,.62)}
.mini__x{
  width:32px;height:32px;border-radius:var(--r-pill);flex:none;
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);
  transition:all var(--dur) var(--ease)
}
.mini__x:hover{background:rgba(255,255,255,.14);color:#fff}

/* ===================== ОВЕРЛЕИ ===================== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;animation:fade var(--dur) forwards}
@keyframes fade{from{opacity:0}to{opacity:1}}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--card);
  border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:86vh;display:flex;flex-direction:column;
  animation:up .28s var(--ease);max-width:520px;margin:0 auto
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet__g{width:38px;height:4px;background:var(--line2);border-radius:2px;margin:10px auto 2px;flex:none}
.sheet__h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet__t{font-size:15px;font-weight:700}
.sheet__b{flex:1;overflow-y:auto;padding:6px 16px 16px}
.sheet__f{
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);display:flex;flex:none;
  max-height:140px;overflow:hidden;
  transition:max-height .3s var(--ease), opacity .22s var(--ease),
             padding .3s var(--ease), border-color .22s var(--ease)
}
/* пока открыта клавиатура, кнопки не нужны — освобождаем место */
.sheet.np-on .sheet__f{
  max-height:0;opacity:0;padding-top:0;padding-bottom:0;border-top-color:transparent
}
/* «Сбросить» появляется, только когда есть что сбрасывать,
   и раздвигает «Показать» плавно, а не рывком */
.f-reset{
  flex:1;max-width:0;opacity:0;margin-right:0;
  padding-left:0;padding-right:0;border-width:0;
  overflow:hidden;white-space:nowrap;
  transition:max-width .4s var(--ease), opacity .26s var(--ease),
             margin-right .4s var(--ease), padding .4s var(--ease), border-width .18s var(--ease)
}
.sheet__f.on .f-reset{max-width:190px;opacity:1;margin-right:10px;padding-left:16px;padding-right:16px;border-width:1.5px}
.f-apply{flex:1;transition:flex-grow .4s var(--ease)}

.fg{padding:16px 0;border-bottom:1px solid var(--line)}
.fg:last-child{border-bottom:0}
.fg__h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:9px 14px;border:1.5px solid var(--line2);border-radius:var(--r-pill);
  font-size:13px;transition:all var(--dur) var(--ease);background:var(--card)
}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rng{display:flex;align-items:center;gap:10px}
.rng__f{position:relative;flex:1;min-width:0;display:flex}
.rng input{
  flex:1;min-width:0;width:100%;border:1.5px solid var(--line2);border-radius:var(--r-md);padding:12px;
  font-size:14px;outline:none;background:var(--card)
}
.rng input:focus{border-color:var(--ink)}
.rng input.np-active{border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
/* Поле readonly: системный курсор в нём не появляется, поэтому рисуем
   свой — иначе непонятно, в какое из двух полей сейчас идёт ввод. */
.rng__car{
  position:absolute;top:50%;left:13px;width:1.6px;height:19px;border-radius:1px;
  background:var(--ink);transform:translateY(-50%);opacity:0;pointer-events:none
}
.rng__f.car-on .rng__car{animation:caretblink 1.06s steps(1,end) infinite}
@keyframes caretblink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .rng__f.car-on .rng__car{animation:none;opacity:1}
}
.sortitem{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;text-align:left;font-size:14.5px;border-bottom:1px solid var(--line)}
.sortitem:last-child{border-bottom:0}
.sortitem .ic{margin-left:auto;color:var(--ink);opacity:0}
.sortitem[aria-current="true"] .ic{opacity:1}

.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:101;background:var(--card);
  width:min(460px,calc(100% - 28px));max-height:88vh;overflow-y:auto;border-radius:var(--r-lg);
  padding:22px 18px;animation:modalIn .24s var(--ease)
}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes riseFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal__h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal__t{font-size:16px;font-weight:700;text-transform:uppercase;line-height:1.3}

/* ---- окно входа и регистрации ---- */
.amod{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:101;
  width:min(440px,calc(100% - 30px));max-height:92vh;overflow-y:auto;
  background:var(--card);border-radius:8px;padding:34px 26px 28px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);animation:modalIn .24s var(--ease)
}
.amod__x{
  position:absolute;top:13px;right:13px;padding:8px;color:var(--muted2);
  border-radius:var(--r-sm);transition:color var(--dur) var(--ease), background var(--dur) var(--ease)
}
.amod__x:hover{color:var(--ink);background:var(--chip)}
.amod__x .ic{width:20px;height:20px}
.amod__t{font-size:23px;font-weight:800;text-align:center;line-height:1.25;letter-spacing:-.01em;margin:2px 0 8px}
.amod__s{font-size:13px;color:var(--muted);text-align:center;line-height:1.55;margin:0 auto 8px;max-width:300px}
/* Письма магазинов почтовики почти всегда кладут в «Спам», пока домен
   не прогрет. Молчать об этом нельзя: человек решит, что письмо не дошло. */
.amod__spam{
  display:flex;align-items:flex-start;gap:9px;margin:14px 0 0;padding:11px 13px;
  background:var(--chip);border-radius:var(--r-md);
  font-size:12.5px;line-height:1.5;color:var(--ink-soft);text-align:left
}
.amod__spam .ic{width:16px;height:16px;flex:none;margin-top:1px;color:var(--muted)}
.amod__spam b{font-weight:700}
.amod__f{margin-top:22px}
.amod__l{display:block;font-size:13.5px;color:var(--ink-soft);margin:0 0 8px}
.amod__i{
  width:100%;background:var(--card);border:1.5px solid var(--line2);border-radius:6px;
  padding:15px 16px;font-size:15px;outline:none;margin-bottom:18px;
  transition:border-color var(--dur) var(--ease)
}
.amod__i::placeholder{color:var(--muted2)}
.amod__i:focus{border-color:var(--ink)}
/* поле пароля с кнопкой-глазиком: отступ снизу переезжает на обёртку */
.amod__w{position:relative;margin-bottom:18px}
.amod__i--eye{margin-bottom:0;padding-right:50px}
.amod__eye{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  padding:10px;color:var(--muted2);transition:color var(--dur) var(--ease)
}
.amod__eye:hover{color:var(--ink)}
.amod__eye .ic{display:block;width:19px;height:19px}
.amod__b{
  display:block;margin:8px auto 0;min-width:196px;padding:16px 34px;
  background:var(--ink);color:#fff;border-radius:var(--r-md);
  font-size:15px;font-weight:600;transition:opacity var(--dur) var(--ease), transform .16s var(--ease)
}
.amod__b:hover{opacity:.85}
.amod__b:active{transform:scale(.97)}
.amod__b:disabled{opacity:.4}
.amod__links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;margin-top:24px}
.amod__link{
  font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:4px;
  transition:opacity var(--dur) var(--ease)
}
.amod__link:hover{opacity:.55}
.amod__alt{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
  font-size:13px;color:var(--muted);transition:color var(--dur) var(--ease)
}
.amod__alt:hover{color:var(--ink)}
.amod__note{
  margin-bottom:18px;padding:12px 14px;background:var(--chip);border-radius:var(--r-md);
  font-size:12.5px;line-height:1.55;color:var(--ink-soft)
}
/* «или» — разделитель перед входом через бота */
.amod__or{
  display:flex;align-items:center;gap:10px;margin:14px 0 9px;
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2)
}
.amod__or::before,.amod__or::after{content:"";flex:1;height:1px;background:var(--line)}
/* Telegram — второстепенный способ входа: одна компактная строка,
   а не баннер выше самой формы. */
.amod__tg{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  padding:8px 12px;border:1.5px solid #cfe9f7;background:#f2fafe;border-radius:var(--r-sm);
  font-size:13px;font-weight:650;color:#1a8bbf;
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease)
}
.amod__tg:hover{background:#e8f6fd;border-color:#a9d8f0}
.amod__tg .ic{flex:none;width:15px;height:15px;stroke:#229ED9;fill:none}
/* Кнопку рисует скрипт Google — ему нужно только место по центру. */
.amod__gwrap{display:flex;justify-content:center;min-height:0;margin-bottom:6px}
.amod__gwrap:empty{margin-bottom:0}
/* Google требует свой знак в фирменных цветах на белом или светло-сером
   фоне — перекрашивать его нельзя, поэтому запасная кнопка нейтральная. */
.amod__google{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  margin-bottom:6px;padding:9px 12px;border:1.5px solid var(--line2);
  background:#fff;border-radius:var(--r-sm);
  font-size:13px;font-weight:650;color:var(--ink);
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease)
}
.amod__google:hover{background:var(--chip);border-color:#cfcfcf}
.amod__google svg{flex:none;width:16px;height:16px;display:block}
.amod__code{
  display:block;width:100%;margin-top:6px;padding:5px 8px;
  font-size:11.5px;line-height:1.3;color:var(--muted2);text-align:center;
  transition:color var(--dur) var(--ease)
}
.amod__code:hover{color:var(--ink)}

.fab{
  position:fixed;right:16px;bottom:calc(var(--tab-h) + 30px);z-index:35;
  width:52px;height:52px;border-radius:var(--r-pill);background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-2);
  transition:transform var(--dur) var(--ease)
}
.fab:hover{transform:translateY(-3px)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + 34px);transform:translateX(-50%);z-index:300;
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:var(--r-md);font-size:13.5px;
  box-shadow:var(--sh-3);animation:tup .32s cubic-bezier(.34,1.15,.5,1);max-width:88%;text-align:center
}
@keyframes tup{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* ===================== СОСТОЯНИЕ СВЯЗИ =====================
   Плашка лежит ПОВЕРХ страницы, а не встроена в неё: контент не съезжает
   вниз, и видно её из любого места — из каталога, шторки, галереи, админки.
   Поэтому z-index выше всех слоёв (админка 200, шторки 101, тост 300). */
.net{
  position:fixed;top:var(--net-top);left:50%;z-index:500;
  width:min(440px, calc(100% - 24px));
  display:flex;align-items:center;gap:10px;
  padding:11px 13px;border-radius:var(--r-xl);
  font-size:12.5px;font-weight:600;line-height:1.4;
  color:#fff;background:var(--ink);box-shadow:var(--sh-3);
  overflow:hidden;
  /* плашка только сообщает: нажатия должны проходить сквозь неё к контенту */
  pointer-events:none;
  /* спрятана — уехала за верхний край; приезд и уход идут одним переходом */
  transform:translate(-50%,calc(-100% - 28px));
  opacity:0;
  transition:transform .5s cubic-bezier(.22,1.15,.36,1), opacity .3s var(--ease);
  will-change:transform,opacity
}
.net.is-on{transform:translate(-50%,0);opacity:1}
.net[hidden]{display:none}
/* у админки своя верхняя полоса — плашка встаёт ровно под неё */
body.adm-on{--net-top:calc(env(safe-area-inset-top) + 82px)}
/* значок в кружке: состояние читается с одного взгляда, ещё до текста */
.net__ic{
  flex:none;width:26px;height:26px;border-radius:var(--r-pill);
  display:grid;place-items:center;background:rgba(255,255,255,.18)
}
.net__ic .ic{width:15px;height:15px;stroke-width:2}
.net__t{flex:1;min-width:0;animation:netTxt .34s var(--ease) both}
@keyframes netTxt{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* полоска загрузки: пока связи нет — бежит по кругу, когда вернулась —
   досчитывает до конца, и плашка уходит сама. */
.net__bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.16)}
.net__bar::after{
  content:'';position:absolute;top:0;bottom:0;left:-42%;width:42%;
  background:rgba(255,255,255,.82);animation:netSweep 1.2s var(--ease) infinite
}
@keyframes netSweep{from{left:-42%}to{left:100%}}
.net--back .net__bar::after{
  left:0;width:100%;transform-origin:left;animation:netHold 2.6s linear forwards
}
@keyframes netHold{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.net--off{background:#8a1f1f}
.net--slow{background:#8a5a12}
.net--back{background:#146b3a}
@media (prefers-reduced-motion:reduce){
  .net{transition-duration:.001s}
  .net__t{animation:none}
  .net__bar::after,.net--back .net__bar::after{animation:none;left:0;width:100%}
}

/* ===================== АДМИН (операционная панель) ===================== */
.ad{
  position:fixed;inset:0;z-index:200;background:#f0f0f0;color:var(--ink);
  display:flex;flex-direction:column;font-size:14px;
  animation:fadeIn .28s var(--ease)
}
.ad__frame{
  flex:1;min-height:0;display:grid;grid-template-rows:auto auto 1fr;
  max-width:1100px;width:100%;margin:0 auto
}
@media(min-width:860px){
  .ad__frame{grid-template-columns:220px 1fr;grid-template-rows:auto 1fr}
  .ad__top{grid-column:1/-1}
  .ad__nav{grid-row:2;flex-direction:column;align-items:stretch;padding:14px 12px;
    border-right:1px solid var(--line);border-bottom:0;overflow-y:auto;background:rgba(255,255,255,.55)}
  .ad__nav-b{justify-content:flex-start;width:100%;border-radius:6px;padding:11px 12px}
  .ad__main{grid-column:2;grid-row:2}
}
.ad__top{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(0,0,0,.03)
}
.ad__brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.ad__mark{width:auto;height:42px;max-width:52px}
.ad__logo-prev{
  width:140px;height:140px;margin:0 auto 14px;padding:16px;
  display:flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid var(--line);border-radius:var(--r-md)
}
.ad__logo-prev .lg{width:132px;height:132px}
.ad__logo-meta{text-align:center;font-size:12.5px;color:var(--muted);margin:0 0 16px}
.ad__t{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ad__c{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
.ad__nav{
  display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);
  border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch
}
.ad__nav::-webkit-scrollbar{display:none}
.ad__nav-b{
  flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;
  font-size:12.5px;font-weight:600;color:var(--muted);background:transparent;
  border:1.5px solid transparent;white-space:nowrap;
  transition:all .2s var(--ease)
}
.ad__nav-b .ic{width:15px;height:15px;stroke-width:1.9}
.ad__nav-b:hover{color:var(--ink);background:var(--chip)}
.ad__nav-b[aria-current="true"]{
  color:#fff;background:var(--ink);border-color:var(--ink);
  box-shadow:0 8px 18px rgba(0,0,0,.14)
}
.ad__main{min-height:0;overflow:auto;padding:16px 16px 28px}
.ad__panel{animation:riseIn .32s var(--ease) both}
.ad__hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ad__h{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.ad__sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.ad__b{
  border:1.5px solid var(--line2);background:var(--card);color:var(--ink);
  padding:9px 14px;font-size:12.5px;font-weight:600;border-radius:var(--r-sm);
  transition:all var(--dur) var(--ease)
}
.ad__b:hover{border-color:var(--ink);background:var(--chip)}
.ad__b--pri{background:var(--ink);border-color:var(--ink);color:#fff}
.ad__b--pri:hover{opacity:.9;background:var(--ink);border-color:var(--ink)}
.ad__b--ghost{background:transparent}
.ad__bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.ad__in{
  flex:1;min-width:140px;background:var(--card);border:1.5px solid var(--line2);
  color:var(--ink);padding:12px 14px;border-radius:var(--r-md);outline:none;font-size:14px;
  transition:border-color var(--dur) var(--ease)
}
.ad__in:focus{border-color:var(--ink)}
.ad__filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ad__pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ad__pick-b{
  padding:10px 14px;border:1.5px solid var(--line2);border-radius:var(--r-pill);
  font-size:13px;font-weight:600;background:var(--card);
  transition:all var(--dur) var(--ease)
}
.ad__pick-b[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ad__filters .ad__pick-b{padding:9px 14px}

/* KPI / analytics */
.ad__kpi{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px
}
@media(min-width:700px){.ad__kpi{grid-template-columns:repeat(4,1fr)}}
.ad__stat{
  background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:16px 14px;
  position:relative;overflow:hidden;min-height:96px
}
.ad__stat::after{
  content:'';position:absolute;right:-18px;top:-18px;width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,0,0,.05),transparent 70%)
}
.ad__stat-l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ad__stat-v{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:8px;line-height:1}
.ad__stat-h{font-size:12px;color:var(--muted);margin-top:8px}
.ad__stat--accent{background:var(--ink);color:#fff;border-color:var(--ink)}
.ad__stat--accent .ad__stat-l,.ad__stat--accent .ad__stat-h{color:rgba(255,255,255,.62)}
.ad__stat--accent::after{background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%)}
.ad__grid2{display:grid;gap:12px}
@media(min-width:760px){.ad__grid2{grid-template-columns:1.2fr .8fr}}
.ad__box{
  background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:16px
}
.ad__box-t{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px}
.ad__bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.ad__barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.ad__barfill{
  width:100%;border-radius:8px 8px 4px 4px;background:var(--ink);min-height:4px;
  transition:height .45s var(--ease)
}
.ad__barlab{font-size:10px;color:var(--muted);font-weight:600}
.ad__toprow{
  display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)
}
.ad__toprow:last-child{border-bottom:0}
.ad__topn{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad__topm{font-size:12px;color:var(--muted);flex:none}
.ad__rank{
  width:24px;height:24px;border-radius:8px;background:var(--chip);display:grid;place-items:center;
  font-size:11px;font-weight:700;flex:none
}

/* lists */
.ad__list{display:flex;flex-direction:column;gap:10px}
.ad__row{
  display:flex;gap:12px;align-items:center;background:var(--card);
  border:1.5px solid var(--line);border-radius:var(--r-lg);padding:12px;
  transition:box-shadow var(--dur) var(--ease), transform .15s var(--ease)
}
.ad__row:hover{box-shadow:var(--sh-1)}
.ad__row--off{opacity:.48}
.ad__row--click{cursor:pointer;width:100%;text-align:left}
.ad__th{width:56px;height:72px;border-radius:var(--r-sm);object-fit:contain;object-position:center;background:var(--photo);flex:none}
.ad__av{
  width:44px;height:44px;border-radius:8px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:700;flex:none;letter-spacing:.02em
}
.ad__i{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ad__n{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad__m{font-size:11.5px;color:var(--muted)}
.ad__p{font-size:13px;font-weight:700;color:var(--ink)}
.ad__acts{display:flex;gap:5px;flex:none}
.ad__ib{
  width:34px;height:34px;border:1.5px solid var(--line2);border-radius:var(--r-sm);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  transition:all var(--dur) var(--ease)
}
.ad__ib:hover{border-color:var(--ink);background:var(--chip)}
.ad__ib .ic{width:15px;height:15px;stroke:var(--ink-soft);stroke-width:1.8}
.ad__ib--d:hover{border-color:var(--danger)}
.ad__ib--d .ic{stroke:var(--danger)}
.ad__badge{
  display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--chip);color:var(--ink-soft)
}
.ad__badge--ok{background:var(--tone-ok-bg);color:var(--tone-ok-fg)}
.ad__badge--warn{background:var(--tone-warn-bg);color:var(--tone-warn-fg)}
.ad__badge--ship{background:var(--tone-ship-bg);color:var(--tone-ship-fg)}
.ad__badge--block{background:var(--tone-danger-bg);color:var(--tone-danger-fg)}
.ad__badge--sale{background:#0b0b0b;color:#fff}
.ad__badge--hit{background:#1a1a1a;color:#fff}
.ad__badge--new{background:#ececec;color:#111}
.ad__badge--muted{background:var(--chip);color:var(--muted)}
.ad__badge--danger{background:var(--tone-danger-bg);color:var(--tone-danger-fg)}
.ad__none{text-align:center;color:var(--muted);padding:56px 20px;line-height:1.8}
.ad__empty{
  text-align:center;padding:48px 20px;background:var(--card);border:1.5px dashed var(--line2);
  border-radius:8px;color:var(--muted);line-height:1.7
}
.ad__empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

/* forms / drawers */
.ad__form{
  position:fixed;inset:0;z-index:210;background:rgba(0,0,0,.42);
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 12px
}
.ad__card{
  background:var(--card);border-radius:var(--r-lg);width:min(560px,100%);
  padding:22px 18px;animation:riseFade .24s var(--ease);
  box-shadow:var(--sh-3);margin-bottom:24px
}
.ad__ct{font-size:16px;font-weight:700;text-transform:uppercase;margin-bottom:16px;letter-spacing:.02em}
.ad__g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ad__l{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.ad__f{
  width:100%;background:var(--card);border:1.5px solid var(--line2);color:var(--ink);
  padding:12px 14px;border-radius:var(--r-md);outline:none;font-size:14px;margin-bottom:12px;
  transition:border-color var(--dur) var(--ease)
}
.ad__f:focus{border-color:var(--ink)}
textarea.ad__f{resize:vertical;min-height:88px;line-height:1.5}
.ad__sz{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ad__sz label{
  border:1.5px solid var(--line2);border-radius:var(--r-pill);padding:8px 14px;
  font-size:13px;background:var(--card);cursor:pointer;transition:all var(--dur) var(--ease)
}
.ad__sz input{display:none}
.ad__sz input:checked + span{font-weight:700}
.ad__sz label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.ad__stock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ad__stock label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.ad__stock input{margin:0}
.ad__sw{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-bottom:15px;cursor:pointer}
.ad__sw input{width:18px;height:18px;accent-color:var(--ink)}
.ad__prev{
  width:100%;max-height:280px;aspect-ratio:3/4;object-fit:contain;object-position:center;
  border-radius:var(--r-md);background:var(--photo);
  border:1.5px solid var(--line);margin-bottom:11px
}
.ad__gal{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px
}
.ad__gal-item{
  position:relative;aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;
  background:var(--photo);border:1.5px solid var(--line)
}
.ad__gal-item.is-cover{border-color:var(--ink)}
.ad__gal-item img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}
.ad__gal-badge{
  position:absolute;top:6px;left:6px;padding:3px 7px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em
}
.ad__gal-acts{
  position:absolute;left:0;right:0;bottom:0;display:flex;gap:2px;justify-content:center;
  padding:6px 4px;background:linear-gradient(transparent,rgba(0,0,0,.55))
}
.ad__gal-acts button{
  width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center
}
.ad__gal-acts button:disabled{opacity:.35}
.ad__gal-acts .ic{width:14px;height:14px}
/* крестик удаления кадра — поверх фото; без position:absolute он вставал
   в поток под картинкой и обрезался overflow:hidden у .ad__gal-item */
.ad__gal-x{
  position:absolute;top:5px;right:5px;width:26px;height:26px;z-index:2;
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-sm);background:rgba(255,255,255,.92);color:var(--ink);
  box-shadow:0 1px 4px rgba(0,0,0,.25);transition:background var(--dur) var(--ease)
}
.ad__gal-x:hover{background:#fff;color:var(--danger)}
.ad__gal-x .ic{width:14px;height:14px}
.ad__gal-add{
  aspect-ratio:3/4;border-radius:var(--r-sm);border:1.5px dashed var(--line);
  background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--muted);font-size:12px;font-weight:600;line-height:1.25;text-align:center;padding:10px
}
.ad__gal-add .ic{width:22px;height:22px;stroke:var(--ink)}
.ad__gal-url{display:flex;gap:8px;margin-bottom:12px;align-items:stretch}
.ad__gal-url .ad__f{margin:0;flex:1}
.ad__chart-box{
  margin-top:14px;padding:14px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)
}
.ad__chart-box .ad__box-t{margin-bottom:6px}
.pd__chart{padding:0 var(--pad) 18px}
.pd__chart img{
  width:100%;max-height:420px;object-fit:contain;object-position:center;
  border-radius:var(--r-md);background:var(--photo);display:block
}
.ad__hint{font-size:11.5px;color:var(--muted);margin:-6px 0 12px;line-height:1.5}
/* памятка «какое фото загружать» рядом с кнопкой загрузки */
.ad__th--tx{
  display:flex;align-items:center;justify-content:center;
  background:var(--chip);color:var(--muted);font-weight:700;font-size:13px
}
.ad__spec{
  margin:0 0 12px;padding:12px 14px;background:var(--chip);
  border:1px solid var(--line);border-radius:var(--r-md)
}
.ad__spec-h{display:flex;align-items:center;gap:7px;font-size:12.5px}
.ad__spec-h .ic{flex:none;color:var(--muted)}
.ad__spec-size{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:8px 0 10px;
  font-size:17px;font-weight:700;letter-spacing:-.01em
}
.ad__spec-size span{font-size:12px;font-weight:500;color:var(--muted)}
.ad__spec-l{margin:0;padding:0 0 0 16px;list-style:disc}
.ad__spec-l li{font-size:11.5px;line-height:1.55;color:var(--ink-soft);margin:3px 0}
.ad__spec-l b{font-weight:700;color:var(--ink)}
.ad__foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.ad__sec{margin:18px 0 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ad__promo{
  display:flex;gap:12px;align-items:center;background:var(--card);
  border:1.5px solid var(--line);border-radius:8px;padding:14px
}
.ad__promo-code{
  font-size:15px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums
}
/* мелкие факты — плашками: не рвутся по словам и читаются с одного взгляда */
.ad__chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ad__chip{
  display:inline-flex;align-items:center;padding:4px 10px;border-radius:var(--r-sm);
  background:var(--chip);color:var(--ink-soft);border:1px solid var(--line);
  font-size:11px;font-weight:600;line-height:1.35;white-space:nowrap;
  font-variant-numeric:tabular-nums
}
.ad__chip--key{background:var(--ink);color:#fff;border-color:var(--ink)}
.ad__chip--off{background:rgba(214,69,69,.1);color:var(--danger);border-color:transparent}
.ad__split{display:grid;gap:12px}
@media(min-width:700px){.ad__split{grid-template-columns:1fr 1fr}}

/* --- админка: фото на главной --- */
.ad__b:disabled,.ad__ib:disabled{opacity:.38;pointer-events:none}
.ad__th--wide{width:84px;height:56px}
/* раздел «Главная» разложен по шагам: что сделать и в каком порядке */
.ad__step{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px;margin-bottom:14px
}
.ad__step-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.ad__step-n{
  flex:none;width:26px;height:26px;border-radius:var(--r-pill);background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700
}
/* цвета товара в админке */
.ad__colors{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ad__color{
  display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;
  border:1px solid var(--line2);border-radius:var(--r-pill);font-size:12.5px
}
.ad__color i{width:20px;height:20px;border-radius:var(--r-pill);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.ad__color button{display:flex;color:var(--muted2);padding:2px}
.ad__color button:hover{color:var(--danger)}
.ad__color .ic{width:14px;height:14px}
/* свой подбор цвета — вместо системного окна выбора */
.cpk{margin-bottom:16px}
.cpk__row{display:flex;gap:8px;align-items:flex-start}
.cpk__prev{
  flex:none;width:44px;height:44px;border-radius:var(--r-md);background:#1b1b1b;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)
}
.cpk__prev.is-light{box-shadow:inset 0 0 0 1.5px var(--line2)}
.cpk__field{position:relative;flex:1;min-width:0;display:block}
.cpk__field .ad__f{margin:0;width:100%}
.cpk__add{flex:none;height:44px;white-space:nowrap}
/* подсказки по названию — свои, поверх формы */
.cpk__sug{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;
  display:flex;flex-direction:column;padding:4px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:0 12px 28px rgba(0,0,0,.14);max-height:232px;overflow-y:auto
}
.cpk__sug[hidden]{display:none}
.cpk__sug button{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;
  border-radius:9px;font-size:13.5px;text-align:left;
  transition:background var(--dur) var(--ease)
}
.cpk__sug button:hover{background:var(--chip)}
.cpk__sug i{
  width:20px;height:20px;border-radius:var(--r-pill);flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)
}
/* готовые оттенки */
.cpk__will{margin:8px 0 0;font-size:12.5px;color:var(--muted);min-height:16px}
.cpk__will:empty{margin:0;min-height:0}
.cpk__sw{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.cpk__chip{
  width:32px;height:32px;border-radius:var(--r-pill);padding:2.5px;
  border:1.5px solid var(--line2);background:var(--card);
  transition:border-color var(--dur) var(--ease), transform .14s var(--ease)
}
.cpk__chip i{display:block;width:100%;height:100%;border-radius:var(--r-pill);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.cpk__chip:hover{border-color:var(--muted)}
.cpk__chip:active{transform:scale(.92)}
.cpk__chip[aria-pressed="true"]{border-color:var(--ink);border-width:2px;padding:2px}
.cpk__more{
  display:block;margin-top:12px;font-size:12.5px;color:var(--muted);
  text-decoration:underline;text-underline-offset:4px;transition:color var(--dur) var(--ease)
}
.cpk__more:hover{color:var(--ink)}
.cpk__pane{margin-top:12px}
.cpk__pane[hidden]{display:none}
/* квадрат насыщенности и яркости — тянется пальцем */
.cpk__sv{
  position:relative;width:100%;height:150px;border-radius:var(--r-md);
  border:1px solid var(--line2);cursor:crosshair;touch-action:none;overflow:hidden;
  background:
    linear-gradient(to top, #000, rgba(0,0,0,0)),
    linear-gradient(to right, #fff, hsl(var(--h, 0) 100% 50%))
}
.cpk__dot{
  position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:var(--r-pill);
  border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none
}
.cpk__hue{
  -webkit-appearance:none;appearance:none;width:100%;height:16px;margin-top:12px;
  border-radius:var(--r-pill);border:1px solid var(--line2);outline:none;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)
}
.cpk__hue::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:var(--r-pill);
  background:#fff;border:2px solid var(--ink);cursor:pointer
}
.cpk__hue::-moz-range-thumb{
  width:20px;height:20px;border-radius:var(--r-pill);
  background:#fff;border:2px solid var(--ink);cursor:pointer
}
.cpk__hexline{margin:10px 0 0;font-size:12px;color:var(--muted)}
.cpk__hexline code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:var(--chip);padding:3px 7px;border-radius:6px;color:var(--ink)
}
/* только текст шага, но не кружок с номером: у него свои размер, цвет и
   выключка по центру — иначе цифра уезжала в угол и красилась в серый */
.ad__step-h > div b{display:block;font-size:15px;font-weight:700;margin-bottom:3px}
.ad__step-h > div span{display:block;font-size:12.5px;color:var(--muted);line-height:1.5}
.ad__slidepv{
  position:relative;width:100%;aspect-ratio:16/10;border-radius:var(--r-md);overflow:hidden;
  background:var(--photo);border:1.5px solid var(--line);margin-bottom:12px;display:grid;place-items:center
}
.ad__slidepv img{width:100%;height:100%;object-fit:contain;object-position:center}
.ad__slidepv span{position:absolute;font-size:12px;color:var(--muted);padding:0 22px;text-align:center;line-height:1.5}
.card__badge{
  position:absolute;left:9px;top:9px;z-index:2;padding:5px 9px;border-radius:999px;
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(11,11,11,.92);color:#fff;backdrop-filter:blur(4px)
}
.card__badge--sale{background:#0b0b0b}
.card__badge--out{background:rgba(11,11,11,.62)}
/* распроданное — приглушаем фото и гасим кнопку */
.card__ph--out .card__img{opacity:.45;filter:grayscale(.35)}
.card__buy--out{
  background:var(--chip);color:var(--muted);box-shadow:none;cursor:not-allowed
}
.card__buy--out .card__buy-pr{color:var(--muted)}
.card__buy--out .card__buy-a{color:var(--muted2);font-size:9.5px;letter-spacing:.04em}
.qsize__b--out{
  color:var(--muted2);background:var(--chip);border-color:var(--line);
  text-decoration:line-through;cursor:not-allowed
}
.home__banner{
  margin:0 var(--pad) 8px;padding:14px 16px;border-radius:8px;background:var(--ink);color:#fff;
  font-size:13px;line-height:1.45;font-weight:500
}
.promo{
  margin:0 0 8px;padding:8px 10px;border-radius:6px;background:var(--card);
  border:1.5px solid var(--line)
}
.promo__lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.promo__row{display:flex;gap:6px;align-items:stretch}
.promo__in{
  flex:1;min-width:0;border:1.5px solid var(--line2);border-radius:6px;padding:8px 10px;
  font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;outline:none;background:var(--bg)
}
.promo__in:focus{border-color:var(--ink)}
.promo__go{
  flex:none;padding:0 12px;border-radius:6px;background:var(--ink);color:#fff;
  font-size:12px;font-weight:600;white-space:nowrap
}
.promo__go:active{transform:scale(.98)}
.promo__msg{margin-top:6px;font-size:12px;line-height:1.35;color:var(--muted)}
.promo__msg.is-ok{color:var(--ok);font-weight:600}
.promo__msg.is-err{color:var(--danger);font-weight:600}
.promo__clear{margin-left:8px;text-decoration:underline;font-weight:600;color:inherit}

/* ===================== FOOTER ===================== */
.ft{
  margin:36px 0 0;padding:0 0 calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, transparent 0%, #ececec 28%, #e8e8e8 100%);
  animation:riseIn .5s var(--ease) both
}
.ft__inner{padding:36px var(--pad) 22px;max-width:1200px;margin:0 auto}
.ft__top{
  display:flex;flex-direction:column;align-items:flex-start;gap:14px;
  padding-bottom:28px;border-bottom:1px solid rgba(0,0,0,.08);margin-bottom:8px
}
.ft__logo{display:flex;align-items:center;gap:12px}
.ft__mark{width:58px;height:58px}
.ft__name{
  font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1
}
.ft__tag{font-size:13px;color:var(--muted);line-height:1.55;max-width:280px}

.ft__cols{display:flex;flex-direction:column}
.ft__col{border-bottom:1px solid rgba(0,0,0,.07)}
.ft__col:last-of-type{border-bottom:0}
.ft__sum{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;padding:16px 2px;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--ink);
  list-style:none;cursor:pointer;user-select:none;
  transition:color .22s var(--ease)
}
.ft__sum::-webkit-details-marker{display:none}
.ft__sum .ic{
  color:var(--muted);flex:none;
  transition:transform .4s cubic-bezier(.22,1,.36,1), color .22s var(--ease)
}
.ft__col[open] .ft__sum .ic{transform:rotate(180deg);color:var(--ink)}
.ft__links{
  display:flex;flex-direction:column;gap:2px;
  padding:0 2px;overflow:hidden;
  height:0;opacity:0;pointer-events:none;
  transform:translateY(-6px);
  transition:
    height .4s cubic-bezier(.22,1,.36,1),
    opacity .28s ease,
    transform .36s cubic-bezier(.22,1,.36,1)
}
.ft__col[open] .ft__links{
  height:auto;opacity:1;pointer-events:auto;transform:none;
  padding:0 2px 16px
}
.ft__col[open] .ft__a,
.ft__col[open] .ft__tg{
  animation:ftReveal .38s cubic-bezier(.22,1,.36,1) both
}
.ft__col[open] .ft__a:nth-child(1){animation-delay:.03s}
.ft__col[open] .ft__a:nth-child(2){animation-delay:.07s}
.ft__col[open] .ft__a:nth-child(3){animation-delay:.11s}
.ft__col[open] .ft__a:nth-child(4){animation-delay:.15s}
.ft__col[open] .ft__a:nth-child(5){animation-delay:.19s}
.ft__col[open] .ft__tg{animation-delay:.08s}
@keyframes ftReveal{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:none}
}
.ft__col--busy .ft__sum{pointer-events:none}
.ft__a{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 10px;margin:0 -10px;border-radius:var(--r-sm);
  font-size:14px;color:var(--ink-soft);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease),
             transform var(--dur) var(--ease)
}
.ft__a:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.ft__a:active{transform:scale(.99)}

.ft__tg{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:14px;margin-top:4px;background:var(--card);border-radius:var(--r-md);
  border:1.5px solid var(--line2);
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
             transform .12s var(--ease)
}
.ft__tg:hover{border-color:var(--ink);box-shadow:var(--sh-1)}
.ft__tg:active{transform:scale(.99)}
.ft__tg-ic{
  width:42px;height:42px;border-radius:var(--r-pill);flex:none;
  background:#229ED9;color:#fff;display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding:0
}
.ft__tg-ic img{
  width:100%;height:100%;object-fit:cover;display:block
}
.ft__tg-ic .ic{stroke:none;fill:#fff}
.ft__tg-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.ft__tg-n{font-size:14.5px;font-weight:600}
.ft__tg-d{font-size:12px;color:var(--muted)}
.ft__tg .ic--sm{margin-left:auto;color:var(--muted2);flex:none}

.ft__bot{
  display:flex;flex-direction:column;gap:8px;align-items:flex-start;
  padding-top:22px;margin-top:10px;border-top:1px solid rgba(0,0,0,.08)
}
.ft__copy{font-size:12px;color:var(--muted);line-height:1.55}
.ft__copy b{font-weight:700;color:var(--ink);letter-spacing:.1em}
.ft__legal{
  font-size:11.5px;color:var(--muted2);line-height:1.5;min-height:0
}
.ft__legal:empty{display:none}
.ft__soc{display:flex;gap:8px;margin-top:4px}
.ft__soc:empty{display:none}
.ft__soc-b{
  width:38px;height:38px;border-radius:var(--r-pill);background:var(--card);
  border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);transition:all var(--dur) var(--ease)
}
.ft__soc-b:hover{border-color:var(--ink);color:var(--ink)}
.ft__soc-b.is-soon{opacity:.4;pointer-events:none}

/* ---- информационные страницы ---- */
.info{padding:8px var(--pad) 28px;max-width:720px;margin:0 auto}
.info__hero{
  background:var(--card);border-radius:var(--r-lg);padding:36px 22px 32px;
  margin-bottom:14px;overflow:hidden;position:relative
}
.info__hero::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 100% 0%, rgba(0,0,0,.04), transparent 60%)
}
.info__eye{
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px
}
.info__h{
  font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;
  text-transform:uppercase;margin-bottom:18px
}
.info__lead{font-size:15.5px;line-height:1.7;color:var(--ink-soft)}
.info__p{
  font-size:15px;line-height:1.75;color:var(--ink-soft);margin-top:16px
}
.info__block{
  background:var(--card);border-radius:var(--r-lg);padding:22px 20px;margin-bottom:12px
}
.info__block h2{
  font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:10px
}
.info__stub{
  font-size:14.5px;line-height:1.7;color:var(--muted);padding:8px 0 4px
}
/* ---- «О бренде» блоками: ряд фото + текст ---- */
.abt{margin:0 0 26px}
.abt:last-child{margin-bottom:0}
.abt__t{
  font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  margin:0 0 12px;line-height:1.3
}
.abt__row{
  display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 calc(var(--pad) * -1);
  padding:0 var(--pad)
}
.abt__row::-webkit-scrollbar{display:none}
.abt__ph{
  flex:0 0 auto;width:64%;max-width:280px;scroll-snap-align:start;
  padding:0;border:0;background:var(--photo);border-radius:var(--r-sm);
  overflow:hidden;cursor:zoom-in
}
.abt__row--one .abt__ph{width:100%;max-width:none}
.abt__ph img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover}
.abt__row--one .abt__ph img{aspect-ratio:auto;object-fit:contain;max-height:70vh}
.abt__cap{font-size:12.5px;color:var(--muted);line-height:1.5;margin:10px 0 0}
@media(min-width:760px){
  .abt__ph{width:calc(33.333% - 6px);max-width:none}
}
.info__vals{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.info__val{
  background:var(--card);border-radius:var(--r-lg);padding:22px 20px;
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease)
}
.info__val:hover{transform:translateY(-2px);box-shadow:var(--sh-1)}
.info__val-n{
  font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:8px
}
.info__val-t{font-size:14.5px;line-height:1.65;color:var(--ink-soft)}
.info__list{display:flex;flex-direction:column;gap:0;margin-top:4px}
.info__li{
  display:flex;align-items:flex-start;gap:12px;padding:14px 0;
  border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.55;color:var(--ink-soft)
}
.info__li:last-child{border-bottom:0}
.info__li b{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:3px}
.info__num{
  width:28px;height:28px;border-radius:var(--r-pill);background:var(--chip);
  display:flex;align-items:center;justify-content:center;flex:none;
  font-size:12px;font-weight:700;color:var(--ink)
}

/* Звёзды: каждая клипится отдельно — ряд ровный, без сдвига от gap */
.rvst{display:inline-flex;align-items:center;gap:.16em;line-height:1;vertical-align:middle}
.rvst__one{position:relative;width:1em;height:1em;flex:none;display:block}
.rvst__s{width:1em;height:1em;display:block}
.rvst__s--empty{fill:rgba(0,0,0,.12)}
.rvst__fill{position:absolute;left:0;top:0;width:0;height:100%;overflow:hidden;pointer-events:none}
.rvst__s--full{fill:var(--star)}
.rvst--xs{font-size:13px}
.rvst--sm{font-size:14px}
.rvst--lg{font-size:20px}

.card__rt{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:var(--muted2);margin-top:2px;
  max-width:100%
}
.card__rt b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card__rt-n{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:1.55em;height:1.55em;padding:0 6px;
  border-radius:999px;background:var(--chip);
  font-size:10.5px;font-weight:650;color:var(--muted);
  font-variant-numeric:tabular-nums;line-height:1
}

.pd__rate{
  display:inline-flex;align-items:center;gap:8px;margin-top:10px;
  font-size:13px;color:var(--muted);transition:opacity var(--dur) var(--ease)
}
.pd__rate:hover{opacity:.7}
.pd__rate b{color:var(--ink);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pd__rate u{text-decoration:none;color:var(--muted2)}
.pd__rate-n{
  display:inline-flex;align-items:center;height:22px;padding:0 9px;
  border-radius:999px;background:var(--chip);
  font-size:11.5px;font-weight:650;color:var(--muted)
}

.rv{background:var(--card);margin-top:8px;padding:18px var(--pad) 24px}
.rv__h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.rv__ttl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rv__cnt{font-size:12.5px;color:var(--muted)}

.rv__sum{display:flex;gap:20px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.rv__sumL{flex:none;text-align:center;width:104px}
.rv__big{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.02em;margin-bottom:6px}
.rv__rec{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.4}
.rv__bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.rv__bar{display:flex;align-items:center;gap:8px;width:100%;font-size:11.5px;color:var(--muted)}
.rv__bar-k{width:30px;text-align:right;flex:none;white-space:nowrap}
.rv__bar-r{flex:1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.rv__bar-f{display:block;height:100%;background:var(--star);border-radius:3px;transition:width .6s var(--ease)}
.rv__bar-n{width:18px;text-align:right;flex:none}
.rv__bar:hover .rv__bar-k{color:var(--ink)}

.rv__fit{margin-top:18px}
.rv__fit-t{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:11px}
.rv__fit-r{position:relative;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--line2) 0%,var(--chip) 50%,var(--line2) 100%)}
.rv__fit-m{
  position:absolute;top:50%;width:15px;height:15px;border-radius:50%;
  background:var(--ink);border:3px solid var(--card);box-shadow:var(--sh-1);
  transform:translate(-50%,-50%);transition:left .6s var(--ease)
}
.rv__fit-l{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:11.5px;color:var(--muted2)}
.rv__fit-l b{color:var(--ink);font-weight:600}

.rv__phw{margin-top:18px}
.rv__ph{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.rv__ph::-webkit-scrollbar{display:none}
.rv__ph img{width:70px;height:88px;object-fit:cover;border-radius:var(--r-sm);background:#fff;display:block}
.rv__ph button{flex:none;scroll-snap-align:start;padding:0;border:0;background:transparent}

.rv__empty{text-align:center;padding:20px 8px;color:var(--muted);font-size:13px;line-height:1.6}
.rv__empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}
.rv__list{margin-top:4px}
.rv__list--swipe{
  display:flex;gap:10px;overflow-x:auto;margin:8px calc(var(--pad) * -1) 0;
  padding:4px var(--pad) 10px;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none
}
.rv__list--swipe::-webkit-scrollbar{display:none}
.rv__list--swipe .rvi{
  flex:0 0 min(82%, 320px);scroll-snap-align:start;scroll-snap-stop:always;
  border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 12px;
  background:#fff;margin:0
}
.rv__list--swipe .rvi:last-child{border-bottom:1px solid var(--line)}
.rv__acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.rv__acts .ghb{flex:1;min-width:150px;padding:12px}
.rv__lock{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);line-height:1.4}

/* --- один отзыв --- */
.rvi{padding:16px 0;border-bottom:1px solid var(--line)}
.rvi:last-child{border-bottom:0}
.rvi__h{display:flex;gap:10px;align-items:center}
.rvi__av{
  width:34px;height:34px;border-radius:50%;background:var(--chip);flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em
}
.rvi__n{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.3}
.rvi__ok{
  display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;

  transition:all var(--dur) var(--ease)
}

/* --- форма --- */
.rvf__prod{display:flex;gap:12px;align-items:center;padding-bottom:6px}
.rvf__prod img{width:48px;height:60px;object-fit:contain;object-position:center;border-radius:var(--r-sm);background:var(--photo);flex:none}

/* --- фото на весь экран --- */
.lbox{
  position:fixed;inset:0;z-index:130;background:#0a0a0a;
  display:flex;align-items:center;justify-content:center;
  padding:calc(56px + env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom));
  animation:fadeIn .2s var(--ease);touch-action:none
}
/* Сцена под фото: сама картинка внутри двигается и масштабируется.
   Размеры задаём через inset, а не процентами: у флекс-родителя высота
   считается по содержимому, а содержимое меряется по родителю — сцена
   схлопывалась в ноль, и фото некуда было двигать. */
.lbox__stage{
  position:absolute;
  top:calc(56px + env(safe-area-inset-top));
  bottom:calc(40px + env(safe-area-inset-bottom));
  left:12px;right:12px;
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.lbox img{
  max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;border-radius:0;user-select:none;-webkit-user-drag:none;
  transform-origin:0 0;will-change:transform;cursor:zoom-in
}
/* плавность только для двойного тапа и кнопок: под пальцем она мешает */
.lbox img.is-eased{transition:transform .26s cubic-bezier(.16,1,.3,1)}
.lbox.is-zoomed img{cursor:grab}
.lbox.is-dragging img{cursor:grabbing}
/* пока увеличено — стрелки и счётчик не загораживают фото */
.lbox__nav,.lbox__n{transition:opacity .2s var(--ease)}
.lbox.is-zoomed .lbox__nav,.lbox.is-zoomed .lbox__n{opacity:0;pointer-events:none}
.lbox__k{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc(14px + env(safe-area-inset-top));
  padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);
  color:#fff;font-size:12.5px;font-weight:700;z-index:2;
  opacity:0;transition:opacity .2s var(--ease);pointer-events:none
}
.lbox.is-zoomed .lbox__k{opacity:1}
.lbox__hint{
  position:absolute;left:0;right:0;bottom:calc(44px + env(safe-area-inset-bottom));
  text-align:center;color:rgba(255,255,255,.6);font-size:12px;z-index:2;
  animation:lbHint 3.4s var(--ease) forwards;pointer-events:none
}
@keyframes lbHint{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
.lbox.is-zoomed .lbox__hint{display:none}
.lbox__x{
  position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);
  color:#fff;display:flex;align-items:center;justify-content:center;z-index:2
}
.lbox__nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);
  color:#fff;font-size:28px;line-height:1;z-index:2;
  display:flex;align-items:center;justify-content:center
}
.lbox__nav--p{left:10px}
.lbox__nav--n{right:10px}
.lbox__n{
  position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));
  text-align:center;color:rgba(255,255,255,.72);font-size:13px;font-weight:600;z-index:2
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* --- админка: отзывы --- */

/* ===================== ДЕСКТОП ===================== */
@media (min-width:760px){
  .app{max-width:100%}
  .hd{max-width:760px;margin-left:auto;margin-right:auto}
  .grid{grid-template-columns:repeat(4,1fr);gap:30px 18px;max-width:1200px;margin:0 auto;padding-left:32px;padding-right:32px}
  .crumbs,.ph,.gen,.ctrl{max-width:1200px;margin-left:auto;margin-right:auto;padding-left:32px;padding-right:32px}
  .sec,.ord,.plist,.pcard,.form,.stabs{max-width:760px;margin-left:auto;margin-right:auto}
  .pd{max-width:760px;margin:10px auto 0;height:auto;min-height:0}
  /* 3/4 под вертикальные фото одежды: с object-fit:contain квадрат оставлял
     широкие белые поля слева и справа. */
  .pd__hero{aspect-ratio:3/4;max-height:70vh;flex:none;border-radius:var(--r-lg);margin-top:12px}
  .pd__body{max-width:760px}
  .pd__extra{max-width:760px;margin:8px auto 0;border-radius:var(--r-lg)}
  .sheet{max-width:560px;border-radius:var(--r-lg);bottom:auto;top:50%;transform:translateY(-50%);animation:fadeIn .24s var(--ease)}
  .fab{right:32px}
  .ad__g2{grid-template-columns:1fr 1fr}
  .ft__inner{padding:48px 32px 28px}
  .ft__top{flex-direction:row;align-items:flex-end;justify-content:space-between}
  .ft__cols{
    display:grid;grid-template-columns:repeat(4,1fr);gap:28px 24px;
    padding-top:28px
  }
  .ft__col{border-bottom:0}
  .ft__sum{padding:0 0 14px;cursor:default;pointer-events:none}
  .ft__sum .ic{display:none}
  .ft__links,.ft__col[open] .ft__links,.ft__col:not([open]) .ft__links{
    display:flex !important;height:auto !important;opacity:1 !important;
    transform:none !important;padding:0;pointer-events:auto;overflow:visible
  }
  .ft__col[open] .ft__a,.ft__col[open] .ft__tg{animation:none}
  .ft__bot{flex-direction:row;align-items:center;justify-content:space-between;gap:20px}
  .info__h{font-size:34px}
  .info__vals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
}
@media (max-width:400px){
  :root{--pad:13px}
  .ad__g2{grid-template-columns:1fr}
  /* .ad__promo раньше сюда не попадал: кнопки забирали всю ширину,
     а текст сжимался в колонку по слову в строке */
  .ad__row,.ad__promo{flex-wrap:wrap}
  .ad__row > .ad__acts,.ad__promo > .ad__acts{width:100%;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* Скелет загрузки до первого render */
.skel{padding:0 var(--pad) 24px}
.skel__hero{
  height:168px;border-radius:var(--r-xl);margin:12px 0 18px;
  background:linear-gradient(90deg,var(--chip) 0%,#ebebeb 45%,var(--chip) 90%);
  background-size:200% 100%;animation:skel-move 1.1s ease-in-out infinite
}
.skel__row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.skel__line{
  height:14px;border-radius:8px;
  background:linear-gradient(90deg,var(--chip) 0%,#ebebeb 45%,var(--chip) 90%);
  background-size:200% 100%;animation:skel-move 1.1s ease-in-out infinite
}
.skel__grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.skel__card{
  border-radius:var(--r-lg);overflow:hidden;background:var(--card);
  box-shadow:var(--sh-1)
}
.skel__ph{
  aspect-ratio:3/4;display:block;
  background:linear-gradient(90deg,var(--photo) 0%,#e6e5e3 45%,var(--photo) 90%);
  background-size:200% 100%;animation:skel-move 1.1s ease-in-out infinite
}
.skel__meta{padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px}
@keyframes skel-move{0%{background-position:100% 0}100%{background-position:-100% 0}}
</style>

<script>
/* ==========================================================
   ОТЧЁТ ОБ ОШИБКАХ
   Сбой в скрипте покупатель не опишет — он просто закроет вкладку.
   Поэтому страница сама рассказывает о своих ошибках серверу, а тот
   пересылает их владельцу в Telegram.

   Стоит до основного скрипта: ошибку в самом магазине тоже надо поймать.
   ========================================================== */
(function(){
  var MAX = 5;                 // больше пяти сообщений за визит незачем
  var sent = 0;
  var seen = {};

  function tell(message, stack){
    try{
      if(sent >= MAX || !message) return;
      var key = String(message).slice(0, 200);
      if(seen[key]) return;      // одна и та же ошибка в цикле не нужна
      seen[key] = 1;
      sent++;

      var user = '';
      try{
        var u = JSON.parse(localStorage.getItem('shop_user_v1') || 'null');
        if(u && u.email) user = u.email;
      }catch(e){}

      var body = JSON.stringify({
        message: String(message).slice(0, 1000),
        stack: String(stack || '').slice(0, 1500),
        page: location.pathname + location.hash,
        user: user
      });
      /* keepalive: отчёт должен уйти, даже если вкладку уже закрывают */
      fetch('/api/client-error', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body,
        keepalive: true
      }).catch(function(){});
    }catch(e){}
  }

  window.addEventListener('error', function(e){
    /* у битой картинки нет message — это не ошибка скрипта, пропускаем */
    if(!e || !e.message) return;
    tell(e.message + ' (' + (e.filename || '?') + ':' + (e.lineno || 0) + ')',
      e.error && e.error.stack);
  });

  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason;
    if(!r) return;
    /* обрыв связи — это не поломка сайта, о нём говорит полоса состояния */
    if(r.offline || /Failed to fetch|NetworkError|Нет связи/i.test(r.message || '')) return;
    tell('Необработанный отказ: ' + (r.message || r), r.stack);
  });
})();
</script>

/* быстрые оттенки под кнопкой — самые ходовые в одежде */

  'Тёмно-зелёный','Тёмно-синий','Джинсовый','Голубой','Бордовый','Красный','Пудровый','Коричневый']
  .map(n => { const c = COLOR_DICT.find(x => x.n === n); return {name:c.n, hex:c.h}; });

/* «Ё» и регистр не должны мешать: сравниваем по одному виду */
const colorKey = v => String(v || '').toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]+/g, ' ').trim();
/* Код цвета в любом виде: #fff, fff, #ffffff, ffffff */
function colorHex(v){
  const raw = String(v || '').trim().replace(/^#/, '');
  if(/^[0-9a-fA-F]{3}$/.test(raw)) return '#' + raw.split('').map(c => c + c).join('').toLowerCase();
  if(/^[0-9a-fA-F]{6}$/.test(raw)) return '#' + raw.toLowerCase();
  return '';
}
/** Текст → цвет. Понимает код, точное имя, начало имени и слово внутри
    более длинного названия («тёмный беж», «синий меланж»).
    loose:true — оттенок нашли по слову, значит имя лучше оставить авторское. */
function colorResolve(text){
  const hex = colorHex(text);
  if(hex) return {name: colorNearest(hex), hex, code: true};
  const k = colorKey(text);
  if(!k) return null;
  const find = key =>
    COLOR_DICT.find(c => colorKey(c.n) === key || (c.a || []).some(a => colorKey(a) === key)) ||
    COLOR_DICT.find(c => colorKey(c.n).startsWith(key) || (c.a || []).some(a => colorKey(a).startsWith(key)));
  const hit = find(k);
  if(hit) return {name: hit.n, hex: hit.h};
  for(const word of k.split(' ')){
    if(word.length < 3) continue;
    const w = find(word);
    if(w) return {name: w.n, hex: w.h, loose: true};
  }
  return null;
}
/** Подсказки под полем: до шести подходящих названий. */
function colorSuggest(text){
  const k = colorKey(text);
  if(!k) return [];
  if(colorHex(text)) return [];
  const starts = [], has = [];
  COLOR_DICT.forEach(c => {
    const keys = [colorKey(c.n), ...(c.a || []).map(colorKey)];
    if(keys.some(x => x.startsWith(k))) starts.push(c);
    else if(keys.some(x => x.includes(k))) has.push(c);
  });
  return [...starts, ...has].slice(0, 6).map(c => ({name: c.n, hex: c.h}));
}
/** Ближайшее название по оттенку — чтобы у ручного цвета было понятное имя. */
function colorNearest(hex){
  const a = hexRgb(hex);
  if(!a) return String(hex || '').toUpperCase();
  let best = null, bestD = Infinity;
  COLOR_DICT.forEach(c => {
    const b = hexRgb(c.h);
    const d = (a.r - b.r) ** 2 + (a.g - b.g) ** 2 + (a.b - b.b) ** 2;
    if(d < bestD){ bestD = d; best = c; }
  });
  return best ? best.n : String(hex).toUpperCase();
}
function hexRgb(hex){
  const h = colorHex(hex);
  if(!h) return null;
  return {r: parseInt(h.slice(1,3),16), g: parseInt(h.slice(3,5),16), b: parseInt(h.slice(5,7),16)};
}
/* Светлота 0..1 — по ней решаем, нужна ли рамка вокруг светлого кружка */
function hexLuma(hex){
  const c = hexRgb(hex);
  if(!c) return 0;
  return (0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b) / 255;
}
function rgbToHsv(hex){
  const c = hexRgb(hex) || {r:0,g:0,b:0};
  const r = c.r/255, g = c.g/255, b = c.b/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
  let h = 0;
  if(d){
    if(max === r)      h = 60 * (((g - b) / d) % 6);
    else if(max === g) h = 60 * ((b - r) / d + 2);
    else               h = 60 * ((r - g) / d + 4);
  }
  if(h < 0) h += 360;
  return {h, s: max ? d / max : 0, v: max};
}
function hsvToHex({h, s, v}){
  const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
  const t = h < 60 ? [c,x,0] : h < 120 ? [x,c,0] : h < 180 ? [0,c,x]
          : h < 240 ? [0,x,c] : h < 300 ? [x,0,c] : [c,0,x];
  return '#' + t.map(n => Math.round((n + m) * 255).toString(16).padStart(2, '0')).join('');
}

/* ==========================================================
   ОСТАТКИ
   Админка заполняет p.stock = {S:3, M:0, ...}. Витрина читает
   их отсюда, чтобы нельзя было купить то, чего нет на складе.
   Товар без размеров и без stock считаем безлимитным.
   ========================================================== */
const STOCK_ANY = Infinity;

function stockOf(p, size){
  if(!p || !p.stock || !Object.keys(p.stock).length) return STOCK_ANY;
  const v = p.stock[size];
  /* Если карта склада есть, отсутствующий размер = 0 (как на сервере) */
  return v == null ? 0 : Math.max(0, +v || 0);
}
function stockTotal(p){
  if(!p || !p.stock || !Object.keys(p.stock).length) return STOCK_ANY;
  return Object.values(p.stock).reduce((s,n) => s + Math.max(0, +n || 0), 0);
}
const soldOut = p => stockTotal(p) <= 0;
/* первый размер, который реально есть на складе */
function firstSize(p){
  const list = (p && p.sizes) || [];
  return list.find(s => stockOf(p, s) > 0) || list[0] || null;
}
/* сколько штук этого размера уже лежит в корзине */
function inCartQty(p, size){
  return S.cart.filter(x => x.id === p.id && x.size === size)
               .reduce((s, x) => s + x.qty, 0);
}
const canAddMore = (p, size) => inCartQty(p, size) < stockOf(p, size);
/** Сколько штук этого размера ещё можно положить в корзину. */
function maxAddQty(p, size){
  const left = stockOf(p, size) - inCartQty(p, size);
  if(left === Infinity) return 20;          // склад не ведут — разумный потолок
  return Math.max(0, Math.min(20, left));
}
/** Количество не должно пережить смену размера или товара. */
function clampQty(p, size){
  const max = maxAddQty(p, size);
  S.qty = Math.min(Math.max(1, +S.qty || 1), Math.max(1, max));
  return max;
}

const RV_KEY   = 'shop_reviews_v1';

];

                   'июля','августа','сентября','октября','ноября','декабря'];

let REVIEWS = [];
let rvSeq   = 1;

let rvVotes = [];

function rvLoad(){
  const arr = k => { try{ const r = JSON.parse(localStorage.getItem(k)); return Array.isArray(r) ? r : []; }catch(e){ return []; } };
  REVIEWS = arr(RV_KEY);
  rvMine  = arr(RV_MINE);
  rvVotes = arr(RV_VOTES);
  const withSku = REVIEWS.filter(r => String(r.sku || '').trim());
  if(withSku.length !== REVIEWS.length){
    const keepIds = new Set(withSku.map(r => r.id));
    REVIEWS = withSku;
    rvMine = rvMine.filter(id => keepIds.has(id));
    rvVotes = rvVotes.filter(id => keepIds.has(id));
    try{
      localStorage.setItem(RV_KEY, JSON.stringify(REVIEWS));
      localStorage.setItem(RV_MINE, JSON.stringify(rvMine));
      localStorage.setItem(RV_VOTES, JSON.stringify(rvVotes));
    }catch(e){}

  rvSeq   = REVIEWS.reduce((m,r) => Math.max(m, +r.id || 0), 0) + 1;
}
function dropReviewsForPid(pid){
  const id = +pid;
  const gone = new Set(REVIEWS.filter(r => +r.pid === id).map(r => r.id));
  if(!gone.size) return;
  REVIEWS = REVIEWS.filter(r => +r.pid !== id);
  rvMine = rvMine.filter(x => !gone.has(x));
  rvVotes = rvVotes.filter(x => !gone.has(x));

}

function reviewBelongsToProduct(r, p){
  if(!r || !p) return false;
  if(+r.pid !== +p.id) return false;
  const rs = String(r.sku || '').trim();
  const ps = productSkuOf(p);
  return !!(rs && ps && rs === ps);
}
function cartLineBelongs(i, p){
  if(!i || !p) return false;
  if(+i.id !== +p.id) return false;
  const cs = String(i.sku || '').trim();
  const ps = productSkuOf(p);
  return !!(cs && ps && cs === ps);
}
function wipeStaleBrowserJunk(){
  const FLAG = 'shop_wipe_stale_v2';
  try{
    if(localStorage.getItem(FLAG) === '1') return false;
    localStorage.setItem(FLAG, '1');
    localStorage.removeItem('shop_wipe_stale_v1');
  }catch(e){ return false; }
  S.cart = [];
  S.favs = [];
  S.lastOrder = null;
  S.orderSeen = {};
  S.orderSeenInit = false;
  ORDERS.length = 0;
  REVIEWS = [];
  rvMine = [];
  rvVotes = [];
  rvSeq = 1;
  PRODUCTS = [];
  try{
    localStorage.removeItem('shop_reviews_v1');
    localStorage.removeItem('shop_reviews_mine_v1');
    localStorage.removeItem('shop_reviews_votes_v1');
    localStorage.removeItem('shop_v3');
  }catch(e){}
  rvSave();
  saveUser();
  return true;
}
function pruneStaleClientData(){
  let dirty = false;
  const keepRv = REVIEWS.filter(r => reviewBelongsToProduct(r, PRODUCTS.find(p => +p.id === +r.pid)));
  if(keepRv.length !== REVIEWS.length){
    const keepIds = new Set(keepRv.map(r => r.id));
    REVIEWS = keepRv;
    rvMine = rvMine.filter(id => keepIds.has(id));
    rvVotes = rvVotes.filter(id => keepIds.has(id));
    dirty = true;
    rvSave();
  }
  const nextCart = (S.cart || []).filter(i => cartLineBelongs(i, PRODUCTS.find(p => +p.id === +i.id)));
  if(nextCart.length !== (S.cart || []).length){
    S.cart = nextCart;
    dirty = true;
  }
  const ids = new Set(PRODUCTS.map(p => +p.id));
  const nextFavs = (S.favs || []).filter(id => ids.has(+id));
  if(nextFavs.length !== (S.favs || []).length){
    S.favs = nextFavs;
    dirty = true;
  }
  if(dirty) saveUser();
  return dirty;
}
function rvSave(){
  try{
    localStorage.setItem(RV_KEY, JSON.stringify(REVIEWS));
    localStorage.setItem(RV_MINE, JSON.stringify(rvMine));
    localStorage.setItem(RV_VOTES, JSON.stringify(rvVotes));
    return true;
  }catch(e){
    toast('В браузере кончилось место — попробуйте отзыв без фото');
    return false;
  }
}

/* --- настройки из админки --- */
const rvCfg = () => (typeof CMS !== 'undefined' && CMS.reviews) || {moderate:false, buyersOnly:false};

/* --- выборки и агрегаты --- */
const rvOk   = r => r.status === 'ok';
const rvAll  = pid => REVIEWS.filter(r => reviewBelongsToProduct(r, (PRODUCTS || []).find(x => +x.id === +pid)));
const rvList = pid => rvAll(pid).filter(rvOk);
const rvNum  = v => Number(v).toFixed(1).replace('.', ',');
const rvDate = ts => { const d = new Date(ts); return `${d.getDate()} ${RV_MONTHS[d.getMonth()]} ${d.getFullYear()}`; };

function rvStats(pid){
  const list = rvList(pid);
  const dist = [0,0,0,0,0];
  let sum = 0, rec = 0, fitSum = 0, fitN = 0;
  const photos = [];
  list.forEach(r => {
    const n = Math.min(5, Math.max(1, +r.rating || 0));
    dist[n-1]++; sum += n;
    if(n >= 4) rec++;
    if(r.fit != null){ fitSum += +r.fit; fitN++; }
    (r.photos || []).forEach(ph => photos.push({src:ph, id:r.id}));
  });
  return {
    list, n:list.length, dist, photos,
    avg: list.length ? sum / list.length : 0,
    rec: list.length ? Math.round(rec / list.length * 100) : 0,
    fit: fitN ? fitSum / fitN : null
  };
}

function rvSort(list, k){
  const a = list.slice();
  const byNew = (x,y) => y.ts - x.ts;
  if(k === 'new')       a.sort(byNew);
  else if(k === 'high') a.sort((x,y) => y.rating - x.rating || byNew(x,y));
  else if(k === 'low')  a.sort((x,y) => x.rating - y.rating || byNew(x,y));
  else if(k === 'photo')a.sort((x,y) => (y.photos||[]).length - (x.photos||[]).length || byNew(x,y));
  else                  a.sort((x,y) => (y.useful||0) - (x.useful||0) || byNew(x,y));
  return a;
}

/* Покупал ли этот товар — по своим заказам. Отменённые не считаем. */
function rvBought(pid, delivered){
  return ORDERS.some(o => o.status !== 'Отменён' &&
    (!delivered || o.status === 'Доставлен') &&
    (o.items || []).some(i => i.id === pid));
}
/* Размер из последней покупки — чтобы не заставлять выбирать заново. */
function rvBoughtSize(pid){
  for(const o of ORDERS){
    const it = (o.items || []).find(i => i.id === pid);
    if(it) return it.size;
  }
  return '';
}
function rvCanWrite(pid){
  return rvBought(pid, false);
}
function rvHasMine(pid){
  return rvAll(pid).some(rvIsMine);
}
const rvIsMine = r => !!(r && (r.mine || rvMine.includes(r.id) ||
  (S.user && r.email && r.email.toLowerCase() === String(S.user.email||'').toLowerCase())));

function rvStars(v, mod){
  const val = Math.max(0, Math.min(5, Number(v) || 0));
  const path = 'M12 2.8c.42 0 .8.24 1 .62l2.05 4.38 4.72.53c.96.11 1.35 1.28.62 1.9l-3.56 3.22 1.06 4.86c.21.97-.82 1.7-1.63 1.2L12 17.85l-4.26 2.66c-.81.5-1.84-.23-1.63-1.2l1.06-4.86-3.56-3.22c-.73-.62-.34-1.79.62-1.9l4.72-.53 2.05-4.38c.2-.38.58-.62 1-.62z';
  const svgStar = cls => `<svg class="rvst__s ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"/></svg>`;
  const cells = [0,1,2,3,4].map(i => {
    const fill = Math.round(Math.max(0, Math.min(1, val - i)) * 100);
    return `<span class="rvst__one">${svgStar('rvst__s--empty')}` +
      `<span class="rvst__fill" style="width:${fill}%">${svgStar('rvst__s--full')}</span></span>`;
  }).join('');
  return `<span class="rvst${mod ? ' rvst--' + mod : ''}" role="img" aria-label="Оценка ${rvNum(v)} из 5">${cells}</span>`;
}
const rvInitials = n => String(n || '?').trim().split(/\s+/).slice(0,2).map(w => w[0] || '').join('').toUpperCase();

/* Фото во весь экран (товар / отзывы) */
let _lboxKey = null;
let _lboxHintShown = false;
function openLightbox(srcs, startIdx){
  const list = (Array.isArray(srcs) ? srcs : [srcs]).map(String).filter(Boolean);
  if(!list.length) return;
  document.querySelectorAll('.lbox').forEach(el => el.remove());
  if(_lboxKey){ document.removeEventListener('keydown', _lboxKey); _lboxKey = null; }

  let i = Math.max(0, Math.min(list.length - 1, +startIdx || 0));
  const w = document.createElement('div');
  w.className = 'lbox';
  w.setAttribute('role', 'dialog');
  w.setAttribute('aria-modal', 'true');
  w.setAttribute('aria-label', 'Просмотр фото');

  const close = () => {
    w.remove();
    if(_lboxKey){ document.removeEventListener('keydown', _lboxKey); _lboxKey = null; }
    document.body.style.overflow = '';
  };
  /* ---------- увеличение фото ----------
     k — во сколько раз увеличено, tx/ty — сдвиг картинки внутри сцены.
     Всё считается вручную, без библиотек: щипок двумя пальцами, двойной
     тап, колесо мыши и перетаскивание увеличенного фото. */
  const MAX_K = 5;
  let k = 1, tx = 0, ty = 0, img = null;

  const stage = () => w.querySelector('.lbox__stage');

  const apply = (eased) => {
    if(!img) return;
    img.classList.toggle('is-eased', !!eased);
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
    w.classList.toggle('is-zoomed', k > 1.01);
    const kb = w.querySelector('.lbox__k');
    if(kb) kb.textContent = (Math.round(k * 10) / 10).toString().replace(/\.0$/, '') + '×';
  };

  /* Держим фото в кадре: пустых полей по краям быть не должно. */
  const clamp = () => {
    const st = stage();
    if(!st || !img) return;
    const baseX = (st.clientWidth - img.clientWidth) / 2;
    const baseY = (st.clientHeight - img.clientHeight) / 2;
    const overX = Math.max(0, (img.clientWidth * k - st.clientWidth) / 2);
    const overY = Math.max(0, (img.clientHeight * k - st.clientHeight) / 2);
    tx = Math.min(baseX + overX, Math.max(baseX - overX, tx));
    ty = Math.min(baseY + overY, Math.max(baseY - overY, ty));
  };

  const reset = (eased) => {
    const st = stage();
    if(!st || !img) return;
    k = 1;
    tx = (st.clientWidth - img.clientWidth) / 2;
    ty = (st.clientHeight - img.clientHeight) / 2;
    apply(eased);
  };

  /** Увеличиваем вокруг точки, на которую смотрят, а не вокруг угла. */
  const zoomAt = (nk, px, py, eased) => {
    const st = stage();
    if(!st || !img) return;
    nk = Math.min(MAX_K, Math.max(1, nk));
    const r = st.getBoundingClientRect();
    const cx = px - r.left, cy = py - r.top;
    const ratio = nk / k;
    tx = cx - (cx - tx) * ratio;
    ty = cy - (cy - ty) * ratio;
    k = nk;
    if(k <= 1.01){ reset(true); return; }
    clamp();
    apply(eased);
  };

  const go = (step) => { i = (i + step + list.length) % list.length; paint(); };

  const paint = () => {
    w.innerHTML = `
      <button class="lbox__x" type="button" aria-label="Закрыть">${svg('x')}</button>
      ${list.length > 1 ? `<button class="lbox__nav lbox__nav--p" type="button" aria-label="Назад">‹</button>
      <button class="lbox__nav lbox__nav--n" type="button" aria-label="Вперёд">›</button>` : ''}
      <span class="lbox__k">1×</span>
      <div class="lbox__stage"><img src="${esc(list[i])}" alt="Фото ${i + 1} из ${list.length}"></div>
      ${list.length > 1 ? `<p class="lbox__n">${i + 1} / ${list.length}</p>` : ''}
      ${_lboxHintShown ? '' : '<p class="lbox__hint">Двойное касание или колесо — приблизить</p>'}`;
    _lboxHintShown = true;
    w.classList.remove('is-zoomed', 'is-dragging');

    w.querySelector('.lbox__x').onclick = e => { e.stopPropagation(); close(); };
    const prev = w.querySelector('.lbox__nav--p');
    const next = w.querySelector('.lbox__nav--n');
    if(prev) prev.onclick = e => { e.stopPropagation(); go(-1); };
    if(next) next.onclick = e => { e.stopPropagation(); go(1); };

    img = w.querySelector('img');
    if(!img) return;
    k = 1; tx = 0; ty = 0;
    const place = () => reset(false);
    if(img.complete && img.naturalWidth) place(); else img.onload = place;
    img.onclick = e => e.stopPropagation();
    img.ondblclick = e => {
      e.stopPropagation();
      if(k > 1.01) reset(true); else zoomAt(2.6, e.clientX, e.clientY, true);
    };
  };

  /* --- жесты. Обработчики вешаем один раз на окно, а не на картинку:
         при листании она пересоздаётся. --- */
  const pts = new Map();
  let pinchStartDist = 0, pinchStartK = 1;
  let swipeFromX = 0, movedPath = 0, lastTapAt = 0;

  const twoDist = () => {
    const a = [...pts.values()];
    return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
  };
  const twoMid = () => {
    const a = [...pts.values()];
    return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 };
  };

  w.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(k * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY, false);
  }, { passive: false });

  w.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pts.size === 1){
      swipeFromX = e.clientX;
      movedPath = 0;
      w.classList.add('is-dragging');
      try{ w.setPointerCapture(e.pointerId); }catch(_){}
    }
    if(pts.size === 2){ pinchStartDist = twoDist(); pinchStartK = k; }
  });

  w.addEventListener('pointermove', e => {
    const was = pts.get(e.pointerId);
    if(!was) return;
    const dx = e.clientX - was.x, dy = e.clientY - was.y;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    movedPath += Math.abs(dx) + Math.abs(dy);

    if(pts.size >= 2 && pinchStartDist > 0){
      const m = twoMid();
      zoomAt(pinchStartK * (twoDist() / pinchStartDist), m.x, m.y, false);
      return;
    }
    if(pts.size === 1 && k > 1.01){
      tx += dx; ty += dy;
      clamp();
      apply(false);
    }
  });

  const liftUp = e => {
    const wasCount = pts.size;
    pts.delete(e.pointerId);
    if(pts.size < 2) pinchStartDist = 0;
    if(pts.size === 0) w.classList.remove('is-dragging');
    if(wasCount !== 1) return;

    /* двойной тап пальцем: dblclick на мобильных срабатывает не везде */
    if(movedPath < 10){
      const now = Date.now();
      if(now - lastTapAt < 300){
        lastTapAt = 0;
        if(k > 1.01) reset(true); else zoomAt(2.6, e.clientX, e.clientY, true);
        return;
      }
      lastTapAt = now;
      /* одиночный тап по фону закрывает — но только если не увеличено */
      const target = e.target;
      setTimeout(() => {
        if(lastTapAt && k <= 1.01 && (target === w || target === stage())) close();
      }, 310);
      return;
    }
    /* горизонтальный свайп листает, пока фото не увеличено */
    if(k <= 1.01 && list.length > 1){
      const dx = e.clientX - swipeFromX;
      if(Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
    }
  };
  w.addEventListener('pointerup', liftUp);
  w.addEventListener('pointercancel', liftUp);
  window.addEventListener('resize', () => { if(k <= 1.01) reset(false); else { clamp(); apply(false); } });

  /* закрытие по касанию фона обрабатывается в liftUp — так одиночный тап
     не мешает двойному и перетаскиванию увеличенного фото */
  document.body.style.overflow = 'hidden';
  document.body.appendChild(w);
  paint();

  _lboxKey = e => {
    if(e.key === 'Escape') close();
    if(e.key === 'ArrowLeft' && list.length > 1){ i = (i - 1 + list.length) % list.length; paint(); }
    if(e.key === 'ArrowRight' && list.length > 1){ i = (i + 1) % list.length; paint(); }
  };
  document.addEventListener('keydown', _lboxKey);

  /* свайп */
  let x0 = null;
  w.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, { passive:true });
  w.addEventListener('touchend', e => {
    if(x0 == null || list.length < 2) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if(Math.abs(dx) < 40) return;
    i = dx > 0 ? (i - 1 + list.length) % list.length : (i + 1) % list.length;
    paint();
  }, { passive:true });
}

function rvBindForm(p){
