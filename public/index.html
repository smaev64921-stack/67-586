function buyerOrderFingerprint(){
  return (ORDERS || []).map(o => [o.num, o.status, o.payStatus, o.now, o.track || o.tracking || '', o.addr || ''].join('|')).join(';');
}
function adminOrderFingerprint(){
  return (ADMIN_ORDERS || []).map(o => [o.num, o.status, o.payStatus, o.now, o.track || o.tracking || '', o.note || '', o.addr || ''].join('|')).join(';');
}
function applyAdminOrders(remote){
  ADMIN_ORDERS.length = 0;
  (remote || []).forEach(o => ADMIN_ORDERS.push(normalizeServerOrder(o)));
}
function repaintBuyerOrderUi(){
  const title = ov.querySelector('.modal[aria-label="Заказ"] .modal__t');
  const m = title && /№\s*(.+)$/.exec(String(title.textContent || '').trim());
  const openNum = m ? m[1].trim() : '';
  if(openNum && ORDERS.some(o => String(o.num) === String(openNum))){
    openOv(orderModal(openNum));
    startPayTimers();
  }
  if(['orders','profile','done','notif'].includes(S.screen)) render(true);
  else renderTabs();
}
async function pullOrderByNum(num){
  if(!window.LC || !num) return null;
  const tok = (LC.orderToken && LC.orderToken(num)) || '';
  const fresh = normalizeServerOrder(await LC.getOrder(num, false, tok));
  if(!fresh) return null;
  const i = ORDERS.findIndex(x => String(x.num) === String(fresh.num));
  if(i >= 0) ORDERS[i] = Object.assign({}, ORDERS[i], fresh);
  else ORDERS.unshift(fresh);
  if(S.lastOrder && String(S.lastOrder.num) === String(fresh.num)) S.lastOrder = ORDERS.find(x => String(x.num) === String(fresh.num)) || fresh;
  return fresh;
}
async function refreshMyOrders(rerender, opts){
  const onlyIfChanged = !!(opts && opts.onlyIfChanged);
  if(!window.LC) return false;
  const before = buyerOrderFingerprint();
  try{
    const guestNums = [];
    if(S.user){
      const remote = await LC.myOrders();
      if(Array.isArray(remote)){
        const leftover = new Map((ORDERS || []).map(o => [String(o.num), o]));
        ORDERS.length = 0;
        remote.forEach(o => {
          const n = normalizeServerOrder(o);
          ORDERS.push(n);
          leftover.delete(String(n.num));
        });
        leftover.forEach((o, num) => {
          if(isMineOrder(o) && LC.orderToken && LC.orderToken(num)){
            ORDERS.push(o);
            guestNums.push(num);
          }
        });
      }
    } else {
      (ORDERS || []).forEach(o => { if(o && o.num) guestNums.push(o.num); });
    }
    await Promise.all(guestNums.map(async num => {
      try{ await pullOrderByNum(num); }catch(_){}
    }));
    if(S.lastOrder && S.lastOrder.num){
      const live = ORDERS.find(x => String(x.num) === String(S.lastOrder.num));
      if(live) S.lastOrder = live;
    }
    const after = buyerOrderFingerprint();
    const changed = before !== after;
    if(changed) saveUser();
    if(rerender && (!onlyIfChanged || changed)) repaintBuyerOrderUi();
    return true;
  }catch(e){
    return false;
  }
}

        : (e.message || 'Не удалось загрузить заказы')

  }
}

/* Кружок летит по дуге от одной точки к другой.
   Web Animations API — чтобы задать среднюю точку и получить дугу,
   обычным CSS-переходом так не сделать. */
function fly(fromEl, toEl, img, reverse){
  if(!fromEl || !toEl) return;
  const a = fromEl.getBoundingClientRect();
  const b = toEl.getBoundingClientRect();
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  const bx = b.left + b.width / 2, by = b.top + b.height / 2;

  const dot = document.createElement('div');
  dot.className = 'fly';
  dot.style.left = (ax - 17) + 'px';
  dot.style.top  = (ay - 17) + 'px';
  if(img) dot.style.backgroundImage = `url("${img}")`;
  document.body.appendChild(dot);

  const dx = bx - ax, dy = by - ay;
  const lift = reverse ? 70 : -90;          // дуга вверх при полёте в корзину
  const anim = dot.animate([
    {transform:'translate(0,0) scale(1)', opacity:1},
    {transform:`translate(${dx * .5}px, ${dy * .5 + lift}px) scale(${reverse ? 1.05 : .82})`,
     opacity:1, offset:.55},
    {transform:`translate(${dx}px, ${dy}px) scale(${reverse ? 1.15 : .28})`, opacity:reverse ? 1 : .35}
  ], {duration:620, easing:'cubic-bezier(.35,.05,.25,1)'});

  anim.onfinish = () => {
    dot.remove();
    if(!reverse) toEl.classList.add('hit'), setTimeout(() => toEl.classList.remove('hit'), 440);
  };
}

/* ==========================================================
   СОСТОЯНИЕ СВЯЗИ
   Сайт продолжает работать на уже загруженных данных: полоса только
   объясняет, что происходит, и сама исчезает, когда связь вернулась.
   ========================================================== */
const NET = (() => {
  const box = () => document.getElementById('net');
  let state = 'ok';
  let fails = 0;
  let slow = 0;
  let backTimer = 0;
  let hideTimer = 0;

  const VIEW = {
    offline: {cls:'net--off',  ic:'info', t:'Нет соединения. Показываем то, что уже загружено — как только сеть вернётся, продолжим.'},
    slow:    {cls:'net--slow', ic:'info', t:'Медленное соединение. Страница работает, фото догрузятся позже.'},
    back:    {cls:'net--back', ic:'check', t:'Связь восстановлена.'}
  };

  function paint(next){
    const el = box();
    if(!el) return;
    clearTimeout(hideTimer);
    if(!next){
      if(el.hidden) return;
      /* уезжает тем же переходом, что и приезжала: прячем только после него */
      el.classList.remove('is-on');
      document.body.classList.remove('has-net');
      hideTimer = setTimeout(() => {
        el.hidden = true; el.className = 'net'; el.innerHTML = '';
      }, 520);
      return;
    }
    const v = VIEW[next];
    /* плашка уже на экране — меняем только содержимое, заново не выезжает */
    const shown = el.classList.contains('is-on');
    el.hidden = false;
    el.className = 'net ' + v.cls + (shown ? ' is-on' : '');
    el.innerHTML = `<span class="net__ic">${svg(v.ic,'ic ic--sm')}</span>` +
      `<span class="net__t">${v.t}</span><span class="net__bar"></span>`;
    document.body.classList.add('has-net');
    /* принудительный пересчёт: браузер должен увидеть стартовое положение,
       иначе перехода не будет. requestAnimationFrame тут не годится — во
       вкладке на фоне кадры не рисуются, и плашка так и не выехала бы. */
    if(!shown){ void el.offsetWidth; el.classList.add('is-on'); }
  }

  function set(next){
    if(next === state) return;
    const was = state;
    state = next;
    clearTimeout(backTimer);
    if(next === 'ok'){
      /* «связь появилась» показываем только если до этого было плохо */
      if(was === 'offline' || was === 'slow'){
        paint('back');
        backTimer = setTimeout(() => paint(null), 2600);
      } else paint(null);
      return;
    }
    paint(next);
  }

  window.addEventListener('lc:net', e => {
    const d = e.detail || {};
    if(d.state === 'offline'){
      fails++; slow = 0;
      if(fails >= 2 || !navigator.onLine) set('offline');
      return;
    }
    if(d.state === 'slow'){
      fails = 0; slow++;
      if(slow >= 2) set('slow');
      return;
    }
    fails = 0; slow = 0; set('ok');
  });
  window.addEventListener('offline', () => { fails = 2; set('offline'); });
  window.addEventListener('online', () => {
    fails = 0; slow = 0;
    set('ok');
    /* сеть вернулась — сразу подтягиваем свежие данные, не ждём тика */
    try{ if(window.__lcPullLive) window.__lcPullLive(); }catch(_){}
  });

  return {
    set,
    get state(){ return state; },
    offline(){ return state === 'offline'; }
  };
})();

let npTarget = null;
/* Каретка. Поле readonly — курсор рисуем сами и ставим сразу за текстом.
   Ширину текста меряем канвасом тем же шрифтом, что и у поля. */
let npCv = null;
function npTextW(el, txt){
  if(!txt) return 0;
  npCv = npCv || document.createElement('canvas');
  const c = npCv.getContext('2d');
  const cs = getComputedStyle(el);

  return c.measureText(txt).width;
}
function npCaret(){

    const pad = parseFloat(getComputedStyle(el).paddingLeft) || 12;
    const x   = pad + 1 + npTextW(el, el.value);
    car.style.left = Math.min(x, Math.max(pad, el.clientWidth - 6)) + 'px';
  });
}
function npOpen(id){

function sheetQuickAdd(id){
  const p = byId(id);
  if(!p) return;
  if(soldOut(p)) return toast('Нет в наличии');
  /* тот же принцип, что и в карточке: нулевой размер не показываем */
  const all = p.sizes || [];
  const sizes = all.filter(s => stockOf(p, s) > 0);
  if(all.length && !sizes.length) return toast('Нет в наличии');
  if(!sizes.length){
    S.size = 'ONESIZE';
    addFromCard(p, null);
    return;
  }
  /* размеры, уже лежащие в корзине, отмечены — их можно и снять */
  const inCartSizes = S.cart.filter(x => x.id === p.id).map(x => x.size);
  /* сколько штук каждого размера. Для лежащих в корзине — их же количество,
     чтобы шторка не сбрасывала набранное молча. */
  const qty = {};
  sizes.forEach(s => {
    const left = stockOf(p, s);
    const max = left === STOCK_ANY ? 20 : Math.max(1, Math.min(20, left));
    qty[s] = Math.min(max, Math.max(1, inCartQty(p, s) || 1));
  });
  const capOf = s => {
    const left = stockOf(p, s);
    return left === Infinity ? 20 : Math.max(1, Math.min(20, left));
  };

  openOv(`<div class="scrim"></div><div class="sheet" role="dialog" aria-label="Размер и количество">
    <div class="sheet__g"></div>
    <div class="sheet__h"><span class="sheet__t">Размер и количество</span>
      <button class="hd__b" data-x aria-label="Закрыть">${svg('x')}</button></div>
    <div class="sheet__b">
      <p style="font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.45">${p.name} · можно отметить несколько</p>
      <div class="qsize" id="qsRow">
        ${sizes.map(s => `<button class="qsize__b" data-qs="${s}"
          aria-pressed="${inCartSizes.includes(s) ? 'true' : 'false'}">${s}</button>`).join('')}
      </div>
      <div class="qlines" id="qsLines"></div>
      <button class="btn" id="qsGo" style="margin-top:16px">Добавить в корзину</button>
    </div></div>`);

  const row = document.getElementById('qsRow');
  const lines = document.getElementById('qsLines');
  const go = document.getElementById('qsGo');
  const picked = () => [...row.querySelectorAll('[aria-pressed="true"]')].map(b => b.dataset.qs);

  const paint = () => {
    const list = picked();
    lines.innerHTML = list.map(s => {
      const cap = capOf(s);
      return `<div class="qline">
        <span class="qline__s">Размер ${s}</span>
        <span class="qty">
          <button data-qq="${s}" data-qd="-1" aria-label="Меньше" ${qty[s] <= 1 ? 'disabled' : ''}>−</button>
          <span>${qty[s]}</span>
          <button data-qq="${s}" data-qd="1" aria-label="Больше" ${qty[s] >= cap ? 'disabled' : ''}>+</button>
        </span>
        <span class="qline__p">${money(p.price * qty[s])}</span>
      </div>`;
    }).join('');
    const total = list.reduce((n, s) => n + qty[s], 0);
    const verb = inCartSizes.length ? 'Сохранить' : 'Добавить в корзину';
    go.textContent = total
      ? `${verb} · ${total} шт · ${money(p.price * total)}`
      : (inCartSizes.length ? 'Убрать из корзины' : 'Выберите размер');
    go.disabled = !total && !inCartSizes.length;
  };

  row.onclick = e => {
    const b = e.target.closest('[data-qs]');
    if(!b) return;
    b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    paint();
  };
  lines.onclick = e => {
    const b = e.target.closest('[data-qq]');
    if(!b || b.disabled) return;
    const s = b.dataset.qq;
    qty[s] = Math.max(1, Math.min(capOf(s), (qty[s] || 1) + (+b.dataset.qd)));
    paint();
  };
  go.onclick = () => quickAddSizes(p, picked(), inCartSizes, qty);
  paint();
}

/** Синхронизирует корзину с отмеченными размерами: отмеченные добавляет
    (в указанном количестве), снятые убирает. */
function quickAddSizes(p, sizes, before, qty){
  const cap = s => {
    const left = stockOf(p, s);
    return left === STOCK_ANY ? 20 : Math.max(1, Math.min(20, left));
  };
  /* не даём попросить больше, чем есть на складе */
  const q = s => Math.min(cap(s), Math.max(1, (qty && +qty[s]) || 1));
  const add = sizes.filter(s => !before.includes(s));
  const drop = before.filter(s => !sizes.includes(s));
  let changed = 0;
  drop.forEach(s => { S.cart = S.cart.filter(x => !(x.id === p.id && x.size === s)); });
  sizes.forEach(s => {
    /* В шторке одно число на размер, а строк с этим размером может быть
       несколько (разные цвета). Поэтому трактуем его как ИТОГ по размеру и
       подгоняем строки под него: раньше итог записывался в первую строку, и
       «Сохранить» без единой правки раздувало количество. */
    const lines = S.cart.filter(x => x.id === p.id && x.size === s);
    const want = q(s);
    if(!lines.length){
      S.cart.push({key:p.id + '-' + s, id:p.id, sku:p.sku || '', name:p.name,
        img:p.img, price:p.price, size:s, qty:want});
      return;
    }
    let have = lines.reduce((n, l) => n + (+l.qty || 0), 0);
    if(have === want) return;
    if(have < want){
      lines[0].qty += want - have;
      changed++;
      return;
    }
    /* убрать лишнее — с конца, чтобы первая (обычно основная) строка уцелела */
    for(let i = lines.length - 1; i >= 0 && have > want; i--){
      const canDrop = Math.min(lines[i].qty - (i === 0 ? 1 : 0), have - want);
      if(canDrop > 0){ lines[i].qty -= canDrop; have -= canDrop; changed++; }
      if(i > 0 && lines[i].qty <= 0){
        S.cart = S.cart.filter(x => x !== lines[i]);
      }
    }
  });
  closeOv();
  saveUser();
  renderTabs();
  refreshCardBuys();
  if(add.length) toast(`В корзине · ${add.map(s => s + (q(s) > 1 ? ` (${q(s)} шт)` : '')).join(', ')}`);
  else if(drop.length) toast('Убрано из корзины');
  else if(changed) toast('Количество обновлено');
}

function addFromCard(p, btn, qty){
  const key = p.id + '-' + S.size;
  const n = Math.max(1, +qty || 1);
  if(S.cart.some(x => x.key === key)){
    toast('Уже в корзине · размер ' + S.size);
    closeOv();
    return;
  }
  S.cart.push({key, id:p.id, sku:p.sku || '', name:p.name, img:p.img, price:p.price, size:S.size, qty:n});
  closeOv();
  saveUser();
  renderTabs();
  refreshCardBuys();
  const cartIco = document.getElementById('cartIco');
  if(btn && cartIco) fly(btn, cartIco, p.img, false);
  toast(`В корзине · размер ${S.size}${n > 1 ? ` · ${n} шт` : ''}`);
}

function modalSearch(){
  const popular = PRODUCTS.filter(p => p.on).slice(0, 6);
  const renderList = (list, lab) => {
    if(!list.length){
      return `<p class="sres-empty">Ничего не нашлось.<br>Попробуйте другое название, артикул или «футболк».</p>`;
    }
    return `${lab ? `<div class="sres-lab">${lab}</div>` : ''}` + list.map(p => `
      <button class="ci" style="width:100%;text-align:left" data-a="open:${p.id}">
        <img class="ci__i" src="${p.img}" alt="" style="width:48px;height:60px">
        <span class="ci__b"><span class="ci__n">${p.name}</span>
        <span class="ci__m">${p.gender === 'w' ? 'Женское' : 'Мужское'} · ${p.cat}${p.sku ? ' · ' + p.sku : ''} · ${money(p.price)}</span></span>
      </button>`).join('');
  };
  const search = (q) => {
    const v = q.trim().toLowerCase();
    if(!v) return {lab:'Популярное сейчас', list:popular};
    const tokens = v.split(/\s+/).filter(Boolean);
    const score = p => {
      const blob = [
        p.name, p.cat, p.sku || '', p.desc || '',
        p.gender === 'w' ? 'женское женщинам девушкам' : 'мужское мужчинам',
        'футболка футболки tshirt tee'
      ].join(' ').toLowerCase();
      if(!tokens.every(t => blob.includes(t))) return 0;
      let s = 0;
      const name = (p.name || '').toLowerCase();
      if(name.includes(v)) s += 8;
      tokens.forEach(t => {
        if(name.includes(t)) s += 4;
        if((p.sku || '').toLowerCase().includes(t)) s += 6;
        if((p.cat || '').toLowerCase().includes(t)) s += 2;
      });
      return s || 1;
    };
    return {
      lab: 'Результаты',
      list: PRODUCTS.filter(p => p.on && score(p) > 0)
        .sort((a,b) => score(b) - score(a))
        .slice(0, 12)
    };
  };
  openOv(`<div class="scrim"></div><div class="smod" role="dialog" aria-label="Поиск">
    <div class="smod__h">
      <button class="hd__b" data-x aria-label="Закрыть">${svg('back')}</button>
      <label class="smod__f">
        ${svg('search','ic ic--sm')}
        <input id="sq" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
          placeholder="Название, артикул или «женская футболка»">
        <button type="button" class="smod__clr" id="sqClr" aria-label="Очистить" hidden>${svg('x','ic ic--sm')}</button>
      </label>
    </div>
    <div class="smod__b" id="sres"></div>
  </div>`);

  const box = ov.querySelector('.smod');
  const q = document.getElementById('sq');
  const r = document.getElementById('sres');
  const clr = document.getElementById('sqClr');

  /* Клавиатура не уменьшает 100vh, поэтому список уезжал под неё. Берём
     высоту реально видимой области и отдаём её окну поиска. */
  const vv = window.visualViewport;
  const syncVv = () => {
    if(!box.isConnected) return;
    box.style.setProperty('--vv-h', (vv ? vv.height : window.innerHeight) + 'px');
    box.style.setProperty('--vv-top', (vv ? vv.offsetTop : 0) + 'px');
  };
  syncVv();
  if(vv){
    vv.addEventListener('resize', syncVv);
    vv.addEventListener('scroll', syncVv);
    onOvClose(() => {
      vv.removeEventListener('resize', syncVv);
      vv.removeEventListener('scroll', syncVv);
    });
  } else {
    window.addEventListener('resize', syncVv);
    onOvClose(() => window.removeEventListener('resize', syncVv));
  }

  const paint = () => {
    const {lab, list} = search(q.value);
    r.innerHTML = renderList(list, lab);
    r.scrollTop = 0;
    clr.hidden = !q.value;
  };
  paint();
  q.focus();
  q.oninput = paint;
  clr.onclick = () => { q.value = ''; paint(); q.focus(); };
  q.onkeydown = e => {
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const first = r.querySelector('[data-a^="open:"]');
    if(first) first.click();
  };
}

/* ==========================================================
   ФОРМА АВТОРИЗАЦИИ (телефон + OTP / Telegram)
   ========================================================== */
function digitsPhone(v){
  let d = String(v || '').replace(/\D/g, '');
  if(d.length === 11 && d[0] === '8') d = '7' + d.slice(1);
  if(d.length === 10) d = '7' + d;
  return d;
}
function phoneReady(v){ return /^7\d{10}$/.test(digitsPhone(v)); }

function formatRuPhoneMask(raw){
  let d = String(raw || '').replace(/\D/g, '');
  if(d.startsWith('8')) d = '7' + d.slice(1);
  if(d && d[0] !== '7') d = '7' + d;
  d = d.slice(0, 11);
  const rest = d.slice(1);
  let out = '+7';
  if(!rest.length) return out;
  out += ' (' + rest.slice(0, 3);
  if(rest.length < 3) return out;
  out += ')';
  if(rest.length === 3) return out;
  out += ' ' + rest.slice(3, 6);
  if(rest.length <= 6) return out;
  out += '-' + rest.slice(6, 8);
  if(rest.length <= 8) return out;
  out += '-' + rest.slice(8, 10);
  return out;
}
function formatMmSs(sec){
  const s = Math.max(0, Math.floor(+sec || 0));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}

let authCodeTimer = null;
function stopAuthCodeTimer(){
  if(authCodeTimer){ clearInterval(authCodeTimer); authCodeTimer = null; }
}
function tickAuthCodeUi(){
  if(S.screen !== 'auth' || S.authPanel !== 'other_device' || !S.authCodeRequested){
    stopAuthCodeTimer();
    return;
  }
  const left = Math.max(0, Math.ceil(((S.authCodeExpiresAt || 0) - Date.now()) / 1000));
  const wait = Math.max(0, Math.ceil(((S.authResendAt || 0) - Date.now()) / 1000));
  const timerEl = document.getElementById('authTimer');
  if(timerEl){
    timerEl.textContent = formatMmSs(left);
    timerEl.classList.toggle('is-exp', left <= 0);
  }
  const resendBtn = document.getElementById('authResend');
  if(resendBtn){
    if(wait > 0){
      resendBtn.disabled = true;
      resendBtn.style.opacity = '.55';
      resendBtn.textContent = 'Запросить новый код (' + wait + ' с)';
    } else {
      resendBtn.disabled = false;
      resendBtn.style.opacity = '';
      resendBtn.textContent = 'Запросить новый код';
    }
  }
  if(left <= 0 && !S.authCodeExpired){
    S.authCodeExpired = true;
    S.authOtpState = '';
    const hint = document.getElementById('otpHint');
    if(hint) hint.textContent = 'Код истёк — запросите новый';
    otpCells().forEach(c => { c.disabled = true; c.value = ''; });
    const box = document.querySelector('.auth__device b');
    if(box) box.textContent = 'Код истёк';
    if(resendBtn){
      resendBtn.disabled = wait > 0;
      resendBtn.textContent = wait > 0 ? ('Запросить новый код (' + wait + ' с)') : 'Запросить новый код';
    }
    toast('Код истёк — запросите новый');
  }
}

function otpCells(){
  return [...document.querySelectorAll('[data-otp]')].sort(
    (a, b) => (+a.dataset.otp || 0) - (+b.dataset.otp || 0)
  );
}
function otpValue(){
  return otpCells().map(c => c.value.replace(/\D/g,'')).join('').replace(/\D/g,'').slice(0, 4);
}
function fillOtpDigits(raw, onComplete){
  const digits = String(raw || '').replace(/\D/g,'').slice(0, 4);
  if(!digits) return false;
  const cells = otpCells();
  cells.forEach((c, i) => { c.value = digits[i] || ''; });
  paintOtpFill();
  if(digits.length === 4){
    cells[3] && cells[3].blur();
    if(typeof onComplete === 'function') onComplete();
    else finishDeviceCodeAuth();
  } else if(cells[digits.length]){
    cells[digits.length].focus();
  }
  return true;
}
function paintOtpFill(){
  const st = S.authOtpState || '';
  otpCells().forEach(c => {
    c.classList.remove('is-fill','is-ok','is-bad');
    if(st === 'ok') c.classList.add('is-ok');
    else if(st === 'bad') c.classList.add('is-bad');
    else if(c.value) c.classList.add('is-fill');
  });
  const hint = document.getElementById('otpHint');
  if(hint && !S.authCodeExpired){
    hint.textContent = st === 'ok' ? 'Код верный' : st === 'bad' ? 'Неверный код' : 'Введите код из бота';
  }
}

function bindDeviceOtp(){
  otpCells().forEach((cell, idx) => {
    cell.onbeforeinput = e => {
      if(S.authCodeExpired) return;
      const data = e.data != null ? String(e.data) : '';
      const multi = data.replace(/\D/g,'');
      if(multi.length >= 2){
        e.preventDefault();
        S.authOtpState = '';
        fillOtpDigits(multi);
      }
    };
    cell.oninput = () => {
      if(S.authCodeExpired) return;
      S.authOtpState = '';
      const raw = cell.value.replace(/\D/g,'');
      /* автозаполнение / вставка с клавиатуры — все цифры сразу */
      if(raw.length > 1){
        fillOtpDigits(raw);
        return;
      }
      cell.value = raw.slice(-1);
      paintOtpFill();
      if(raw && idx < 3) otpCells()[idx + 1].focus();
      if(otpValue().length === 4) finishDeviceCodeAuth();
    };
    cell.onkeydown = e => {
      if(e.key === 'Backspace' && !cell.value && idx > 0) otpCells()[idx - 1].focus();
    };
    cell.onpaste = e => {
      if(S.authCodeExpired) return;
      const t = (e.clipboardData || window.clipboardData).getData('text') || '';
      const digits = t.replace(/\D/g,'').slice(0, 4);
      if(!digits) return;
      e.preventDefault();
      S.authOtpState = '';
      fillOtpDigits(digits);
    };
  });
  setTimeout(() => {
    const first = otpCells()[0];
    if(first && !first.disabled) first.focus();
  }, 80);
}

  }
}

async function requestDeviceCode(){
  if(!window.LC) return toast('API недоступен');
  if(S.authOtpSending) return;
  const waitLeft = Math.max(0, Math.ceil(((S.authResendAt || 0) - Date.now()) / 1000));
  if(S.authCodeRequested && waitLeft > 0){
    return toast('Подождите ' + waitLeft + ' с');
  }
  const ph = document.getElementById('devPhone');
  const raw = (ph && ph.value) || S.authPhone || '';
  if(!phoneReady(raw)){
    if(ph) ph.classList.add('f__err');
    return toast('Введите номер +7…');
  }
  S.authOtpSending = true;
  try{
    const d = await LC.api('/api/auth/device-code/request', {
      method:'POST',
      body:{ phone: digitsPhone(raw) }
    });
    const ttl = Math.max(30, +(d && d.ttl) || 120);
    const cool = Math.max(5, +(d && d.cooldown) || 20);
    S.authPhone = digitsPhone(raw);
    S.authCodeRequested = true;
    S.authOtpState = '';
    S.authCodeExpired = false;
    S.authAutoSent = !!(d && d.autoSent);
    S.authVia = 'telegram';
    S.authCodeExpiresAt = Date.now() + ttl * 1000;
    S.authResendAt = Date.now() + cool * 1000;
    S.authBot = (d && d.bot) || window.__LC_TG_BOT || '';
    toast(S.authAutoSent
      ? 'Код уже в Telegram-чате · 2 мин'
      : 'Код запрошен · откройте бота → «Вход по коду» (2 мин)');
    render(true);
  }catch(err){
    const msg = err.message || 'Не удалось запросить код';
    const info = err.data || {};
    const m = /Подождите\s+(\d+)\s*с/i.exec(msg);
    const wait = +info.cooldown || (m ? +m[1] : 0);
    if(wait > 0) S.authResendAt = Date.now() + wait * 1000;
    /* Пауза между запросами — новый код не выдали, но прошлый ещё живёт.
       Открываем ввод: иначе человек упирается в «подождите», а код,
       который уже лежит у него в Telegram, ввести некуда. */
    if(info.pending){
      S.authPhone = digitsPhone(raw);
      S.authCodeRequested = true;
      S.authCodeExpired = false;
      S.authOtpState = '';
      S.authVia = 'telegram';
      S.authAutoSent = !!info.autoSent;
      S.authCodeExpiresAt = Date.now() + Math.max(1, +info.ttl || 0) * 1000;
      S.authBot = info.bot || S.authBot || window.__LC_TG_BOT || '';
      render(true);
      toast('Код уже отправлен — введите его');
      return;
    }
    if(wait > 0) tickAuthCodeUi();
    toast(msg);
  }finally{
    S.authOtpSending = false;
  }
}

  const [k, a, b] = el.dataset.a.split(':');

    case 'filters': sheetFilters(); break;

    case 'search': modalSearch(); break;
    case 'menu': sheetMenu(); break;
    case 'chat': modalChat(); break;
    case 'support_open':
      closeOv();
      (async () => {
        try{
          const st = await tgLinkedStatus();
          S.tgLinked = !!st.linked;
        }catch(_){}
        /* зарегистрирован / Telegram привязан → start=support (диалог поддержки);
           гость уже был в боте → просто чат; первый раз → тоже support */
        const registered = !!(S.user && S.user.id) || !!S.tgLinked;

      })();

    /* --- пункты выдачи --- */
    case 'pvzopen': sheetPvz(); break;

      pvzView.geo = 'idle';
      pvzView.all = false;
      pvzView.city = (pvzView.cities || []).find(c => String(c.code) === String(decodeURIComponent(a))) || null;

      else pvzLocate(true);

    /* фото из блока «О бренде» — открыть во весь экран */
    case 'abtzoom': {
      const blk = aboutBlocks().find(x => String(x.id) === String(a));

      (async () => {
        await refreshAuthUser();
        if(!isAdmin()){ toast('Нет доступа'); return; }
        openAdmin();
      })();
      break;

    /* Мужское/Женское. Через go('catalog') экран уходил в fadeIn и карточки
       заново «выезжали» с задержкой — получалось моргание. На том же экране
       перерисовываем тихо (render(true)) и просто уводим скролл наверх. */
    case 'gen': {

      if(S.screen === 'catalog'){
        window.scrollTo(0, 0);

      if(a === 'back'){ S.tryon.step = 'intro'; render(); break; }

        S.tryon.photo = null; S.tryon.result = null; S.tryon.err = '';
        S.tryon.step = 'upload'; render(); break;
      }
      if(a === 'run'){ runTryOn(); break; }
      {
        const prod = byId(S.productId);
        if(!tryonEnabledFor(prod)){ toast('Примерка для этого товара выключена'); break; }
      }
      resetTryon(false);
      go('tryon');

      const p = byId(S.productId);

        track.scrollTo({left: S.galIdx * (track.clientWidth || 1), behavior:'smooth'});
      } else {

        const main = document.querySelector('.pd__main');
        if(main) main.src = gal[S.galIdx] || p.img;
      }
      document.querySelectorAll('.thumb').forEach((t, i) => {
        t.setAttribute('aria-current', i === S.galIdx ? 'true' : 'false');
      });
      break;
    }
    case 'color': {
      S.color = decodeURIComponent(el.dataset.a.slice(6));
      saveUser();
      render(true);
      break;
    }
    case 'size':
      S.size = a;
      S.qty = 1;                 // у нового размера свой остаток
      /* без полного render — иначе экран дёргается из‑за анимации смены экрана */
      document.querySelectorAll('.size').forEach(b => {
        b.setAttribute('aria-pressed', b.dataset.a === 'size:' + a ? 'true' : 'false');
      });
      paintQty();
      refreshCTA();
      break;

    case 'pq': {
      const p = byId(S.productId);
      if(!p) break;
      const max = maxAddQty(p, S.size);
      const next = Math.max(1, Math.min(Math.max(1, max), (+S.qty || 1) + (+a)));
      if(next === S.qty){
        if(+a > 0 && max) toast(`Больше нет — на складе ${max} шт`);
        break;
      }
      S.qty = next;
      paintQty();
      const n = document.getElementById('pdQtyN');
      if(n){ n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop'); }
      refreshCTA();
      break;
    }

    case 'fav': {
      const id = +a;
      S.favs.includes(id) ? S.favs = S.favs.filter(x => x !== id) : S.favs.push(id);
      const added = S.favs.includes(id);
      // анимируем именно ту кнопку, по которой попали
      el.classList.remove('beat','burst'); void el.offsetWidth;
      el.classList.add('beat');
      if(added) el.classList.add('burst');
      setTimeout(() => el.classList.remove('beat','burst'), 520);
      saveUser();
      if(S.screen === 'favs'){
        setTimeout(() => render(true), 220);   // даём сердцу доиграть, потом убираем карточку
      } else {
        document.querySelectorAll(`[data-a="fav:${id}"]`)
          .forEach(b => b.setAttribute('aria-pressed', S.favs.includes(id)));
        renderTabs();                     // счётчик в таб-баре
        if(S.screen === 'product'){       // и счётчик в шапке товара
          document.getElementById('hdSlot').innerHTML = SCREENS.product.hd();
        }
      }
      break;
    }

    case 'add': {
      const p = byId(S.productId);
      if(!S.size) return toast('Выберите размер');
      if(!canAddMore(p, S.size)){
        return toast(stockOf(p, S.size) ? 'Весь остаток уже в корзине' : 'Этого размера нет в наличии');
      }
      const qty = Math.max(1, Math.min(+S.qty || 1, maxAddQty(p, S.size)));
      S.cart.push({key:cartKey(p), id:p.id, sku:p.sku || '', name:p.name, img:p.img, price:p.price,
        size:S.size, color:S.color || '', colorName:colorNameOf(p, S.color), qty});
      S.qty = 1;
      paintQty();
      if(qty > 1) toast(`В корзине · ${S.size} · ${qty} шт`);
      const btn = document.querySelector('.pd__cta .btn');
      popBtn(btn);
      fly(btn, document.getElementById('cartIco'), p.img, false);
      refreshCTA(); renderTabs(); saveUser();
      setTimeout(() => {                    // счётчик обновляем к моменту прилёта
        const slot = document.getElementById('hdSlot');
        if(S.screen === 'product') slot.innerHTML = SCREENS.product.hd();
      }, 560);
      break;
    }

    case 'quick': {
      const p = byId(+a);
      if(!p) break;
      window.__quickBtn = el;
      /* Повторный тап по «В корзине» открывает ту же шторку: там видно
         набранные размеры и количество, и там же от них можно отказаться.
         Молча стирать строку корзины одним касанием — слишком грубо. */
      const hasSizes = (p.sizes || []).some(sz => stockOf(p, sz) > 0);
      if(!hasSizes && cardInCart(p)){
        S.cart = S.cart.filter(x => x.id !== p.id);
        saveUser(); renderTabs();
        refreshCardBuys();
        toast('Удалено из корзины');
        break;
      }
      sheetQuickAdd(p.id);
      break;
    }

    case 'qadd': {
      const p = byId(+a);
      if(!p || !b) break;
      if(!canAddMore(p, b)){
        closeOv();
        toast(stockOf(p, b) ? 'Весь остаток уже в корзине' : 'Этого размера нет в наличии');
        break;
      }
      S.size = b;
      addFromCard(p, window.__quickBtn || el);
      window.__quickBtn = null;
      break;
    }

    case 'rmline': {
      const p = byId(S.productId);
      const btn = document.querySelector('.pd__cta .btn');
      fly(document.getElementById('cartIco'), btn, p.img, true);
      S.cart = S.cart.filter(x => x.key !== cartKey(p));
      S.qty = 1;
      paintQty();
      popBtn(btn); refreshCTA(); renderTabs(); saveUser();
      document.getElementById('hdSlot').innerHTML = SCREENS.product.hd();
      break;
    }
    case 'q': {
      const parts = el.dataset.a.split(':');
      const step = Number(parts.pop());
      const key = parts.slice(1).join(':');
      const line = S.cart.find(x => x.key === key);
      if(!line) break;
      const prod = byId(line.id);
      const max = stockOf(prod, line.size);
      /* сумма по размеру, а не только эта строка: тот же размер может лежать
         ещё раз другим цветом */
      if(step > 0 && max !== STOCK_ANY && inCartQty(prod, line.size) + step > max){
        toast(`В наличии только ${max} шт`);
        break;
      }
      line.qty = Math.max(1, line.qty + step);
      /* saveUser здесь обязателен: без него набранное количество терялось
         при перезагрузке страницы — в корзину возвращалась одна штука */
      revalidatePromo(); saveUser(); render(true);
      requestAnimationFrame(() => {
        const n = document.querySelector(`.qty [data-a="q:${CSS.escape(key)}:1"]`);
        const span = n && n.parentElement && n.parentElement.querySelector('span');
        if(span){
          span.classList.remove('pop');
          void span.offsetWidth;
          span.classList.add('pop');
        }
      });
      break;
    }
    case 'del':
      S.cart = S.cart.filter(x => x.key !== el.dataset.a.slice(4));
      revalidatePromo(); saveUser(); render(true); renderTabs(); refreshCardBuys(); break;

    /* размер из строки корзины: добавляет ещё одну штуку этого размера */
    case 'addsz': {
      const p = byId(+a);
      const size = decodeURIComponent(b || '');
      if(!p || !size) break;
      const left = stockOf(p, size);
      const line = S.cart.find(x => x.id === p.id && x.size === size);
      if(left <= 0){ toast(`Размер ${size} закончился`); break; }
      /* сравниваем с СУММОЙ по размеру: один размер может лежать несколькими
         строками (разные цвета), и построчная проверка пропускала перебор */
      if(left !== STOCK_ANY && inCartQty(p, size) + 1 > left){
        toast(`В наличии только ${left} шт`);
        break;
      }
      if(line) line.qty += 1;
      else S.cart.push({key:p.id + '-' + size, id:p.id, sku:p.sku || '', name:p.name,
        img:p.img, price:p.price, size, qty:1});
      revalidatePromo(); saveUser(); render(true); renderTabs(); refreshCardBuys();
      toast(`Размер ${size} · ${(line ? line.qty : 1)} шт`);
      break;
    }

    case 'dropgone': {
      const n = goneLines().length;
      S.cart = S.cart.filter(x => !x.gone);
      revalidatePromo(); saveUser(); render(true);
      toast(n === 1 ? 'Позиция убрана' : `Убрано позиций: ${n}`);
      break;
    }

    case 'promoapply': {
      const inp = document.getElementById('promoIn');
      applyPromoCode(inp ? inp.value : S.promoCode);
      render(true);
      break;
    }
    case 'promoclear':
      S.promo = null; S.promoCode = ''; S.promoMsg = '';
      toast('Промокод сброшен'); render(true); break;

    case 'checkout':
      if(!cartReady()) break;
      if(!requireAccountForCheckout('delivery')) break;
      if(S.user && profileNeedsFill(S.user)){
        S.afterProfile = 'delivery';
        toast('Заполните ФИО и email — нужно для заказа');
        go('pdata');
        break;
      }
      syncGuest();
      go('delivery'); break;

    case 'minimize': {
      /* Сворачиваем оформление и уходим на главную — корзина не нужна. */
      S.mini = S.screen;
      HIST.length = 0;
      S.screen = 'home';
      render();
      break;
    }
    case 'unmin': {
      const s = S.mini; S.mini = null; go(s); break;
    }
    case 'minclose':
      S.mini = null; render(true); toast('Оформление отменено'); break;

    case 'topay': {
      if(!requireAccountForCheckout('pay')) break;
      if(!cartReady()) break;
      const err = contactError();
      if(err){
        const f = document.getElementById(err.id);
        if(f){ f.classList.add('f__err'); f.focus(); f.scrollIntoView({block:'center', behavior:'smooth'}); }
        toast(err.msg); break;
      }
      if(!S.checkout.pvz || !String(S.checkout.pvz.addr||'').trim()){
        toast('Укажите адрес пункта выдачи СДЭК');
        document.getElementById('pvzAddr')?.focus();
        document.getElementById('pvzAddr')?.scrollIntoView({block:'center', behavior:'smooth'});
        break;
      }
      if(String(S.checkout.pvz.addr).trim().length < 8){
        toast('Адрес слишком короткий — вставьте полный адрес ПВЗ');
        document.getElementById('pvzAddr')?.focus();
        break;
      }
      rememberDefaultPvz(S.checkout.pvz);
      go('pay'); break;
    }



    case 'paynow': {
      if(!requireAccountForCheckout('pay')) break;
      if(!S.cart.length) break;
      if(!cartReady()) break;
      if(cartBlocked()) break;
      if(S._payBusy){ toast('Уже создаём оплату…'); break; }
      const cerr = contactError();
      if(cerr){ toast(cerr.msg); go('delivery'); break; }
      if(!S.checkout.pvz || !String(S.checkout.pvz.addr||'').trim()){ toast('Укажите адрес пункта выдачи СДЭК'); go('delivery'); break; }
      if(!window.LC){ toast('Запустите сервер магазина'); break; }
      S._payBusy = true;
      (async () => {
        try{
          toast('Создаём оплату…');
          revalidatePromo();
          const g = S.checkout.guest;
          const result = await LC.checkout({
            items: S.cart.filter(i => !i.gone).map(i => ({id:i.id, size:i.size, qty:i.qty})),
            guest: { name: g.name.trim(), phone: g.phone.trim(), email: g.email.trim() },
            pvz: S.checkout.pvz,
            promoCode: S.promo ? S.promo.code : S.promoCode
          });
          const order = normalizeServerOrder(result.order);
          if(result.orderAccessToken) LC.rememberOrderToken(order.num, result.orderAccessToken);
          seedOrderSeen();
          ORDERS.unshift(order);
          S.lastOrder = order;
          S.cart = [];
          S.promo = null; S.promoCode = ''; S.promoMsg = '';
          S.mini = null;
          S.orderTab = 'Все заказы';
          saveUser();
          /* сразу синхронизировать с сервером, если залогинены */
          if(S.user) refreshMyOrders(false);
          if(result.alreadyPaid){
            toast('Заказ оформлен');
            go('done');
            return;
          }
          if(result.confirmationUrl){
            location.href = result.confirmationUrl;
            return;
          }
          if(!result.paymentConfigured){
            toast(result.message || 'Заказ принят в обработку');
            go('done');
            return;
          }
          toast('Нет ссылки на оплату — откройте заказ и нажмите «Оплатить»');
          go('done');
        }catch(err){
          toast(err.message || 'Не удалось создать оплату');
        }finally{
          S._payBusy = false;
        }
      })();
      break;
    }

    case 'authmode':
      S.authMode = S.authMode === 'reg' ? 'log' : 'reg';
      S.authPanel = 'main';
      stopAuthLinkPoll();
      render(true);
      break;
    case 'auth_panel':
      /* «Назад к логину» с экрана кода — обратно в окно входа */
      if(!a || a === 'main'){
        S.authPanel = 'main';
        S.authOtpState = '';
        S.authCodeRequested = false;
        S.authCodeExpired = false;
        stopAuthCodeTimer();
        stopAuthLinkPoll();
        back();
        authModal('log');
        break;
      }
      S.authPanel = a;
      S.authOtpState = '';
      if(S.authPanel !== 'other_device'){
        S.authCodeRequested = false;
        S.authCodeExpired = false;
        stopAuthCodeTimer();
      }
      stopAuthLinkPoll();
      render(true);
      break;
    case 'auth_request_code':
      requestDeviceCode();
      break;
    case 'auth_device_reset':
      S.authCodeRequested = false;
      S.authOtpState = '';
      S.authCodeExpired = false;
      S.authAutoSent = false;
      stopAuthCodeTimer();
      render(true);
      break;
    case 'auth_copy_bot': {
      const bot = telegramBotUsername();
      if(!bot){ toast('Бот ещё не настроен'); break; }
      copyText('@' + bot).then(ok => toast(ok ? 'Скопировано: @' + bot : '@' + bot));
      break;
    }
    case 'auth_google':
      startGoogleLogin();
      break;
    case 'auth_tg':
      openTelegram(S.authMode === 'reg' ? 'reg' : 'login', { sameTab: true });
      break;
    case 'logout':
      (async () => {
        if(window.LC){
          try{ await LC.logout(); }catch(_){}
        }
        S.user = null;
        S.tgLinked = false;
        ORDERS.length = 0;
        ADMIN_ORDERS.length = 0;
        S.lastOrder = null;
        saveUser();
        toast('Вы вышли из аккаунта');
        go('profile');
      })();
      break;
    case 'otab': S.orderTab = el.dataset.a.slice(5); render(true); break;
    case 'ord':
      markOrderSeen(a);
      (async () => {
        try{ await pullOrderByNum(a); saveUser(); }catch(_){}
        if(!ORDERS.find(x => String(x.num) === String(a))) return toast('Заказ не найден');
        openOv(orderModal(a));
        if(S.screen === 'orders' || S.screen === 'profile') render(true);
        startPayTimers();
      })();
      break;
    case 'reorder': {
      const o = ORDERS.find(x => String(x.num) === String(a));
      if(!o || !Array.isArray(o.items) || !o.items.length){
        toast('Нечего повторять');
        break;
      }
      let added = 0;
      let skipped = 0;
      o.items.forEach(it => {
        const p = byId(it.id);
        if(!p || soldOut(p)){ skipped += 1; return; }
        const size = it.size || (p.sizes && p.sizes[0]) || 'ONESIZE';
        if((p.sizes || []).length && stockOf(p, size) <= 0){ skipped += 1; return; }
        const key = p.id + '-' + size;
        const exist = S.cart.find(x => x.key === key);
        const qty = Math.max(1, +it.qty || 1);
        if(exist) exist.qty += qty;
        else {
          S.cart.push({
            key, id:p.id, sku:p.sku || '', name:p.name, img:p.img || it.img,
            price:p.price, size, qty
          });
        }
        added += 1;
      });
      if(o.pvz && o.pvz.addr) rememberDefaultPvz(o.pvz);
      saveUser();
      closeOv();
      if(!added){
        toast(skipped ? 'Товары недоступны' : 'Нечего добавить');
        break;
      }
      toast(skipped
        ? `В корзине ${added}, недоступно ${skipped}`
        : 'Заказ повторён · в корзине');
      go('cart');
      break;
    }

    /* --- отмена и возврат заказа --- */
    case 'ordcancel': {
      const o = ORDERS.find(x => x.num === a);
      if(!o) break;
      if(o.status === 'Едет' || o.status === 'Доставка' || Number(o.now) >= 3){
        toast('Этот заказ уже нельзя отменить');
        break;
      }
      const paid = o.payStatus === 'paid';
      askModal({
        title:'Отменить заказ?',
        text: paid
          ? `Заказ №${o.num} на ${money(o.price)} будет отменён. Вернём ваши деньги в течение дня.`
          : `Заказ №${o.num} ещё не оплачен. Отменим его, вещи вернутся в каталог.`,
        ok:'Отменить заказ', cancel:'Оставить', danger:true,
        action:`ordcancelgo:${o.num}`
      });
      break;
    }
    case 'ordcancelgo': {
      const o = ORDERS.find(x => x.num === a);
      if(!o || (o.status !== 'В обработке' && o.status !== 'Ожидает оплаты') || o.status === 'Едет' || Number(o.now) >= 3){ closeOv(); break; }
      (async () => {
        try{
          if(window.LC){
            const tok = LC.orderToken(o.num) || '';
            const updated = normalizeServerOrder(await LC.cancelOrder(o.num, tok));
            Object.assign(o, updated);
            o.cancelledAt = todayStamp();
          } else {
            o.status = 'Отменён';
            o.now = 0;
            o.cancelledAt = todayStamp();
            returnStock(o);
            releasePromo(o);
          }
          saveUser();
          closeOv(); render(true);
          toast(o.payStatus === 'paid'
            ? 'Заказ отменён · вернём деньги в течение дня'
            : 'Заказ №' + o.num + ' отменён');
          if(S.user) refreshMyOrders(false);
        }catch(err){
          toast(err.message || 'Не удалось отменить');
        }
      })();
      break;
    }
    case 'ordreturn': {
      const o = ORDERS.find(x => x.num === a);
      if(!o) break;
      const refund = Math.max(0, (+o.goods || o.price) - (+o.discount || 0));
      askModal({
        title:'Оформить возврат?',
        text:`Отправим заявку по заказу №${o.num}. Пришлём адрес для отправки и вернём ${money(refund)} после проверки вещи.`,
        ok:'Отправить заявку', cancel:'Не сейчас',
        action:`ordreturngo:${o.num}`
      });
      break;
    }
    case 'ordreturngo': {
      const o = ORDERS.find(x => x.num === a);
      if(!o){ closeOv(); break; }
      (async () => {
        try{
          if(window.LC){
            const tok = LC.orderToken(o.num) || '';
            const updated = normalizeServerOrder(await LC.returnOrder(o.num, tok));
            Object.assign(o, updated);
            o.returnAt = todayStamp();
          } else {
            o.status = 'Возврат';
            o.now = 0;
            o.returnAt = todayStamp();
          }
          saveUser();
          closeOv(); render(true);
          toast('Заявка на возврат отправлена');
          if(S.user) refreshMyOrders(false);
        }catch(err){
          toast(err.message || 'Не удалось оформить возврат');
        }
      })();
      break;
    }
    case 'ordpay': {
      const o = ORDERS.find(x => String(x.num) === String(a));
      if(!o){ toast('Заказ не найден'); break; }
      if(!window.LC){
        if(o.confirmationUrl) location.href = o.confirmationUrl;
        else toast('Ссылка на оплату недоступна');
        break;
      }
      (async () => {
        try{
          toast('Открываем оплату…');
          const tok = LC.orderToken(o.num) || '';
          const result = await LC.payOrder(o.num, tok);
          if(result.orderAccessToken) LC.rememberOrderToken(o.num, result.orderAccessToken);
          if(result.order) Object.assign(o, normalizeServerOrder(result.order));
          saveUser();
          if(result.alreadyPaid){
            S.lastOrder = o;
            toast('Заказ уже оплачен');
            go('done');
            return;
          }
          const url = result.confirmationUrl || o.confirmationUrl;
          if(!url){ toast('Не удалось получить ссылку на оплату'); return; }
          location.href = url;
        }catch(err){
          toast(err.message || 'Не удалось открыть оплату');
        }
      })();
      break;
    }
    case 'eye': {
      const i = document.getElementById(a);
      if(!i) break;
      const hidden = i.type === 'password';
      i.type = hidden ? 'text' : 'password';
      el.innerHTML = svg(hidden ? 'eyeOff' : 'eye','ic ic--sm');
      el.setAttribute('aria-label', hidden ? 'Скрыть пароль' : 'Показать пароль');
      el.setAttribute('aria-pressed', hidden ? 'true' : 'false');
      /* курсор в конец: иначе после переключения он прыгает в начало строки */
      try{ const v = i.value; i.focus({preventScroll:true}); i.setSelectionRange(v.length, v.length); }catch(_){}
      break;
    }

    case 'fc': {
      const c = el.dataset.a.slice(3);
      S.filter.cats.includes(c) ? S.filter.cats = S.filter.cats.filter(x => x !== c) : S.filter.cats.push(c);
      el.setAttribute('aria-pressed', S.filter.cats.includes(c)); syncFilterFooter(); break;
    }
    case 'fs': {
      S.filter.sizes.includes(a) ? S.filter.sizes = S.filter.sizes.filter(x => x !== a) : S.filter.sizes.push(a);
      el.setAttribute('aria-pressed', S.filter.sizes.includes(a)); syncFilterFooter(); break;
    }
    case 'np': {
      const what = el.dataset.a.split(':')[1];
      if(what === 'open')  npOpen(el.dataset.a.split(':')[2]);
      else if(what === 'd')   npType(el.dataset.a.split(':')[2]);
      else if(what === 'del') npType('del');
      else if(what === 'close') npClose();
      else if(what === 'add'){
        // первое «Добавить» — переход ко второму полю, второе — закрыть
        npTarget === 'fmin' ? npOpen('fmax') : npClose();
      }
      break;
    }
    case 'fapply':
      S.filter.min = document.getElementById('fmin').value;
      S.filter.max = document.getElementById('fmax').value;
      npClose(); closeOv(); render(true); break;
    case 'freset':
      // шторку не закрываем — сбрасываем прямо в ней
      S.filter = {cats:[],sizes:[],min:'',max:''};
      ov.querySelectorAll('[data-a^="fc:"],[data-a^="fs:"]').forEach(c => c.setAttribute('aria-pressed','false'));
      ['fmin','fmax'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
      syncFilterFooter();
      npClose();
      render(true);
      break;
    case 'srt': S.sort = a; closeOv(); render(true); break;

    case 'sent': closeOv(); toast('Заявка отправлена — скоро ответим'); break;
    case 'copysku': copyText(el.dataset.a.slice(8)); break;
    case 'share':
      shareProduct();
      break;
    case 'soon':
      toast('Раздел в разработке'); break;
    case 'tgskip': {
      closeOv();
      if(S.user && S.user.id){
        try{
          localStorage.setItem('lc_tg_skip_' + S.user.id, '1');
          localStorage.setItem('lc_tg_asked_' + S.user.id, '1');
        }catch(e){}
      }
      toast('Можно подключить позже в Профиль → Уведомления');
      break;
    }
  }
});

/* ==========================================================
   АДМИН-ПАНЕЛЬ
   ========================================================== */
const adm = document.getElementById('adm');
const CMS_KEY = 'shop_cms_v1';
const ORDER_STATUSES = ['Ожидает оплаты','В обработке','Едет','Доставлен','Отменён','Возврат'];
let adTab = 'dash';
let adQ = '', adG = 'all', adOrdFilter = 'all', adCliQ = '';
if(adOrdFilter === 'Доставка') adOrdFilter = 'Едет';
let editId = null;

function defaultCms(){

/* Плашки преимуществ: чего нет в сохранённом CMS — берём из умолчаний,
   иначе после старого сохранения главная осталась бы без блоков. */
function uspMerge(base, saved){
  const b = base || {on:true, items:[]};
  if(!saved || typeof saved !== 'object') return {on:b.on !== false, items:b.items.slice()};
  const items = Array.isArray(saved.items) && saved.items.length ? saved.items : b.items;
  return {
    on: saved.on !== false,
    items: items.slice(0, 4).map((x, i) => Object.assign({}, b.items[i] || b.items[0], x || {}))
  };
}
function loadCms(){
  try{
    const raw = localStorage.getItem(CMS_KEY);
    if(!raw) return defaultCms();
    const d = JSON.parse(raw) || {};
    const base = defaultCms();
    const cms = Object.assign(base, d, {
      brand: Object.assign({}, base.brand, d.brand || {}),
      contacts: Object.assign({}, base.contacts, d.contacts || {}),
      legal: Object.assign({}, base.legal, d.legal || {}),
      texts: Object.assign({}, base.texts, d.texts || {}),
      shipping: Object.assign({}, base.shipping, d.shipping || {}),
      tryon: Object.assign({}, base.tryon, d.tryon || {}),
      reviews: Object.assign({}, base.reviews, d.reviews || {}),
      pvz: Array.isArray(d.pvz) ? d.pvz : base.pvz,
      usp: uspMerge(base.usp, d.usp),
      customers: d.customers || {},
      promos: Array.isArray(d.promos) ? d.promos : base.promos,
      slides: Array.isArray(d.slides) ? d.slides.filter(s => s && s.img).slice(0,10) : base.slides
    });
    /* Первый заход после переименования: стоковые тексты/промо SAS → Canvas */
    if(!d.brand){
      if(!cms.brand.name) cms.brand.name = 'Canvas';
      ['aboutLead','historyLead','homeBanner'].forEach(k => {
        if(String(cms.texts[k]||'').includes('SAS')) cms.texts[k] = base.texts[k];
      });
      (cms.promos||[]).forEach(p => {
        if(p && String(p.code||'').toUpperCase() === 'SAS10') p.code = 'LUXE10';
      });
    }
    return cms;
  }catch(e){ return defaultCms(); }
}

function parseOrderDate(o){
  if(!o || !o.date) return null;
  const s = String(o.date).trim();
  let m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const t = Date.parse(s);
  return Number.isFinite(t) ? new Date(t) : null;
}
function daysAgo(n){
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-n); return d;
}
function analytics(){
  const all = ORDERS.slice();
  const from7 = daysAgo(6);
  const today = daysAgo(0);
  const in7 = all.filter(o => { const d = parseOrderDate(o); return d && d >= from7 && o.status !== 'Отменён'; });
  const tod = all.filter(o => { const d = parseOrderDate(o); return d && d >= today && o.status !== 'Отменён'; });
  const rev = list => list.reduce((s,o) => s + (o.price||0), 0);
  const byDay = [];
  for(let i=6;i>=0;i--){
    const day = daysAgo(i);
    const next = daysAgo(i-1);
    const list = all.filter(o => {
      const d = parseOrderDate(o);
      return d && d >= day && d < next && o.status !== 'Отменён';
    });
    byDay.push({
      lab: ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'][day.getDay()],
      n: list.length,
      sum: rev(list)
    });
  }
  const map = {};
  all.forEach(o => (o.items||[]).forEach(it => {
    const k = it.name;
    if(!map[k]) map[k] = {name:k, img:it.img, qty:0, sum:0};
    map[k].qty += it.qty||1;
    map[k].sum += (it.price||0)*(it.qty||1);
  }));
  const top = Object.values(map).sort((a,b) => b.qty - a.qty).slice(0,5);
  const active = all.filter(o => o.status === 'В обработке' || o.status === 'Едет').length;
  return {
    todayN: tod.length, todaySum: rev(tod),
    weekN: in7.length, weekSum: rev(in7),
    avg: in7.length ? Math.round(rev(in7)/in7.length) : 0,
    active, byDay, top,
    maxBar: Math.max(1, ...byDay.map(x => x.sum))
  };
}

function customersList(){
  const map = {};
  ORDERS.forEach(o => {
    const email = (o.email || (o.customer && o.customer.email) || '').toLowerCase() || 'guest@' + o.num;
    const name = o.customerName || (o.customer && o.customer.name) || 'Гость';
    const phone = o.phone || (o.customer && o.customer.phone) || '';
    if(!map[email]) map[email] = {email, name, phone, orders:0, sum:0, last:o.date, nums:[]};
    map[email].orders += 1;
    map[email].sum += o.price||0;
    map[email].last = o.date;
    map[email].nums.push(o.num);
    if(name && name !== 'Гость') map[email].name = name;
    if(phone) map[email].phone = phone;
  });
  if(S.user && S.user.email){
    const e = S.user.email.toLowerCase();
    if(!map[e]) map[e] = {email:e, name:(S.user.name||'')+' '+(S.user.last||''), phone:S.user.phone||'', orders:0, sum:0, last:'—', nums:[]};
    else {
      map[e].name = ((S.user.name||'')+' '+(S.user.last||'')).trim() || map[e].name;
      if(S.user.phone) map[e].phone = S.user.phone;
    }
  }
  Object.keys(CMS.customers||{}).forEach(e => {
    if(!map[e]) map[e] = {email:e, name:CMS.customers[e].name||e, phone:CMS.customers[e].phone||'', orders:0, sum:0, last:'—', nums:[]};
  });
  return Object.values(map).sort((a,b) => b.sum - a.sum);
}

      <button class="ad__b ad__b--pri" id="oSave">Сохранить</button>
    </div>
  </div>`;
  adm.appendChild(w);
  let st = o.status === 'Доставка' ? 'Едет' : o.status;
  w.querySelector('#oSt').onclick = e => {
    const b = e.target.closest('.ad__pick-b'); if(!b) return;
    st = b.dataset.v;
    w.querySelectorAll('#oSt .ad__pick-b').forEach(x => x.setAttribute('aria-pressed', x.dataset.v===st?'true':'false'));
  };
  w.querySelector('#oX').onclick = () => w.remove();
  w.onclick = e => { if(e.target===w) w.remove(); };
  w.querySelector('#oSave').onclick = async () => {
    const track = w.querySelector('#oTrack').value.trim();
    try{
      if(window.LC && S.user && S.user.admin){
        const updated = normalizeServerOrder(await LC.patchOrder(o.num, { status: st, tracking: track }));
        Object.assign(o, updated);
        o.track = track;
      } else {
        const wasCancelled = o.status === 'Отменён';
        o.status = st;
        if(st === 'Отменён' && !wasCancelled){ returnStock(o); releasePromo(o); }
        o.track = track;
        if(st==='В обработке') o.now = 2;
        else if(st==='Едет' || st==='Доставка') o.now = 3;
        else if(st==='Доставлен') o.now = 4;
        else if(st==='Отменён' || st==='Возврат') o.now = 0;
        saveUser();
      }
      w.remove();
      paintAdmin();
      toast('Заказ обновлён');
    }catch(err){
      toast(err.message || 'Не удалось сохранить заказ');
    }
  };
}

/* Ужимаем фото перед сохранением: в localStorage мало места. */
/* Обёртка над fileToPhotoDataUrl со старой сигнатурой на колбэке.
   Внутри — тот же быстрый путь без лишнего base64. */
function shrinkImage(file, maxW, cb){
  fileToPhotoDataUrl(file, maxW, 0.84, {flatten: true})
    .then(out => cb(out))
    .catch(() => cb(''));
}

/* Пачкой: сжимаем все выбранные файлы и добавляем в том же порядке. */
function addSlideFiles(files){
  if(!Array.isArray(CMS.slides)) CMS.slides = [];
  const free = MAX_SLIDES - CMS.slides.length;
  if(free <= 0){ toast(`Уже ${MAX_SLIDES} фото — сначала удалите лишние`); return; }
  const take = files.slice(0, free);
  const overflow = files.length - take.length;
  if(!take.length) return;
  if(take.length > 1) toast(`Готовлю фото: ${take.length}…`);

  /* По одному файлу за раз: параллельная обработка нескольких снимков
     раньше подвешивала вкладку — каждый из них полностью декодировался
     в память одновременно с остальными. */
  (async () => {
    const ready = new Array(take.length);
    for(let i = 0; i < take.length; i++){
      let data = '';
      try{ data = await fileToPhotoDataUrl(take[i], 1400, 0.84, {flatten: true}); }
      catch(e){ data = ''; }
      ready[i] = (data && data.length <= 1.6e6) ? data : '';
      await letUiBreathe();
    }

    const base = Date.now();
    let added = 0, heavy = 0;
    ready.forEach((img, k) => {
      if(img){ CMS.slides.push({id:base + k, img, cap:'', kick:'', sub:''}); added++; }
      else heavy++;
    });
    const ok = saveCms();
    paintAdmin(); render(true);
    if(!ok){ toast('Сохранено на сессию — в браузере кончилось место'); return; }
    let msg = added ? `Добавлено фото: ${added}` : 'Ничего не добавилось';
    if(heavy) msg += ` · тяжёлых пропущено: ${heavy}`;
    if(overflow) msg += ` · сверх лимита: ${overflow}`;
    toast(msg);
  })();
}

  w.className = 'ad__form';
  let type = isFreeShipPromo(d) ? 'freeship' : (d.type || 'percent');
  w.innerHTML = `<div class="ad__card">
    <h2 class="ad__ct">${p?'Промокод':'Новый промокод'}</h2>
    <label class="ad__l">Код</label>
    <input class="ad__f" id="pc" value="${d.code||''}" placeholder="LUXE10" style="text-transform:uppercase">
    <label class="ad__l">Тип</label>
    <div class="ad__pick" id="pType">
      <button type="button" class="ad__pick-b" data-v="percent" aria-pressed="${type==='percent'}">Проценты</button>
      <button type="button" class="ad__pick-b" data-v="fixed" aria-pressed="${type==='fixed'}">Фикс, ₽</button>
      <button type="button" class="ad__pick-b" data-v="freeship" aria-pressed="${type==='freeship'}">Доставка</button>
    </div>
    <p class="ad__m" id="pHint"></p>
    <div class="ad__g2">
      <div id="pvWrap"><label class="ad__l">Значение</label><input class="ad__f" id="pv" type="number" min="0" value="${isFreeShipPromo(d)?'':(d.value||'')}"></div>
      <div><label class="ad__l">Мин. сумма</label><input class="ad__f" id="pm" type="number" value="${d.minSum||0}"></div>
    </div>
    <label class="ad__l">Лимит использований</label>
    <input class="ad__f" id="pl" type="number" value="${d.limit||''}" placeholder="пусто = без лимита">
    <label class="ad__l">Подпись</label>
    <input class="ad__f" id="pn" value="${(d.note||'').replace(/"/g,'&quot;')}" placeholder="Для себя">
    <label class="ad__sw"><input type="checkbox" id="po" ${d.on!==false?'checked':''}> Активен</label>
    <div class="ad__foot">
      <button class="ad__b" id="pX">Отмена</button>
      <button class="ad__b ad__b--pri" id="pSave">Сохранить</button>
    </div>
  </div>`;
  adm.appendChild(w);
  const paintType = () => {
    const wrap = w.querySelector('#pvWrap');
    const hint = w.querySelector('#pHint');
    const ship = type === 'freeship';
    wrap.style.display = ship ? 'none' : '';
    hint.textContent = ship
      ? 'Доставка до пункта выдачи станет бесплатной. Скидки на товары нет.'
      : '';
  };
  paintType();
  w.querySelector('#pType').onclick = e => {
    const b = e.target.closest('.ad__pick-b'); if(!b) return;
    type = b.dataset.v;
    w.querySelectorAll('#pType .ad__pick-b').forEach(x => x.setAttribute('aria-pressed', x.dataset.v===type?'true':'false'));
    paintType();
  };
  w.querySelector('#pX').onclick = () => w.remove();
  w.onclick = e => { if(e.target===w) w.remove(); };
  w.querySelector('#pSave').onclick = () => {
    const code = w.querySelector('#pc').value.trim().toUpperCase();
    const value = type === 'freeship' ? 0 : +w.querySelector('#pv').value;
    if(!code) return toast('Введите код');
    if(type !== 'freeship' && !(value > 0)) return toast('Укажите значение');
    const data = {
      code, type, value,
      minSum:+w.querySelector('#pm').value||0,
      limit:+w.querySelector('#pl').value||0,
      note:w.querySelector('#pn').value.trim(),
      on:w.querySelector('#po').checked,
      used: d.used||0
    };
    if(p) Object.assign(p, data);
    else CMS.promos.push({id:Date.now(), ...data});
    saveCms(); w.remove(); paintAdmin(); toast('Промокод сохранён');
  };
}

/* ==========================================================
   АДМИН: «О БРЕНДЕ» БЛОКАМИ
   Страница собирается из кусочков — ряд фото и текст, в любом порядке.
   Хранится в CMS.about.blocks, на витрине рисует aboutBlocksHTML().
   ========================================================== */
const MAX_ABOUT_BLOCKS = 12;
const MAX_ABOUT_PHOTOS = 8;

function aboutList(){
  if(!CMS.about || typeof CMS.about !== 'object') CMS.about = {blocks: []};
  if(!Array.isArray(CMS.about.blocks)) CMS.about.blocks = [];
  return CMS.about.blocks;
}

function aboutEditorHTML(){
  const list = aboutList();
  const rows = list.length ? list.map((b, i) => {

      ? (imgs.length ? `<img class="ad__th" src="${esc(imgs[0])}" alt="">` : `<span class="ad__th"></span>`)
      : `<span class="ad__th ad__th--tx">Aa</span>`;
    const title = isPh ? `Фото · ${imgs.length} шт` : (String(b.title || '').trim() || 'Текст');
    const sub = isPh
      ? (b.caption ? esc(b.caption) : 'без подписи')
      : esc(String(b.body || '').replace(/\s+/g, ' ').slice(0, 70) || 'пусто');
    return `<div class="ad__row">
      ${preview}
      <div class="ad__i">
        <span class="ad__n">${esc(title)}</span>
        <span class="ad__m">${sub}</span>

        <button class="ad__ib" data-abmv="${b.id}:-1" aria-label="Выше"${i === 0 ? ' disabled' : ''}>${svg('chevU','ic')}</button>
        <button class="ad__ib" data-abmv="${b.id}:1" aria-label="Ниже"${i === list.length - 1 ? ' disabled' : ''}>${svg('chevD','ic')}</button>
        <button class="ad__ib" data-abed="${b.id}" aria-label="Изменить">${svg('pencil','ic')}</button>
        <button class="ad__ib ad__ib--d" data-abrm="${b.id}" aria-label="Удалить">${svg('trash','ic')}</button>
      </div>
    </div>`;
  }).join('')
    : `<div class="ad__empty"><b>Блоков пока нет</b>Добавьте ряд фото и текст — страница «О бренде» соберётся из них.</div>`;

      ${list.length} из ${MAX_ABOUT_BLOCKS} блоков.</p>

      <button class="ad__b ad__b--pri" id="abAddPh"${list.length >= MAX_ABOUT_BLOCKS ? ' disabled' : ''}>+ Ряд фото</button>
      <button class="ad__b" id="abAddTx"${list.length >= MAX_ABOUT_BLOCKS ? ' disabled' : ''}>+ Текст</button>
    </div>
    <div class="ad__list">${rows}</div>
  </div>`;
}

function aboutBlockForm(block){
  const b = block || {};
  const isPh = b.type === 'photos';
  const w = document.createElement('div');
  w.className = 'ad__form';
  w.innerHTML = `<div class="ad__card">
    <h2 class="ad__ct">${b.id ? 'Изменить блок' : (isPh ? 'Ряд фото' : 'Текст')}</h2>
    ${isPh ? `
      ${photoSpecHTML('about')}
      <label class="ad__l">Фото — до ${MAX_ABOUT_PHOTOS} шт</label>
      <div class="ad__gal" id="abGal"></div>
      <input type="file" id="abFile" accept="image/*" multiple class="hide" aria-hidden="true">
      <label class="ad__l">Подпись под рядом (не обязательно)</label>
      <input class="ad__f" id="abCap" value="${esc(b.caption || '')}" placeholder="Съёмка новой коллекции">
    ` : `
      <label class="ad__l">Заголовок (не обязательно)</label>
      <input class="ad__f" id="abTitle" value="${esc(b.title || '')}" placeholder="ФИЛОСОФИЯ НАЗВАНИЯ">
      <label class="ad__l">Текст — абзацы через Enter</label>
      <textarea class="ad__f" id="abBody" rows="7" placeholder="Привет! Это Ирина и Валерий — основатели бренда.">${esc(b.body || '')}</textarea>
    `}
    <div class="ad__foot">
      <button class="ad__b" id="abCancel">Отмена</button>
      <button class="ad__b ad__b--pri" id="abSave">Сохранить</button>
    </div>
  </div>`;
  adm.appendChild(w);

  let gal = (b.imgs || []).filter(Boolean).slice(0, MAX_ABOUT_PHOTOS);
  if(isPh){
    const grid = w.querySelector('#abGal');
    const file = w.querySelector('#abFile');
    const paint = () => {
      grid.innerHTML = gal.map((src, i) => `
        <div class="ad__gal-item">
          <img src="${esc(src)}" alt="Фото ${i + 1}">
          <button type="button" class="ad__gal-x" data-abdel="${i}" aria-label="Убрать">${svg('x','ic ic--xs')}</button>
        </div>`).join('') +
        (gal.length < MAX_ABOUT_PHOTOS
          ? `<button type="button" class="ad__gal-add" id="abPick">${svg('plus','ic')}<span>Загрузить</span></button>`
          : '');
      const pick = grid.querySelector('#abPick');
      if(pick) pick.onclick = () => file.click();
      grid.querySelectorAll('[data-abdel]').forEach(btn => {
        btn.onclick = () => { gal.splice(+btn.dataset.abdel, 1); paint(); };
      });
    };
    paint();
    file.onchange = async () => {
      const room = MAX_ABOUT_PHOTOS - gal.length;
      for(const f of [...(file.files || [])].slice(0, room)){
        if(!String(f.type || '').startsWith('image/')){ toast('Нужны изображения'); continue; }
        try{
          const raw = await readFileAsDataURL(f);
          gal.push(await compressDataUrl(raw, 1400, 0.84));
        }catch(_){ toast('Не удалось прочитать фото'); }
      }
      file.value = '';
      paint();
    };
  }

  w.querySelector('#abCancel').onclick = () => w.remove();
  w.querySelector('#abSave').onclick = () => {
    const list = aboutList();
    const fresh = !b.id;
    const next = fresh
      ? {id: 'ab' + Date.now().toString(36), type: isPh ? 'photos' : 'text'}
      : list.find(x => String(x.id) === String(b.id));
    if(!next) return w.remove();
    if(isPh){
      if(!gal.length) return toast('Добавьте хотя бы одно фото');
      next.imgs = gal;
      next.caption = w.querySelector('#abCap').value.trim();
    } else {
      const title = w.querySelector('#abTitle').value.trim();
      const body = w.querySelector('#abBody').value.trim();
      if(!title && !body) return toast('Заполните заголовок или текст');
      next.title = title;
      next.body = body;
    }
    if(fresh){
      if(list.length >= MAX_ABOUT_BLOCKS) return toast('Максимум ' + MAX_ABOUT_BLOCKS + ' блоков');
      list.push(next);
    }
    saveCms();
    w.remove();
    paintAdmin();
    toast('Блок сохранён');
  };
}

function bindAboutEditor(root){
  const pick = id => aboutList().find(x => String(x.id) === String(id));
  root.querySelector('#abAddPh')?.addEventListener('click', () => aboutBlockForm({type: 'photos'}));
  root.querySelector('#abAddTx')?.addEventListener('click', () => aboutBlockForm({type: 'text'}));
  root.querySelectorAll('[data-abed]').forEach(b => {
    b.onclick = () => { const x = pick(b.dataset.abed); if(x) aboutBlockForm(x); };
  });
  root.querySelectorAll('[data-abrm]').forEach(b => {
    b.onclick = () => {
      const list = aboutList();
      const i = list.findIndex(x => String(x.id) === String(b.dataset.abrm));
      if(i < 0) return;
      list.splice(i, 1);
      saveCms(); paintAdmin(); toast('Блок удалён');
    };
  });
  root.querySelectorAll('[data-abmv]').forEach(b => {
    b.onclick = () => {
      const parts = b.dataset.abmv.split(':');
      const list = aboutList();
      const i = list.findIndex(x => String(x.id) === String(parts[0]));
      const j = i + (+parts[1]);
      if(i < 0 || j < 0 || j >= list.length) return;
      const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
      saveCms(); paintAdmin();
    };
  });
}

let adRvF = 'all';

function adRvCount(){
  const live = REVIEWS.filter(r => reviewBelongsToProduct(r, byId(r.pid)));
  return {
    all:  live.length,
    new:  live.filter(r => r.status === 'new').length,
    ok:   live.filter(r => r.status === 'ok').length,
    hide: live.filter(r => r.status === 'hide').length
  };
}

function viewReviews(){
  const cfg = rvCfg();
  const c = adRvCount();
  const list = REVIEWS
    .filter(r => reviewBelongsToProduct(r, byId(r.pid)))
    .filter(r => adRvF === 'all' ? true : r.status === adRvF)
    .sort((a,b) => (a.status === 'new' ? -1 : 0) - (b.status === 'new' ? -1 : 0) || b.ts - a.ts);

  const rows = list.length ? list.map(r => {
    const p = byId(r.pid);
    const fit = RV_FITS.find(f => f.k === +r.fit);

        <p class="ad__rv-m">${esc(r.name)} · ${rvDate(r.ts)} · ${p ? esc(p.name) : 'товар удалён'}${r.size ? ' · ' + esc(r.size) : ''}${fit ? ' · ' + fit.t.toLowerCase() : ''}</p>
        <p class="ad__rv-t">${esc(r.text)}</p>

        <button class="ad__ib" data-rvhide="${r.id}" aria-label="Показать или скрыть">${svg(r.status === 'hide' ? 'eyeOff' : 'eye','ic')}</button>

    </div>`;
  }).join('') : `<div class="ad__empty"><b>Отзывов нет</b>Здесь появятся отзывы покупателей — их можно публиковать, скрывать и отвечать.</div>`;

/* Разбор вставленного списка: код;город;адрес;часы;широта;долгота */
function pvzImport(raw){
  const lines = String(raw || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  let added = 0, bad = 0;
  lines.forEach(line => {
    const c = line.split(';').map(s => s.trim());
    if(c.length < 6){ bad++; return; }
    const lat = parseFloat(c[4].replace(',', '.'));
    const lng = parseFloat(c[5].replace(',', '.'));
    if(!c[1] || !c[2] || !isFinite(lat) || !isFinite(lng)){ bad++; return; }
    if(CMS.pvz.some(p => p.code === c[0] && c[0])){ bad++; return; }
    CMS.pvz.push({
      id: CMS.pvz.reduce((m,x) => Math.max(m, +x.id || 0), 0) + 1,
      code: c[0] || ('PVZ-' + Date.now().toString(36) + added),
      city: c[1], addr: c[2], hours: c[3] || '', lat, lng, demo:false
    });
    added++;
  });
  if(added) saveCms();
  return {added, bad};
}

/* Что уже нарисовано в панели. Без этой проверки любой фоновый опрос
   сервера перерисовывал панель целиком — терялась прокрутка, слетал
   набранный в полях текст, и экран заметно моргал. */
let _admPaintKey = '';

function paintAdmin(){
  const root = adm.querySelector('.ad');
  if(!root) return;
  const main = root.querySelector('.ad__main');
  const nav = root.querySelector('.ad__nav');
  if(nav){
    nav.querySelectorAll('[data-adtab]').forEach(b => {
      b.setAttribute('aria-current', b.dataset.adtab===adTab?'true':'false');
    });
  }
  const views = {dash:viewDash, catalog:viewCatalog, orders:viewOrders, reviews:viewReviews, clients:viewClients,
    logo:viewLogo, slider:viewSlider, tryon:viewTryon, promo:viewPromo, content:viewContent};
  if(adTab === 'pvz') adTab = 'dash';
  const html = (views[adTab]||viewDash)();
  const key = adTab + '\n' + html;
  /* ничего не поменялось — не трогаем DOM вообще */
  if(key === _admPaintKey && main.innerHTML){
    const c0 = root.querySelector('.ad__c');
    if(c0) c0.textContent = adOrdersLine(analytics());
    return;
  }
  _admPaintKey = key;
  main.innerHTML = html;
  bindAdminView();
  const c = root.querySelector('.ad__c');
  if(c){
    const a = analytics();
    c.textContent = adOrdersLine(a);
  }
}
